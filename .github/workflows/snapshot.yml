name: 대시보드 스냅샷 자동 갱신

# 한국 장중 2시간 간격(09·11·13·15시 KST) + 수동 실행
# KST = UTC+9 → UTC 00,02,04,06시 (평일)
on:
  schedule:
    - cron: '0 0,2,4,6 * * 1-5'
  workflow_dispatch:        # GitHub UI에서 수동 실행 버튼

# docs/index.html 커밋 푸시 권한
permissions:
  contents: write

# 동시 실행 방지 (이전 것 취소)
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (root + server)
        run: |
          npm ci || npm install
          cd server && (npm ci || npm install)

      - name: FRED 키 주입 (경제지표용, 시크릿 있을 때만)
        run: |
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY }}" > .env

      - name: 서버 기동 (백그라운드)
        run: |
          cd server && npm start > /tmp/server.log 2>&1 &
          echo "서버 시작 대기..."

      - name: 서버 준비 대기 (ETF 목록 캐시 완료까지)
        run: |
          for i in $(seq 1 60); do
            if curl -s "http://localhost:3002/api/funds/naver/list?limit=1" 2>/dev/null | grep -q '"results"'; then
              echo "✅ 서버 준비됨 ($((i*3))초)"; exit 0
            fi
            sleep 3
          done
          echo "❌ 서버 준비 타임아웃"; cat /tmp/server.log; exit 1

      - name: 스냅샷 생성
        run: npm run snapshot

      - name: 변경분 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/fear_greed_history.csv data/vix_history.csv
          if git diff --cached --quiet; then
            echo "변경 없음 — 푸시 생략"
          else
            git commit -m "자동 스냅샷 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
            git push
          fi
