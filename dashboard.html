<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EM/Asia Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    /* Mirae Asset Brand */
    --mirae-navy: #043b72;
    --mirae-navy-light: #0a5ca8;
    --mirae-orange: #e37500;
    --mirae-orange-hover: #ff8a1a;
    /* Dark theme */
    --bg-base: #0b0f1a;           /* page background */
    --bg-card: #141a2a;            /* card / panel */
    --bg-card-hover: #1a2134;
    --bg-elevated: #1e2538;        /* nested panel */
    --bg-input: #0f1522;           /* input field */
    --border-subtle: #1f2738;
    --border-default: #2a334a;
    --border-strong: #3a4561;
    --text-main: #e8ebf2;          /* near-white */
    --text-sub: #a0a8bc;            /* gray-ish */
    --text-muted: #667088;
    --up-color: #ef4444;
    --down-color: #60a5fa;
    --card-bg: var(--bg-card);
    --text-sub-legacy: var(--text-sub);
    --border-color: var(--border-subtle);
  }
  body {
    font-family: 'Noto Sans KR', 'Pretendard', sans-serif;
    margin: 0;
    background: var(--bg-base);
    color: var(--text-main);
  }
  .up { color: var(--up-color); font-weight: 600; }
  .down { color: var(--down-color); font-weight: 600; }
  .tab-active { color: var(--mirae-orange); font-weight: 700; border-bottom: 3px solid var(--mirae-orange); }
  .tab-inactive { color: var(--text-sub); cursor: pointer; font-weight: 500; border-bottom: 3px solid transparent; }
  .tab-inactive:hover { color: var(--mirae-orange); }
  .spinner { width: 32px; height: 32px; border: 3px solid #2a334a; border-top-color: var(--mirae-orange); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.35); }
  .group-header { background: var(--bg-elevated); border-bottom: 1px solid var(--border-default); }
  .fx-row { background: var(--bg-elevated); }
  .etf-table tbody tr:hover { background: var(--bg-card-hover); }
  .etf-table tbody tr:hover td:first-child { background: var(--bg-card-hover) !important; }
  table { border-collapse: collapse; }

  /* ETF FINDER 목록 헤더 틀고정 (스크롤 시 상단 고정) */
  #naverEtfList thead { position: sticky; top: 53px; z-index: 20; }
  body.embed-mode #naverEtfList thead { top: 0; }
  #naverEtfList thead td, #naverEtfList thead th { background: var(--bg-base); }
  /* 구성종목 상세 테이블은 자체 스크롤 박스 상단(top:0)에 고정 — 위 규칙의 top:53px 상속 방지 */
  #naverEtfList table.holdings-table thead { top: 0; z-index: 10; }
  #naverEtfList table.holdings-table thead th { background: #111827; }

  /* Mirae button */
  .btn-tiger { background: var(--mirae-orange); color: #fff; border-radius: 24px; padding: 0.6rem 1.5rem; font-weight: 700; transition: all 0.2s; }
  .btn-tiger:hover { background: var(--mirae-orange-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(227, 117, 0, 0.3); }
  .tiger-input { border: 2px solid var(--border-default); border-radius: 12px; padding: 0.6rem 1rem; transition: border-color 0.2s; background: var(--bg-input); color: var(--text-main); }
  .tiger-input:focus { border-color: var(--mirae-orange); outline: none; }

  /* ============================================================
     Override Tailwind light-theme classes → dark theme
     (user asked to keep brand orange/navy, black out white areas)
     ============================================================ */
  .bg-white { background-color: var(--bg-card) !important; }
  .bg-gray-50 { background-color: var(--bg-base) !important; }
  .bg-gray-100 { background-color: var(--bg-card-hover) !important; }
  .bg-gray-200 { background-color: var(--bg-elevated) !important; }

  .text-gray-900 { color: var(--text-main) !important; }
  .text-gray-800 { color: var(--text-main) !important; }
  .text-gray-700 { color: #d1d5db !important; }
  /* keep .text-gray-400 / 500 / 600 as they already look ok on dark */

  .border-gray-100 { border-color: var(--border-subtle) !important; }
  .border-gray-200 { border-color: var(--border-subtle) !important; }
  .border-gray-300 { border-color: var(--border-default) !important; }

  /* Inputs & placeholders */
  input[type="text"], input[type="search"], select, textarea {
    background-color: var(--bg-input) !important;
    color: var(--text-main) !important;
    border-color: var(--border-default) !important;
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted) !important; }
  .placeholder-gray-400::placeholder { color: var(--text-muted) !important; }

  /* Sticky tab bar — convert its white base to dark */
  header + div.bg-white {
    background-color: var(--bg-card) !important;
    border-bottom-color: var(--border-default) !important;
  }

  /* Brand-colored text tokens stay vivid on dark */
  .text-\[\#043b72\] { color: #5a8dd0 !important; }     /* navy → lighter navy for contrast */
  .text-\[\#e37500\] { color: var(--mirae-orange) !important; }
  .bg-\[\#043b72\] { background-color: var(--mirae-navy) !important; }
  .bg-\[\#e37500\] { background-color: var(--mirae-orange) !important; }
  .border-\[\#043b72\] { border-color: var(--mirae-navy-light) !important; }
  .border-\[\#e37500\] { border-color: var(--mirae-orange) !important; }
  .hover\:bg-\[\#032d56\]:hover { background-color: #032d56 !important; }
  .hover\:bg-\[\#c66600\]:hover { background-color: #c66600 !important; }
  .focus\:border-\[\#043b72\]:focus { border-color: var(--mirae-navy-light) !important; }
  .focus\:border-\[\#e37500\]:focus { border-color: var(--mirae-orange) !important; }

  /* Shadow lightening on dark cards */
  .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.4) !important; }
  .shadow-md { box-shadow: 0 4px 6px rgba(0,0,0,0.45) !important; }
  .shadow-lg { box-shadow: 0 10px 15px rgba(0,0,0,0.5) !important; }
  .shadow-inner { box-shadow: inset 0 2px 4px rgba(0,0,0,0.3) !important; }

  /* ETF category chips — inactive: dark, active: orange (handled via .naver-tab-active) */
  #naverTabContainer button:not(.naver-tab-active) {
    background: var(--bg-card) !important;
    border-color: var(--border-default) !important;
    color: var(--text-sub) !important;
  }
  #naverTabContainer button:not(.naver-tab-active):hover {
    border-color: var(--mirae-orange) !important;
    color: var(--mirae-orange) !important;
  }
  #naverTabContainer button.naver-tab-active {
    background: var(--bg-card) !important;
    border: 2px solid var(--mirae-orange) !important;
    color: var(--mirae-orange) !important;
  }

  /* Scrollbar dark */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app" class="min-h-screen pb-10">
  <div class="bg-white border-b border-gray-200 px-4 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto flex gap-8 overflow-x-auto no-scrollbar">
      <button onclick="switchTab('overview')" id="tab-overview" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">시황</button>
      <button onclick="switchTab('stocks')" id="tab-stocks" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">주요종목</button>
      <button onclick="switchTab('feargreed')" id="tab-feargreed" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">공포/탐욕</button>
      <button onclick="switchTab('vix')" id="tab-vix" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">VIX 변동성</button>
      <button onclick="switchTab('soxvol')" id="tab-soxvol" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">반도체 변동성</button>
      <button onclick="switchTab('funds')" id="tab-funds" class="py-4 px-1 text-[13px] tab-active whitespace-nowrap">ETF FINDER</button>
      <button onclick="switchTab('liquidity')" id="tab-liquidity" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">유동성분석</button>
      <button onclick="switchTab('rates')" id="tab-rates" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">금리&인플레</button>
      <button onclick="switchTab('valuation')" id="tab-valuation" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">밸류에이션</button>
      <button onclick="switchTab('fed')" id="tab-fed" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">경제지표</button>
      <button onclick="switchTab('backtest')" id="tab-backtest" class="py-4 px-1 text-[13px] tab-inactive whitespace-nowrap">📊 백테스트</button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-4">
    <div id="loading" class="flex flex-col items-center justify-center py-20 gap-3">
      <div class="spinner"></div>
      <p class="text-sm text-gray-500">데이터 불러오는 중...</p>
    </div>
    <div id="error" class="hidden card p-8 text-center">
      <p class="text-red-400 font-bold mb-2">서버 연결 실패</p>
      <p class="text-gray-400 text-sm mb-4">start.bat을 실행한 후 다시 시도하세요</p>
      <code class="text-xs text-gray-500 bg-[#14161f] px-3 py-1 rounded">http://localhost:3002</code>
    </div>
    <div id="content" class="hidden"></div>
  </main>

  <div class="border-t px-4 py-2 text-center text-xs" style="background:var(--bg-card);border-color:var(--border-subtle);color:var(--text-muted)">
    데이터 출처: Yahoo Finance (15~20분 지연) | localhost:3002
  </div>
</div>

<script>
const API = 'http://localhost:3002/api';
const COLS = ['1D','1W','YTD','1M','3M','6M','1Y','3Y/A','5Y/A','10Y/A'];
// 임베드 모드: ?only=funds (또는 ?embed=funds) → 해당 탭만 단독 표시 (iframe 삽입용)
const _embedOnly = (() => {
  try {
    const p = new URLSearchParams(location.search);
    const v = p.get('only') || p.get('embed');
    const validTabs = ['overview','stocks','feargreed','vix','funds','liquidity','valuation','fed','backtest'];
    return v && validTabs.includes(v) ? v : null;
  } catch { return null; }
})();
let currentTab = (() => {
  if (_embedOnly) return _embedOnly;
  try {
    const saved = localStorage.getItem('dashboardCurrentTab');
    const validTabs = ['overview','stocks','feargreed','vix','funds','liquidity','repression','valuation','fed'];
    if (saved && validTabs.includes(saved)) return saved;
  } catch {}
  return 'funds';
})();
let _overviewCache = null; // ? ?? 

function fmt(n, d=2) { return n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d}); }
function fmtPrice(n, isFx) {
  if (!isFx) return fmt(n);
  if (Math.abs(n) < 1) return n.toFixed(4);
  if (Math.abs(n) < 100) return n.toFixed(3);
  return fmt(n);
}
function retStr(v) {
  if (v == null) return '<span class="text-gray-600">-</span>';
  const cls = v >= 0 ? 'up' : 'down';
  return `<span class="${cls}">${(v>=0?'+':'')+v.toFixed(2)}%</span>`;
}

let _groupMeta = {};
function renderStocksWithSubtabs(data, currentMarket) {
  // ? render()???? ?? ???prepend
  render(data);
  const el = document.getElementById('content');
  const isCN = currentMarket.startsWith('cn');
  const markets = [
    { id: 'us',     label: '🇺🇸 미국' },
    { id: 'cn_sh',  label: '🇨🇳 A주', isCNParent: true },
    { id: 'hk',     label: '🇭🇰 홍콩' },
    { id: 'jp',     label: '🇯🇵 일본' },
    { id: 'tw',     label: '🇹🇼 대만' },
    { id: 'in',     label: '🇮🇳 인도' },
  ];
  const cnBoards = [
    { id: 'cn_sh',     label: '상해' },
    { id: 'cn_sz',     label: '선전' },
    { id: 'cn_star',   label: 'STAR' },
    { id: 'cn_chinext',label: 'ChiNext' },
  ];
  const mainTabHtml = '<div class="flex flex-wrap gap-2 mb-2 border-b border-[#2a2d3a] pb-2">' +
    markets.map(m => {
      const active = m.isCNParent ? isCN : m.id === currentMarket;
      const targetId = m.isCNParent ? 'cn_sh' : m.id;
      return '<button onclick="switchStocksMarket(\'' + targetId + '\')" class="px-3 py-1.5 text-sm rounded ' +
        (active ? 'bg-blue-600 text-white font-semibold' : 'bg-gray-700 text-gray-400 hover:bg-gray-600') + '">' +
        m.label + '</button>';
    }).join('') + '</div>';
  const cnSubTabHtml = isCN
    ? '<div class="flex gap-2 mb-3">' +
      cnBoards.map(m => {
        const active = m.id === currentMarket;
        return '<button onclick="switchStocksMarket(\'' + m.id + '\')" class="px-3 py-1.5 text-xs rounded border ' +
          (active ? 'border-blue-500 bg-blue-900/40 text-blue-300 font-semibold' : 'border-gray-700 bg-gray-800/50 text-gray-400 hover:bg-gray-700') + '">' +
          m.label + '</button>';
      }).join('') + '</div>'
    : '';
  el.innerHTML = mainTabHtml + cnSubTabHtml + el.innerHTML;
}
window.renderStocksWithSubtabs = renderStocksWithSubtabs;

const _mktLabel = {
  cn_sh:'중국 (Shanghai)', cn_sz:'선전 (Shenzhen)',
  cn_star:'커촹판 (STAR)', cn_chinext:'창업판 (ChiNext)',
  hk:'홍콩', jp:'일본', tw:'대만', in:'인도', us:'미국'
};
async function switchStocksMarket(market) {
  window._stocksMarket = market;
  // ?????  
  const el = document.getElementById('content');
  el.innerHTML = '<div class="flex items-center justify-center py-20 text-gray-400 text-sm">' +
    (_mktLabel[market] || market) + ' TOP 10 데이터 불러오는 중...</div>';
  refresh();
}
window.switchStocksMarket = switchStocksMarket;

function render(data) {
  // Group by group name, preserving order
  const groups = [];
  const groupMap = new Map();
  for (const item of data) {
    const g = item.group || '기타';
    if (!groupMap.has(g)) { groupMap.set(g, []); groups.push(g); }
    groupMap.get(g).push(item);
  }

  let html = `
    <div class="card overflow-x-auto shadow-xl" style="max-height:calc(100vh - 120px); overflow-y:auto">
      <table class="w-full text-sm etf-table">
        <thead class="sticky top-0 z-20">
          <tr class="border-b" style="background:var(--bg-elevated);border-color:var(--border-default)">
            <th class="text-left py-4 px-4 text-[#043b72] font-bold sticky left-0 z-30" style="min-width:140px;background:var(--bg-elevated)"></th>
            ${currentTab === 'stocks' ? '<th class="px-2 py-4 text-right text-[#043b72] font-bold text-[11px]" style="min-width:120px">시가총액</th><th class="px-2 py-4 text-center text-[#043b72] font-bold text-[11px]" style="min-width:90px">PER / FW</th>' : ''}
            ${currentTab !== 'stocks' ? '<th class="px-2 py-4 text-center text-[#e37500] font-bold text-[11px]" style="min-width:100px">실시간</th><th class="px-3 py-4 text-center text-[#e37500] font-bold text-[11px]" style="min-width:80px">등락률</th>' : ''}
            <th class="px-2 py-4 text-center text-gray-500 font-bold text-[11px]" style="min-width:100px">종가</th>
            <th class="px-3 py-4 text-center text-gray-500 font-bold" style="min-width:80px">1D</th>
            <th class="px-3 py-4 text-center text-gray-500 font-bold" style="min-width:80px">1W</th>
            ${COLS.slice(2).map(c => `<th class="px-3 py-4 text-center text-gray-500 font-bold" style="min-width:70px">${c}</th>`).join('')}
          </tr>
        </thead>
        <tbody>`;

  for (const g of groups) {
    let items = groupMap.get(g);
    // stocks ?? ? ? ?
    if (currentTab === 'stocks') {
      items = [...items].sort((a, b) => (b.marketCapKrw || 0) - (a.marketCapKrw || 0));
    }
    // Group separator row
    const marketHours = _groupMeta[g] || '';
    html += `<tr class="group-header"><td colspan="${4+COLS.length}" class="py-2 px-4 sticky left-0 group-header">
      <span class="text-xs font-bold text-[#043b72]">${g}</span>
      ${marketHours ? `<span class="ml-2 text-[10px] text-gray-400 font-normal">${marketHours}</span>` : ''}
    </td></tr>`;

    for (const item of items) {
      const isFx = item.type === 'fx';
      const rowClass = isFx ? 'fx-row' : '';
      const nameColor = isFx ? 'text-[#043b72]' : 'text-gray-900';
      const isOpen = item.marketState === 'OPEN';

      // 1D basis: closeBase vs prevBase
      const d1Basis = item.closeBase && item.prevBase
        ? `${item.prevBase.slice(5)} → ${item.closeBase.slice(5)}`
        : (item.closeBase ? item.closeBase.slice(5) : '-');
      // 1W basis
      const w1Basis = item.weekBase && item.closeBase
        ? `${item.weekBase.slice(5)} → ${item.closeBase.slice(5)}`
        : '-';

      html += `
        <tr class="border-b transition-colors ${rowClass}" style="border-color:var(--border-subtle)">
          <td class="py-3 px-4 sticky left-0 z-10" style="background:${isFx ? 'var(--bg-elevated)' : 'var(--bg-card)'}">
            <div class="flex items-center gap-2">
              ${isFx ? '<span class="text-[10px] text-blue-500">💱</span>' : `<span class="w-2 h-2 rounded-full shrink-0 ${isOpen ? 'bg-green-500 animate-pulse' : 'bg-gray-300'}"></span>`}
              <div>
                <span class="font-bold ${nameColor} text-[13px]">${item.name}</span>
                <a href="https://finance.yahoo.com/quote/${encodeURIComponent(item.symbol)}" target="_blank" class="ml-1.5 text-[10px] text-gray-400 hover:text-[#e37500]">${item.symbol}</a>
              </div>
            </div>
          </td>
          ${currentTab === 'stocks' ? (() => {
            return `<td class="text-right py-1 px-2">
              <div class="font-bold text-gray-800 text-[12px]">${fmtKRW(item.marketCapKrw)}</div>
              <div class="text-[9px] text-gray-400">${fmtLocal(item.marketCapLocal, item.marketCapCurrency)}</div>
            </td>
            <td class="text-center py-1 px-2">
              <div class="text-[11px] ${peColor(item.trailingPE)}">TTM <span class="font-bold">${fmtPE(item.trailingPE)}</span></div>
              <div class="text-[11px] ${peColor(item.forwardPE)}">FW <span class="font-bold">${fmtPE(item.forwardPE)}</span></div>
            </td>`;
          })() : ''}
          ${currentTab !== 'stocks' ? `<td class="text-center py-1 px-2">${
            item.livePrice != null
              ? `<div class="font-black text-[#e37500] text-[13px]">${fmtPrice(item.livePrice, isFx)}</div>
                 <div class="text-[9px] text-gray-400">${item.realtimeKST || ''} KST</div>`
              : '<span class="text-gray-300">-</span>'
          }</td>
          <td class="px-3 py-1 text-center">${
            item.realtime != null
              ? `<div class="text-[13px] font-bold ${item.realtime >= 0 ? 'text-[#e7280f]' : 'text-[#0066cc]'}">${(item.realtime >= 0 ? '+' : '') + item.realtime.toFixed(2)}%</div>`
              : '<span class="text-gray-300">-</span>'
          }</td>` : ''}
          <td class="text-center py-1 px-2">
            <div class="font-bold ${isFx ? 'text-[#043b72]' : 'text-gray-800'} text-[13px]">${fmtPrice(item.closePrice || 0, isFx)}</div>
            <div class="text-[9px] text-gray-400">${item.closeKST ? item.closeKST + ' KST' : (item.closeBase ? item.closeBase.slice(5) : '-')}</div>
          </td>
          <td class="px-3 py-1 text-center text-[13px] font-bold">${retStr(item.returns?.['1D'])}</td>
          <td class="px-3 py-1 text-center text-[13px] font-bold">${retStr(item.returns?.['1W'])}</td>
          ${COLS.slice(2).map(c => `<td class="px-3 py-1 text-center text-[13px] font-bold">${retStr(item.returns?.[c])}</td>`).join('')}
        </tr>`;
    }
  }

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

// === Fear & Greed ??===
function renderFearGreed(data) {
  const { current } = data;
  const history = (data.history || []).filter(d => d.date >= '2011-01-03');
  const score = current.score.toFixed(1);
  const rating = current.rating;

  // ? ?
  function fgColor(v) {
    if (v <= 25) return '#ef4444';  // Extreme Fear
    if (v <= 45) return '#f97316';  // Fear
    if (v <= 55) return '#eab308';  // Neutral
    if (v <= 75) return '#84cc16';  // Greed
    return '#22c55e';               // Extreme Greed
  }
  function fgLabel(r) {
    const map = { 'extreme fear':'극도의 공포', 'fear':'공포', 'neutral':'중립', 'greed':'탐욕', 'extreme greed':'극도의 탐욕' };
    return map[r] || r;
  }

  const color = fgColor(current.score);

  let html = `
    <div class="flex flex-col items-center py-10">
      <!-- Gauge -->
      <div class="relative w-56 h-56 mb-6">
        <svg viewBox="0 0 200 200" class="w-full h-full">
          <circle cx="100" cy="100" r="85" fill="none" stroke="#f0f0f0" stroke-width="14"/>

function computeEpisodes(threshold) {
  const hist = window._fgFullHistory;
  const spxAll = window._fgSpxData || [];
  if (!hist || !hist.length) return { episodes: [], summary: {} };
  const spxMap = {};
  spxAll.forEach(s => { spxMap[s.date] = s; });
  const merged = hist.map(d => {
    const spx = spxMap[d.date];
    return { date: d.date, fg: d.value, spxClose: spx ? spx.close : null };
  }).filter(d => d.spxClose);

  //   
  function findPeak(idx) {
    let pv = 0, pd = '';
    for (let j = 0; j < idx; j++) { if (merged[j].spxClose > pv) { pv = merged[j].spxClose; pd = merged[j].date; } }
    return { pv, pd };
  }

  const episodes = [];
  let ep = null;
  for (let i = 0; i < merged.length; i++) {
    const d = merged[i];
    if (d.fg <= threshold) {
      if (!ep) {
        const pk = findPeak(i);
        ep = { startDate: d.date, startIdx: i, minFg: d.fg, minFgDate: d.date, spxPeak: pk.pv, spxPeakDate: pk.pd, spxMin: d.spxClose, spxMinDate: d.date, days: [] };
      }
      if (d.fg < ep.minFg) { ep.minFg = d.fg; ep.minFgDate = d.date; }
      if (d.spxClose < ep.spxMin) { ep.spxMin = d.spxClose; ep.spxMinDate = d.date; }
      ep.days.push(d);
    } else if (ep) {
      const last = ep.days[ep.days.length - 1];
      ep.endDate = last.date;
      ep.duration = ep.days.length;
      ep.maxDrawdown = ep.spxPeak > 0 ? Math.round((ep.spxMin / ep.spxPeak - 1) * 10000) / 100 : 0;
      const fgMinI = ep.days.findIndex(dd => dd.date === ep.minFgDate);
      const spxMinI = ep.days.findIndex(dd => dd.date === ep.spxMinDate);
      ep.daysToFgMin = fgMinI >= 0 ? fgMinI : null;
      ep.daysToSpxMin = spxMinI >= 0 ? spxMinI : null;
      ep.fgSpxGap = (fgMinI >= 0 && spxMinI >= 0) ? fgMinI - spxMinI : null;
      // ?reed75
      const startSpx = merged[ep.startIdx].spxClose;
      for (let k = ep.startIdx + 1; k < merged.length; k++) {
        if (merged[k].fg >= 75) { ep.entryToGreedDays = k - ep.startIdx; ep.entryToGreedDate = merged[k].date; ep.entryToGreedReturn = Math.round((merged[k].spxClose / startSpx - 1) * 10000) / 100; break; }
      }
      // F&G???Greed75
      const fgMIdx = merged.findIndex(m => m.date === ep.minFgDate);
      if (fgMIdx >= 0) {
        const bSpx = merged[fgMIdx].spxClose;
        for (let k = fgMIdx + 1; k < merged.length; k++) {
          if (merged[k].fg >= 75) { ep.bottomToGreedDays = k - fgMIdx; ep.bottomToGreedDate = merged[k].date; ep.bottomToGreedReturn = Math.round((merged[k].spxClose / bSpx - 1) * 10000) / 100; break; }
        }
      }
      ep.minFg = Math.round(ep.minFg * 10) / 10;
      ep.spxMin = Math.round(ep.spxMin * 100) / 100;
      ep.spxPeak = Math.round(ep.spxPeak * 100) / 100;
      delete ep.days; delete ep.startIdx;
      episodes.push(ep);
      ep = null;
    }
  }
  if (ep) {
    ep.endDate = null; ep.duration = ep.days.length; ep.ongoing = true;
    ep.maxDrawdown = ep.spxPeak > 0 ? Math.round((ep.spxMin / ep.spxPeak - 1) * 10000) / 100 : 0;
    const fgMinI = ep.days.findIndex(dd => dd.date === ep.minFgDate);
    const spxMinI = ep.days.findIndex(dd => dd.date === ep.spxMinDate);
    ep.daysToFgMin = fgMinI >= 0 ? fgMinI : null;
    ep.daysToSpxMin = spxMinI >= 0 ? spxMinI : null;
    ep.fgSpxGap = (fgMinI >= 0 && spxMinI >= 0) ? fgMinI - spxMinI : null;
    ep.minFg = Math.round(ep.minFg * 10) / 10;
    ep.spxMin = Math.round(ep.spxMin * 100) / 100;
    ep.spxPeak = Math.round(ep.spxPeak * 100) / 100;
    delete ep.days; delete ep.startIdx;
    episodes.push(ep);
  }
  // ?
  const ce = episodes.filter(e => !e.ongoing);
  const avg = (arr, fn) => { const v = arr.map(fn).filter(x => x != null); return v.length > 0 ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null; };
  const summary = {
    totalEpisodes: episodes.length,
    avgDuration: avg(ce, e=>e.duration),
    maxDuration: ce.length > 0 ? Math.max(...ce.map(e=>e.duration)) : 0,
    medianDuration: (() => { const s=ce.map(e=>e.duration).sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length>0?(s.length%2?s[m]:(s[m-1]+s[m])/2):0; })(),
    avgMinFg: avg(ce, e=>e.minFg),
    avgMaxDrawdown: avg(ce, e=>e.maxDrawdown),
    avgDaysToFgMin: avg(ce, e=>e.daysToFgMin),
    avgDaysToSpxMin: avg(ce, e=>e.daysToSpxMin),
    avgFgSpxGap: avg(ce, e=>e.fgSpxGap),
    avgEntryToGreedDays: avg(ce, e=>e.entryToGreedDays),
    avgEntryToGreedReturn: avg(ce, e=>e.entryToGreedReturn),
    avgBottomToGreedDays: avg(ce, e=>e.bottomToGreedDays),
    avgBottomToGreedReturn: avg(ce, e=>e.bottomToGreedReturn),
  };
  return { episodes, summary };
}

function setEpThreshold(thresh, isInit) {
  window._epThreshold = thresh;
  // 버튼 활성 상태 갱신
  document.querySelectorAll('#epThreshBtns button').forEach(btn => {
    const t = parseInt(btn.dataset.thresh);
    btn.className = 'px-2 py-0.5 text-[11px] rounded ' + (t === thresh ? 'bg-red-600 text-white' : 'text-gray-500 hover:bg-[#1e2030]');
  });
  document.getElementById('epThreshLabel').textContent = thresh;

  // threshold 에 따라 서버 데이터 또는 로컬 계산 사용
  let episodes, es;
  if (thresh === 25 && window._epServerData) {
    episodes = window._epServerData.episodes;
    es = window._epServerData.epSummary;
  } else {
    const result = computeEpisodes(thresh);
    episodes = result.episodes;
    es = result.summary;
  }

  window._epData = episodes;
  window._epSortKey = null;
  window._epSortAsc = true;

  // ? + ???
  renderEpDynamic(es);

  // ????(??????)
  const seq = (min, max) => { const a=[]; for(let i=min;i<=max+1;i++) a.push(i); return a; };
  if (episodes.length > 0) {
    drawHistogram('histDuration', '지속기간 분포 (≤'+thresh+')', episodes.map(e => e.duration), seq(1, Math.max(...episodes.map(e=>e.duration))), '일', '#60a5fa');
    drawHistogram('histMinFg', 'F&G 최저치 분포 (≤'+thresh+')', episodes.map(e => Math.floor(e.minFg)), seq(0, thresh), '', '#f87171');
  }
}

function drawHistogram(canvasId, title, values, edges, unit, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !values.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  const h = 150;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.scale(dpr, dpr);

  // bin  (1?)
  const bins = [];
  for (let b = 0; b < edges.length - 1; b++) {
    const lo = edges[b], hi = edges[b + 1];
    const isLast = b === edges.length - 2;
    const count = values.filter(v => isLast ? (v >= lo) : (v >= lo && v < hi)).length;
    bins.push({ lo, hi, label: String(lo), count });
  }
  const maxCount = Math.max(...bins.map(b => b.count), 1);

  const pad = { top: 24, bottom: 22, left: 28, right: 6 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const barW = Math.max(cw / bins.length - 1, 1);
  const totalBarW = barW * bins.length;
  const gapTotal = cw - totalBarW;
  const gap = bins.length > 1 ? gapTotal / (bins.length) : 0;

  // ?
  ctx.fillStyle = '#d1d5db';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText(title, pad.left, 14);

  // ?
  ctx.strokeStyle = '#2a2d3a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + ch);
  ctx.lineTo(pad.left + cw, pad.top + ch);
  ctx.stroke();

  // x??  
  const labelStep = Math.max(1, Math.ceil(bins.length / (w / 20)));

  //  ????(?????)
  const logMax = Math.log(maxCount + 1);
  const logH = (count) => count > 0 ? (Math.log(count + 1) / logMax) * ch : 0;

  // ????????(???
  const barData = [];
  bins.forEach((bin, i) => {
    const x = pad.left + gap / 2 + i * (barW + gap);
    const bh = logH(bin.count);
    const y = pad.top + ch - bh;
    ctx.fillStyle = color;
    ctx.globalAlpha = bin.count > 0 ? 0.85 : 0.15;
    ctx.fillRect(x, y, Math.max(barW, 1), Math.max(bh, 0));
    ctx.globalAlpha = 1;
    barData.push({ x, w: barW, y, h: bh, bin: bin.lo, count: bin.count });

    // count ? (?? )
    if (bin.count > 0 && bh > 12) {
      ctx.fillStyle = '#e5e7eb';
      ctx.font = '8px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(bin.count, x + barW / 2, y - 2);
    }

    // x??
    if (i % labelStep === 0) {
      ctx.fillStyle = '#9ca3af';
      ctx.font = '8px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(bin.label, x + barW / 2, pad.top + ch + 11);
    }
  });

  // y??
  ctx.fillStyle = '#6b7280';
  ctx.font = '9px sans-serif';
  ctx.textAlign = 'right';
  for (let t = 0; t <= 4; t++) {
    const v = Math.round(maxCount * t / 4);
    const logY = logH(v);
    const y = pad.top + ch - logY;
    ctx.fillText(v, pad.left - 4, y + 3);
    if (t > 0) {
      ctx.strokeStyle = '#1e2030';
      ctx.beginPath();
      ctx.moveTo(pad.left + 1, y);
      ctx.lineTo(pad.left + cw, y);
      ctx.stroke();
    }
  }

  // ?
  const tooltip = document.createElement('div');
  tooltip.className = 'fixed bg-gray-900 border border-gray-600 text-[10px] text-white px-2 py-1 rounded pointer-events-none z-50 hidden';
  document.body.appendChild(tooltip);
  if (canvas._histMouseMove) canvas.removeEventListener('mousemove', canvas._histMouseMove);
  if (canvas._histMouseLeave) canvas.removeEventListener('mouseleave', canvas._histMouseLeave);
  canvas._histMouseMove = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const cx = (ev.clientX - rect.left) * (canvas.width / rect.width / (window.devicePixelRatio || 1));
    const cy = (ev.clientY - rect.top) * (canvas.height / rect.height / (window.devicePixelRatio || 1));
    const hit = barData.find(b => cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h && b.count > 0);
    if (hit) {
      tooltip.classList.remove('hidden');
      tooltip.style.left = (ev.clientX + 10) + 'px';
      tooltip.style.top = (ev.clientY - 30) + 'px';
      tooltip.innerHTML = '<b>' + hit.bin + unit + '</b>: ' + hit.count + '건';
    } else { tooltip.classList.add('hidden'); }
  };
  canvas._histMouseLeave = () => { tooltip.classList.add('hidden'); };
  canvas.addEventListener('mousemove', canvas._histMouseMove);
  canvas.addEventListener('mouseleave', canvas._histMouseLeave);
}

      '<td class="text-center py-1.5 px-2 font-bold" style="color:'+(ep.fgSpxGap == null ? '#6b7280' : ep.fgSpxGap < 0 ? '#60a5fa' : ep.fgSpxGap > 0 ? '#f59e0b' : '#9ca3af')+'">'+(ep.fgSpxGap != null ? (ep.fgSpxGap > 0 ? 'F&G +'+ep.fgSpxGap+'일' : ep.fgSpxGap < 0 ? 'SPX +'+Math.abs(ep.fgSpxGap)+'일' : '동시') : '-')+'</td>'+
      '<td class="text-center py-1.5 px-2">'+fmtG(ep.entryToGreedDays, ep.entryToGreedReturn, ep.entryToGreedDate)+'</td>'+
      '<td class="text-center py-1.5 px-2">'+fmtG(ep.bottomToGreedDays, ep.bottomToGreedReturn, ep.bottomToGreedDate)+'</td>'+

}

function sortEpisodes(key) {
  if (!window._epData) return;
  if (window._epSortKey === key) {
    window._epSortAsc = !window._epSortAsc;
  } else {
    window._epSortKey = key;
    window._epSortAsc = key === 'startDate' ? true : false;
  }
  const asc = window._epSortAsc;
  window._epData.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) va = asc ? Infinity : -Infinity;
    if (vb == null) vb = asc ? Infinity : -Infinity;
    if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return asc ? va - vb : vb - va;
  });
  renderEpRows();
  const headers = document.querySelectorAll('#epTable thead th');
  const keys = ['startDate','startDate','duration','minFg','spxPeak','spxMin','maxDrawdown','daysToFgMin','daysToSpxMin','fgSpxGap','entryToGreedDays','bottomToGreedDays'];
  headers.forEach((th, i) => {
    const text = th.textContent.replace(/ [↑↓↕]/g, '');
    th.textContent = text + (keys[i] === key ? (asc ? ' ↑' : ' ↓') : ' ↕');
  });
}

function drawFgChart(period) {
  const allData = window._fgFullHistory || [];
  if (allData.length === 0) return;

  // Filter by period
  let data = allData;
  if (period === 'CUSTOM') {
    const from = window._fgCustomFrom || '';
    const to = window._fgCustomTo || '';
    data = allData.filter(d => d.date >= from && d.date <= to);
  } else if (period !== 'ALL') {
    const months = period === '6M' ? 6 : parseInt(period) * 12;
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - months);
    const cutoffStr = cutoff.toISOString().split('T')[0];
    data = allData.filter(d => d.date >= cutoffStr);
  }
  if (data.length < 2) return;

  // ?  ?
  const rangeEl = document.getElementById('fgRangeInfo');
  if (rangeEl) {
    rangeEl.textContent = data.length + '일 데이터 | ' + data[0].date + ' ~ ' + data[data.length-1].date + (period === 'CUSTOM' ? ' (사용자)' : period !== 'ALL' ? ' (' + period + ')' : ' (전체)');
  }

  const canvas = document.getElementById('fgChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 350;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 20, right: 55, bottom: 30, left: 40 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  // Background zones
  const zones = [
    { y1: 0, y2: 25, color: 'rgba(239,68,68,0.08)' },
    { y1: 25, y2: 45, color: 'rgba(249,115,22,0.06)' },
    { y1: 45, y2: 55, color: 'rgba(234,179,8,0.05)' },
    { y1: 55, y2: 75, color: 'rgba(132,204,22,0.06)' },
    { y1: 75, y2: 100, color: 'rgba(34,197,94,0.08)' },
  ];
  zones.forEach(z => {
    ctx.fillStyle = z.color;
    const y1 = pad.top + ch * (1 - z.y2 / 100);
    const y2 = pad.top + ch * (1 - z.y1 / 100);
    ctx.fillRect(pad.left, y1, cw, y2 - y1);
  });

  // Grid lines + 25 ???
  [0, 25, 50, 75, 100].forEach(v => {
    const y = pad.top + ch * (1 - v / 100);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y);
    if (v === 25) {
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 3]);
    } else {
      ctx.strokeStyle = '#1e2030';
      ctx.lineWidth = 0.5;
      ctx.setLineDash([]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = v === 25 ? '#ef4444' : '#6b7280';
    ctx.font = v === 25 ? 'bold 10px sans-serif' : '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(v.toString(), pad.left - 5, y + 3);
  });
  // 25 ?
  const y25 = pad.top + ch * (1 - 25 / 100);
  ctx.fillStyle = '#ef4444'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Extreme Fear 경계', W - pad.right - 80, y25 - 4);

  // X??  
  const firstDate = new Date(data[0].date).getTime();
  const lastDate = new Date(data[data.length - 1].date).getTime();
  const totalMs = lastDate - firstDate;

  function dateToX(dateStr) { return pad.left + ((new Date(dateStr).getTime() - firstDate) / totalMs) * cw; }
  function valueToY(v) { return pad.top + ch * (1 - v / 100); }

  // ??????  (???
  const points = data.map(d => ({ x: dateToX(d.date), y: valueToY(d.value), date: d.date, value: d.value }));

  // ?? + ?
  const GAP_THRESHOLD = 30 * 86400000;
  const segments = [];
  let curSeg = [];
  for (let i = 0; i < data.length; i++) {
    if (i > 0) {
      const gap = new Date(data[i].date).getTime() - new Date(data[i-1].date).getTime();
      if (gap > GAP_THRESHOLD) { if (curSeg.length > 0) segments.push(curSeg); curSeg = []; }
    }
    curSeg.push(points[i]);
  }
  if (curSeg.length > 0) segments.push(curSeg);

  // ?????
  segments.forEach(seg => {
    if (seg.length < 2) return;
    ctx.beginPath();
    seg.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.lineTo(seg[seg.length-1].x, pad.top + ch); ctx.lineTo(seg[0].x, pad.top + ch);
    ctx.closePath(); ctx.fillStyle = 'rgba(96,165,250,0.08)'; ctx.fill();
  });

  // ??
  for (let i = 1; i < data.length; i++) {
    const gap = new Date(data[i].date).getTime() - new Date(data[i-1].date).getTime();
    if (gap > GAP_THRESHOLD) {
      const x1 = dateToX(data[i-1].date), x2 = dateToX(data[i].date);
      ctx.fillStyle = 'rgba(239,68,68,0.05)'; ctx.fillRect(x1, pad.top, x2-x1, ch);
      ctx.fillStyle = '#ef4444'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('데이터 공백 ('+Math.round(gap/86400000)+'일)', (x1+x2)/2, pad.top+ch/2);
    }
  }

  // X??
  ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const spanDays = totalMs / 86400000;
  if (spanDays > 1500) {
    // ? ?
    let ly = '';
    data.forEach(d => { const yr = d.date.slice(0,4); if (yr !== ly) { ctx.fillText(yr, dateToX(d.date), H-5); ly = yr; } });
  } else if (spanDays > 200) {
    // ??? (3 )
    let lm = '';
    data.forEach(d => { const m = d.date.slice(0,7); if (m !== lm && parseInt(d.date.slice(5,7)) % 3 === 1) { ctx.fillText(m.slice(2), dateToX(d.date), H-5); lm = m; } });
  } else {
    // ???
    let lm = '';
    data.forEach(d => { const m = d.date.slice(0,7); if (m !== lm) { ctx.fillText(m.slice(2), dateToX(d.date), H-5); lm = m; } });
  }

  // === S&P 500 ? ???? (??Y? ===
  const spxAll = window._fgSpxData || [];
  const spxFiltered = spxAll.filter(d => {
    const t = new Date(d.date).getTime();
    return t >= firstDate && t <= lastDate;
  });

  let spxPoints = [];
  if (spxFiltered.length >= 2) {
    // ?? (????
    const maxAbs = Math.min(Math.max(...spxFiltered.map(d => Math.abs(d.dailyReturn))), 12);
    const spxMin = -maxAbs, spxMax = maxAbs;
    const spxRange = spxMax - spxMin || 1;

    function spxRetToY(v) { return pad.top + ch * (1 - (v - spxMin) / spxRange); }

    // 0% ???
    ctx.beginPath();
    ctx.moveTo(pad.left, spxRetToY(0));
    ctx.lineTo(W - pad.right, spxRetToY(0));
    ctx.strokeStyle = 'rgba(251,191,36,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // ??? (?)
    const barWidth = Math.max(1, cw / spxFiltered.length * 0.6);
    spxFiltered.forEach((d, i) => {
      const x = dateToX(d.date);
      const y0 = spxRetToY(0);
      const y = spxRetToY(d.dailyReturn);
      const color = d.dailyReturn >= 0 ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)';
      ctx.fillStyle = color;
      ctx.fillRect(x - barWidth/2, Math.min(y, y0), barWidth, Math.abs(y - y0));
      spxPoints.push({ x, y, date: d.date, dailyReturn: d.dailyReturn, close: d.close });
    });

    // ??Y?(??%)
    ctx.fillStyle = '#fbbf24'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
    [-maxAbs, -maxAbs/2, 0, maxAbs/2, maxAbs].forEach(v => {
      const y = spxRetToY(v);
      const label = (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
      ctx.fillText(label, W - pad.right + 3, y + 3);
    });

    // ?
    ctx.save();
    ctx.translate(W - 3, pad.top + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(251,191,36,0.5)'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SPX 일일 변동', 0, 0);
    ctx.restore();
  }
  window._fgSpxPoints = spxPoints;

  // === ??? ===
  const tooltip = document.getElementById('fgTooltip');
  function fgColorForValue(v) {
    if (v <= 25) return '#ef4444';
    if (v <= 45) return '#f97316';
    if (v <= 55) return '#eab308';
    if (v <= 75) return '#84cc16';
    return '#22c55e';
  }

  // ? ???
  canvas._onmousemove && canvas.removeEventListener('mousemove', canvas._onmousemove);
  canvas._onmouseleave && canvas.removeEventListener('mouseleave', canvas._onmouseleave);

  canvas._onmousemove = function(e) {
    const br = canvas.getBoundingClientRect();
    const mx = e.clientX - br.left;
    const my = e.clientY - br.top;
    if (mx < pad.left || mx > W - pad.right || my < pad.top || my > pad.top + ch) {
      tooltip.style.display = 'none'; return;
    }
    // ???? ??????
    let closest = points[0], minDist = 99999;
    for (const p of points) {
      const dist = Math.abs(p.x - mx);
      if (dist < minDist) { minDist = dist; closest = p; }
    }
    if (minDist > 20) { tooltip.style.display = 'none'; return; }

    const color = fgColorForValue(closest.value);
    const label = closest.value <= 25 ? 'Extreme Fear' : closest.value <= 45 ? 'Fear' : closest.value <= 55 ? 'Neutral' : closest.value <= 75 ? 'Greed' : 'Extreme Greed';
    // ???? SPX ???
    let spxInfo = '';
    const sp = window._fgSpxPoints || [];
    if (sp.length > 0) {
      let closestSpx = sp[0], spxDist = 99999;
      for (const s of sp) { const d = Math.abs(s.x - mx); if (d < spxDist) { spxDist = d; closestSpx = s; } }
      if (spxDist < 30 && closestSpx.dailyReturn !== undefined) {
        const retColor = closestSpx.dailyReturn >= 0 ? '#34d399' : '#f87171';
        spxInfo = `<br><span style="color:#fbbf24;font-size:10px">SPX</span> <span style="color:${retColor};font-weight:bold">${closestSpx.dailyReturn >= 0 ? '+' : ''}${closestSpx.dailyReturn.toFixed(2)}%</span> <span style="color:#6b7280;font-size:9px">${closestSpx.close?.toLocaleString('en-US',{maximumFractionDigits:0}) || ''}</span>`;
      }
    }
    tooltip.innerHTML = `<span style="color:#9ca3af">${closest.date}</span><br><span style="color:${color};font-weight:bold;font-size:14px">${closest.value.toFixed(1)}</span> <span style="color:${color};font-size:10px">${label}</span>${spxInfo}`;
    tooltip.style.display = 'block';
    // ?
    let tx = closest.x + 10, ty = closest.y - 50;
    if (tx + 150 > W) tx = closest.x - 160;
    if (ty < 0) ty = closest.y + 10;
    tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';

    // ????
    ctx.putImageData(canvas._chartImage, 0, 0);
    ctx.beginPath(); ctx.moveTo(closest.x, pad.top); ctx.lineTo(closest.x, pad.top + ch);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(closest.x, closest.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  };

  canvas._onmouseleave = function() {
    tooltip.style.display = 'none';
    if (canvas._chartImage) ctx.putImageData(canvas._chartImage, 0, 0);
  };

  //  ??? ????(??????
  canvas._chartImage = ctx.getImageData(0, 0, W, H);

  canvas.addEventListener('mousemove', canvas._onmousemove);
  canvas.addEventListener('mouseleave', canvas._onmouseleave);
}

function computeVixEpisodes(threshold) {
  const hist = _vixFullHistory;
  const spxMap = new Map(_vixSpxData.map(s => [s.date, s.close]));
  const merged = hist.map(h => ({ date: h.date, vix: h.value, spx: spxMap.get(h.date) || null })).filter(d => d.spx);

  const episodes = [];
  let ep = null;

  function findPriorSpxPeak(idx) {
    let peak = 0, peakDate = '';
    for (let j = 0; j < idx; j++) {
      if (merged[j].spx > peak) { peak = merged[j].spx; peakDate = merged[j].date; }
    }
    return { peak, peakDate };
  }

  for (let i = 0; i < merged.length; i++) {
    const d = merged[i];
    if (d.vix >= threshold) {
      if (!ep) {
        const pk = findPriorSpxPeak(i);
        ep = { startDate: d.date, startIdx: i, maxVix: d.vix, maxVixDate: d.date,
          spxPeak: pk.peak, spxPeakDate: pk.peakDate,
          spxMin: d.spx, spxMinDate: d.date, days: [d] };
      } else {
        ep.days.push(d);
      }
      if (d.vix > ep.maxVix) { ep.maxVix = d.vix; ep.maxVixDate = d.date; }
      if (d.spx < ep.spxMin) { ep.spxMin = d.spx; ep.spxMinDate = d.date; }
    } else if (ep) {
      finalizeVixEp(ep, merged);
      episodes.push(ep);
      ep = null;
    }
  }
  if (ep) { ep.ongoing = true; finalizeVixEp(ep, merged); episodes.push(ep); }

  _vixEpisodes = episodes;
  _vixEpSortKey = null;
  renderVixEpDynamic(episodes);

  // ????
  const durVals = episodes.filter(e => !e.ongoing).map(e => e.duration);
  const vixMaxVals = episodes.filter(e => !e.ongoing).map(e => e.maxVix);
  const container = document.getElementById('vixEpHistograms');
  if (container) {
    container.innerHTML = '<div class="grid grid-cols-2 gap-3">' +
      '<canvas id="vixHistDur" height="120"></canvas>' +
      '<canvas id="vixHistMax" height="120"></canvas>' +
    '</div>';
    setTimeout(() => {
      if (durVals.length > 0) drawVixHistogram('vixHistDur', '지속일 분포', durVals, 1, '일', '#3b82f6', true);
      if (vixMaxVals.length > 0) drawVixHistogram('vixHistMax', 'VIX 최고치', vixMaxVals, 1, '', '#ef4444');
    }, 50);
  }
}

function finalizeVixEp(ep, merged) {
  ep.duration = ep.days.length;
  ep.maxDrawdown = ep.spxPeak > 0 ? Math.round((ep.spxMin / ep.spxPeak - 1) * 10000) / 100 : 0;
  const vixMaxI = ep.days.findIndex(d => d.date === ep.maxVixDate);
  const spxMinI = ep.days.findIndex(d => d.date === ep.spxMinDate);
  ep.daysToVixMax = vixMaxI >= 0 ? vixMaxI : null;
  ep.daysToSpxMin = spxMinI >= 0 ? spxMinI : null;
  ep.vixSpxGap = (vixMaxI >= 0 && spxMinI >= 0) ? vixMaxI - spxMinI : null;
  //  ??VIX < 20
  for (let k = ep.startIdx + 1; k < merged.length; k++) {
    if (merged[k].vix < 20) {
      ep.entryToNormalDays = k - ep.startIdx;
      ep.entryToNormalReturn = Math.round((merged[k].spx / merged[ep.startIdx].spx - 1) * 10000) / 100;
      break;
    }
  }
  // VIX peak ??VIX < 20
  const vixMaxIdx = merged.findIndex(m => m.date === ep.maxVixDate);
  if (vixMaxIdx >= 0) {
    for (let k = vixMaxIdx + 1; k < merged.length; k++) {
      if (merged[k].vix < 20) {
        ep.peakToNormalDays = k - vixMaxIdx;
        ep.peakToNormalReturn = Math.round((merged[k].spx / merged[vixMaxIdx].spx - 1) * 10000) / 100;
        break;
      }
    }
  }
  ep.maxVix = Math.round(ep.maxVix * 100) / 100;
  ep.spxMin = Math.round(ep.spxMin * 100) / 100;
  ep.spxPeak = Math.round(ep.spxPeak * 100) / 100;
  delete ep.days; delete ep.startIdx;
}

function setVixEpThreshold(thresh) {
  _vixEpThreshold = thresh;
  document.querySelectorAll('.vix-ep-btn').forEach(b => {
    b.className = 'vix-ep-btn px-2 py-0.5 text-xs rounded ' + (b.textContent === '≥'+thresh ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-400 hover:bg-gray-600');
  });
  const label = document.getElementById('vixEpThreshLabel');
  if (label) label.textContent = thresh;
  computeVixEpisodes(thresh);
}
window.setVixEpThreshold = setVixEpThreshold;

function renderVixEpDynamic(eps) {
  const completed = eps.filter(e => !e.ongoing);
  const avgD = completed.length > 0 ? (completed.reduce((s,e) => s+e.duration, 0)/completed.length).toFixed(1) : '-';
  const avgMax = completed.length > 0 ? (completed.reduce((s,e) => s+e.maxVix, 0)/completed.length).toFixed(1) : '-';
  const avgMDD = completed.length > 0 ? (completed.reduce((s,e) => s+e.maxDrawdown, 0)/completed.length).toFixed(2) : '-';
  const e2n = completed.filter(e => e.entryToNormalDays != null);
  const avgE2N = e2n.length > 0 ? Math.round(e2n.reduce((s,e) => s+e.entryToNormalDays, 0)/e2n.length) : '-';
  const p2n = completed.filter(e => e.peakToNormalDays != null);
  const avgP2N = p2n.length > 0 ? Math.round(p2n.reduce((s,e) => s+e.peakToNormalDays, 0)/p2n.length) : '-';

  let html = '<div class="grid grid-cols-5 gap-2 mb-3 text-center">';
  html += '<div class="bg-gray-800/50 rounded p-2"><p class="text-[9px] text-gray-500">사례 수</p><p class="text-sm font-bold text-white">'+eps.length+'건</p></div>';
  html += '<div class="bg-gray-800/50 rounded p-2"><p class="text-[9px] text-gray-500">평균 지속</p><p class="text-sm font-bold text-white">'+avgD+'일</p></div>';
  html += '<div class="bg-gray-800/50 rounded p-2"><p class="text-[9px] text-gray-500">평균 VIX 최고</p><p class="text-sm font-bold text-red-400">'+avgMax+'</p></div>';
  html += '<div class="bg-gray-800/50 rounded p-2"><p class="text-[9px] text-gray-500">평균 MDD</p><p class="text-sm font-bold text-red-400">'+avgMDD+'%</p></div>';
  html += '<div class="bg-gray-800/50 rounded p-2"><p class="text-[9px] text-gray-500">정상화 일수</p><p class="text-sm font-bold text-blue-400">'+avgE2N+'일</p></div>';
  html += '</div>';

  // ?? ??
  html += '<div class="overflow-x-auto"><table class="w-full text-[10px]"><thead><tr class="text-gray-500 border-b border-gray-700">';
  const cols = [
    { key: 'idx', label: '#' },
    { key: 'startDate', label: '기간' },
    { key: 'duration', label: '지속' },
    { key: 'maxVix', label: 'VIX 최고' },
    { key: 'spxPeak', label: 'SPX 고점' },
    { key: 'spxMin', label: 'SPX 저점' },
    { key: 'maxDrawdown', label: 'MDD' },
    { key: 'daysToVixMax', label: 'VIX 최고 도달' },
    { key: 'daysToSpxMin', label: 'SPX 저점 도달' },
    { key: 'entryToNormalDays', label: '정상화' },
    { key: 'peakToNormalDays', label: 'VIX 최고→정상' },
  ];
  cols.forEach(c => {
    const arrow = _vixEpSortKey === c.key ? (_vixEpSortAsc ? ' ↑' : ' ↓') : ' ↕';
    const clickable = c.key !== 'idx' ? ' cursor-pointer hover:text-white' : '';
    html += '<th class="py-1 text-right'+clickable+'" '+(c.key !== 'idx' ? 'onclick="sortVixEpisodes(\''+c.key+'\')"' : '')+'>'+c.label+(c.key !== 'idx' ? arrow : '')+'</th>';
  });
  html += '</tr></thead><tbody id="vixEpBody">';
  html += renderVixEpRows(eps);
  html += '</tbody></table></div>';

  document.getElementById('vixEpDynamic').innerHTML = html;
}

function renderVixEpRows(eps) {
  if (!eps) eps = _vixEpisodes;
  let html = '';
  eps.forEach((e, i) => {
    const ongoing = e.ongoing ? '<span class="text-yellow-400 text-[8px]"> [진행중]</span>' : '';
    const fmtG = (v) => { if (v == null) return '-'; const c = v >= 0 ? 'text-green-400' : 'text-red-400'; return '<span class="'+c+'">'+(v>=0?'+':'')+v+'%</span>'; };
    html += '<tr class="border-b border-gray-800">';
    html += '<td class="py-1 text-gray-500 text-right">'+(i+1)+'</td>';
    html += '<td class="py-1 text-gray-300 text-right whitespace-nowrap">'+e.startDate+(e.endDate ? ' ~ '+e.endDate : '')+ongoing+'</td>';
    html += '<td class="py-1 text-right text-white">'+(e.duration || '-')+'</td>';
    html += '<td class="py-1 text-right text-red-400 font-bold">'+e.maxVix+'<br><span class="text-[8px] text-gray-500">'+e.maxVixDate+'</span></td>';
    html += '<td class="py-1 text-right text-gray-300">'+e.spxPeak.toLocaleString()+'<br><span class="text-[8px] text-gray-500">'+e.spxPeakDate+'</span></td>';
    html += '<td class="py-1 text-right text-red-300">'+e.spxMin.toLocaleString()+'<br><span class="text-[8px] text-gray-500">'+e.spxMinDate+'</span></td>';
    html += '<td class="py-1 text-right text-red-400">'+(e.maxDrawdown != null ? e.maxDrawdown+'%' : '-')+'</td>';
    html += '<td class="py-1 text-right text-gray-300">'+(e.daysToVixMax != null ? e.daysToVixMax+'일' : '-')+'</td>';
    html += '<td class="py-1 text-right text-gray-300">'+(e.daysToSpxMin != null ? e.daysToSpxMin+'일' : '-')+'</td>';
    html += '<td class="py-1 text-right">'+(e.entryToNormalDays != null ? e.entryToNormalDays+'일 '+fmtG(e.entryToNormalReturn) : '-')+'</td>';
    html += '<td class="py-1 text-right">'+(e.peakToNormalDays != null ? e.peakToNormalDays+'일 '+fmtG(e.peakToNormalReturn) : '-')+'</td>';
    html += '</tr>';
  });
  return html;
}

function sortVixEpisodes(key) {
  if (_vixEpSortKey === key) _vixEpSortAsc = !_vixEpSortAsc;
  else { _vixEpSortKey = key; _vixEpSortAsc = true; }
  _vixEpisodes.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) va = _vixEpSortAsc ? Infinity : -Infinity;
    if (vb == null) vb = _vixEpSortAsc ? Infinity : -Infinity;
    if (typeof va === 'string') return _vixEpSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return _vixEpSortAsc ? va - vb : vb - va;
  });
  renderVixEpDynamic(_vixEpisodes);
}
window.sortVixEpisodes = sortVixEpisodes;

function drawVixHistogram(canvasId, title, values, binSize, unit, color, skipEmpty) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || canvas.width;
  const H = canvas.offsetHeight || canvas.height;
  canvas.width = W; canvas.height = H;
  const mn = Math.floor(Math.min(...values));
  const mx = Math.ceil(Math.max(...values));
  const bins = {};
  for (let b = mn; b <= mx; b += binSize) bins[b] = 0;
  values.forEach(v => { const b = Math.floor(v / binSize) * binSize; bins[b] = (bins[b] || 0) + 1; });
  // skipEmpty: 0????
  let keys = Object.keys(bins).map(Number).sort((a,b)=>a-b);
  if (skipEmpty) keys = keys.filter(k => bins[k] > 0);
  const maxC = Math.max(...keys.map(k => bins[k]), 1);
  const pad = { top: 20, bottom: 18, left: 5, right: 5 };
  const cw = (W - pad.left - pad.right) / keys.length;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(title + ' (n=' + values.length + ')', W / 2, 12);
  const ch = H - pad.top - pad.bottom;
  // ????????(???
  const barData = [];
  keys.forEach((k, i) => {
    const bh = maxC > 0 ? (bins[k] / maxC) * ch : 0;
    const x = pad.left + i * cw;
    const y = H - pad.bottom - bh;
    ctx.fillStyle = color + '99';
    ctx.fillRect(x + 1, y, cw - 2, bh);
    if (bins[k] > 0 && cw > 8) { ctx.fillStyle = '#ddd'; ctx.font = '7px sans-serif'; ctx.fillText(bins[k], x + cw / 2, y - 2); }
    barData.push({ x: x + 1, w: cw - 2, y, h: bh, bin: k, count: bins[k] });
  });
  // X??
  const step = Math.max(1, Math.floor(keys.length / 10));
  ctx.fillStyle = '#6b7280'; ctx.font = '8px sans-serif';
  keys.forEach((k, i) => { if (i % step === 0) ctx.fillText(k + unit, pad.left + i * cw + cw / 2, H - 4); });
  // ?
  const tooltip = document.createElement('div');
  tooltip.className = 'fixed bg-gray-900 border border-gray-600 text-[10px] text-white px-2 py-1 rounded pointer-events-none z-50 hidden';
  document.body.appendChild(tooltip);
  // ? ???
  if (canvas._vhMouseMove) canvas.removeEventListener('mousemove', canvas._vhMouseMove);
  if (canvas._vhMouseLeave) canvas.removeEventListener('mouseleave', canvas._vhMouseLeave);
  canvas._vhMouseMove = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const my = ev.clientY - rect.top;
    const hit = barData.find(b => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h && b.count > 0);
    if (hit) {
      tooltip.classList.remove('hidden');
      tooltip.style.left = (ev.clientX + 10) + 'px';
      tooltip.style.top = (ev.clientY - 30) + 'px';
      tooltip.innerHTML = '<b>' + hit.bin + unit + '</b>: ' + hit.count + '건';
    } else {
      tooltip.classList.add('hidden');
    }
  };
  canvas._vhMouseLeave = () => { tooltip.classList.add('hidden'); };
  canvas.addEventListener('mousemove', canvas._vhMouseMove);
  canvas.addEventListener('mouseleave', canvas._vhMouseLeave);
}

function drawVixChart(period) {
  const allData = _vixFullHistory;
  if (allData.length === 0) return;

  // SPX ????
  const spxMap = new Map(_vixSpxData.map(s => [s.date, s.close]));

  //  ?
  let filtered = allData;
  const last = allData[allData.length - 1];
  if (period !== 'ALL') {
    const d = new Date(last.date);
    if (period === '6M') d.setMonth(d.getMonth() - 6);
    else if (period === '1Y') d.setFullYear(d.getFullYear() - 1);
    else if (period === '3Y') d.setFullYear(d.getFullYear() - 3);
    else if (period === '5Y') d.setFullYear(d.getFullYear() - 5);
    const cutoff = d.toISOString().split('T')[0];
    filtered = allData.filter(d => d.date >= cutoff);
  }

  // SPX ??
  const chartData = filtered.map((d, i) => {
    const spx = spxMap.get(d.date);
    const prevSpx = i > 0 ? spxMap.get(filtered[i-1].date) : null;
    const spxRet = (spx && prevSpx) ? Math.round((spx / prevSpx - 1) * 10000) / 100 : null;
    return { date: d.date, vix: d.value, spx, spxRet };
  });

  //  ????
  document.querySelectorAll('.vix-period-btn').forEach(b => {
    b.className = 'vix-period-btn px-2 py-0.5 text-xs rounded ' + (b.textContent === period ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-400 hover:bg-gray-600');
  });

  const canvas = document.getElementById('vixChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 300;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 10, bottom: 25, left: 40, right: 55 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;
  const n = chartData.length;

  const vals = chartData.map(d => d.vix);
  const mn = Math.min(...vals);
  const mx = Math.max(...vals);
  const range = mx - mn || 1;

  // SPX ???()
  const spxRets = chartData.map(d => d.spxRet).filter(r => r != null);
  const maxRet = Math.max(...spxRets.map(Math.abs), 1);
  const retMid = pad.top + ch; //  ?
  chartData.forEach((d, i) => {
    if (d.spxRet == null) return;
    const x = pad.left + (i / (n - 1)) * cw;
    const barH = Math.abs(d.spxRet) / maxRet * (ch * 0.3);
    ctx.fillStyle = d.spxRet >= 0 ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)';
    const bw = Math.max(cw / n, 1);
    if (d.spxRet >= 0) {
      ctx.fillRect(x - bw/2, retMid - barH, bw, barH);
    } else {
      ctx.fillRect(x - bw/2, retMid, bw, barH);
    }
  });

  ctx.clearRect(0, 0, W, pad.top); // ? ???
  // 30 ???
  const y30 = pad.top + ch * (1 - (30 - mn) / range);
  if (y30 > pad.top && y30 < H - pad.bottom) {
    ctx.strokeStyle = '#ef444466'; ctx.setLineDash([4, 4]); ctx.beginPath();
    ctx.moveTo(pad.left, y30); ctx.lineTo(W - pad.right, y30); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ef4444'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('30', pad.left - 5, y30 + 3);
  }
  // 20 ???
  const y20 = pad.top + ch * (1 - (20 - mn) / range);
  if (y20 > pad.top && y20 < H - pad.bottom) {
    ctx.strokeStyle = '#22c55e44'; ctx.setLineDash([4, 4]); ctx.beginPath();
    ctx.moveTo(pad.left, y20); ctx.lineTo(W - pad.right, y20); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#22c55e'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('20', pad.left - 5, y20 + 3);
  }

  // 30 ? ? ?
  ctx.beginPath();
  let inSpike = false;
  chartData.forEach((d, i) => {
    const x = pad.left + (i / (n - 1)) * cw;
    const y = pad.top + ch * (1 - (Math.max(d.vix, 30) - mn) / range);
    const baseY = y30;
    if (d.vix >= 30) {
      if (!inSpike) { ctx.moveTo(x, baseY); inSpike = true; }
      ctx.lineTo(x, y);
    } else {
      if (inSpike) { ctx.lineTo(x, baseY); inSpike = false; }
    }
  });
  if (inSpike) ctx.lineTo(pad.left + cw, y30);
  ctx.closePath();
  ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
  ctx.fill();

  // VIX ?
  ctx.beginPath();
  chartData.forEach((d, i) => {
    const x = pad.left + (i / (n - 1)) * cw;
    const y = pad.top + ch * (1 - (d.vix - mn) / range);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Y?
  ctx.fillStyle = '#6b7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
  const ySteps = 5;
  for (let i = 0; i <= ySteps; i++) {
    const v = mn + (range * i / ySteps);
    const y = pad.top + ch * (1 - i / ySteps);
    ctx.fillText(Math.round(v), pad.left - 5, y + 3);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5; ctx.beginPath();
    ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
  }

  // X?
  ctx.textAlign = 'center'; ctx.fillStyle = '#6b7280';
  const xStep = Math.max(1, Math.floor(n / 6));
  chartData.forEach((d, i) => {
    if (i % xStep === 0) {
      const x = pad.left + (i / (n - 1)) * cw;
      ctx.fillText(d.date.slice(2, 7), x, H - 5);
    }
  });

  // ??Y?(SPX ??%)
  if (spxRets.length > 0) {
    ctx.fillStyle = '#fbbf24'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
    [-maxRet, -maxRet/2, 0, maxRet/2, maxRet].forEach(v => {
      const barH = Math.abs(v) / maxRet * (ch * 0.3);
      const y = v >= 0 ? retMid - barH : retMid + barH;
      const label = (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
      ctx.fillText(label, W - pad.right + 3, y + 3);
    });
    // SPX ?
    ctx.save();
    ctx.translate(W - 3, pad.top + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(251,191,36,0.5)'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SPX 일일 변동', 0, 0);
    ctx.restore();
  }

  //  ??? ????(??????
  canvas._chartImage = ctx.getImageData(0, 0, W, H);

  // ? ? + ???
  let tooltipEl = document.getElementById('vixChartTooltip');
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.id = 'vixChartTooltip';
    tooltipEl.className = 'fixed bg-gray-900/95 border border-gray-600 text-[10px] text-white px-2 py-1.5 rounded pointer-events-none z-50 hidden leading-relaxed';
    document.body.appendChild(tooltipEl);
  }
  if (canvas._vixChartMove) canvas.removeEventListener('mousemove', canvas._vixChartMove);
  if (canvas._vixChartLeave) canvas.removeEventListener('mouseleave', canvas._vixChartLeave);

  // ??????  (???
  const points = chartData.map((d, i) => ({
    x: pad.left + (i / (n - 1)) * cw,
    y: pad.top + ch * (1 - (d.vix - mn) / range),
    ...d
  }));

  canvas._vixChartMove = (ev) => {
    const br = canvas.getBoundingClientRect();
    const mx = ev.clientX - br.left;
    const my = ev.clientY - br.top;
    if (mx < pad.left || mx > W - pad.right || my < pad.top || my > pad.top + ch) {
      tooltipEl.classList.add('hidden'); return;
    }
    // ???? ??????
    let closest = points[0], minDist = 99999;
    for (const p of points) {
      const dist = Math.abs(p.x - mx);
      if (dist < minDist) { minDist = dist; closest = p; }
    }
    if (minDist > 20) { tooltipEl.classList.add('hidden'); return; }

    // ???? + ?
    ctx.putImageData(canvas._chartImage, 0, 0);
    ctx.beginPath(); ctx.moveTo(closest.x, pad.top); ctx.lineTo(closest.x, pad.top + ch);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(closest.x, closest.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#60a5fa'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

    // ?
    const spxStr = closest.spx ? 'SPX: ' + closest.spx.toLocaleString() : '';
    const retStr = closest.spxRet != null ? 'SPX 변동: <span style="color:' + (closest.spxRet >= 0 ? '#34d399' : '#f87171') + '">' + (closest.spxRet >= 0 ? '+' : '') + closest.spxRet + '%</span>' : '';
    tooltipEl.innerHTML = '<b>' + closest.date + '</b><br>VIX: <span style="color:#60a5fa">' + closest.vix + '</span><br>' + spxStr + (retStr ? '<br>' + retStr : '');
    tooltipEl.classList.remove('hidden');
    const ttLeft = ev.clientX + 15;
    const ttTop = ev.clientY - 50;
    tooltipEl.style.left = (ttLeft + 180 > window.innerWidth ? ev.clientX - 190 : ttLeft) + 'px';
    tooltipEl.style.top = Math.max(5, ttTop) + 'px';
  };
  canvas._vixChartLeave = () => {
    tooltipEl.classList.add('hidden');
    if (canvas._chartImage) ctx.putImageData(canvas._chartImage, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._vixChartMove);
  canvas.addEventListener('mouseleave', canvas._vixChartLeave);
}
window.drawVixChart = drawVixChart;

// VIX(기대) vs SPX 30일 실현변동성(실제) — 검증용
function drawVixRvChart(period) {
  if (!_vixFullHistory || !_vixSpxData) return;
  window._vixRvPeriod = period;
  ['1Y','3Y','5Y','ALL'].forEach(p => { const b=document.getElementById('vixrvp-'+p); if(b) b.className='px-2 py-0.5 text-xs rounded '+(p===period?'bg-blue-600 text-white':'bg-gray-700 text-gray-300 hover:bg-gray-600'); });

  const canvas = document.getElementById('vixRvChart');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const W = rect.width, H = 280;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pad = { top: 26, right: 16, bottom: 30, left: 38 };

  // SPX 일별 종가 → 30일 실현변동성(연율%)
  const spx = (_vixSpxData || []).filter(d => d.close != null);
  const rv = [];
  const rets = [];
  for (let i = 1; i < spx.length; i++) rets.push(Math.log(spx[i].close / spx[i-1].close));
  const win = 30;
  for (let i = win; i < rets.length; i++) {
    const s = rets.slice(i-win, i);
    const m = s.reduce((a,b)=>a+b,0)/win;
    const v = s.reduce((a,b)=>a+(b-m)**2,0)/win;
    rv.push({ date: spx[i+1].date, value: Math.sqrt(v)*Math.sqrt(252)*100 });
  }

  // 기간 컷
  const cutoffMap = { '1Y':365,'3Y':1095,'5Y':1825,'ALL':99999 };
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (cutoffMap[period]||1095));
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const vix = (_vixFullHistory || []).filter(d => d.date >= cutoffStr);
  const rvF = rv.filter(d => d.date >= cutoffStr);
  if (vix.length < 2 || rvF.length < 2) return;

  const allV = [...vix.map(d=>d.value), ...rvF.map(d=>d.value)];
  const vMin = Math.max(0, Math.min(...allV)*0.9), vMax = Math.max(...allV)*1.05;
  const allDates = [...vix.map(d=>d.date), ...rvF.map(d=>d.date)].sort();
  const firstMs = new Date(allDates[0]).getTime(), lastMs = new Date(allDates[allDates.length-1]).getTime();
  const totalMs = lastMs - firstMs || 1;
  const xOf = d => pad.left + ((new Date(d).getTime()-firstMs)/totalMs)*(W-pad.left-pad.right);
  const yOf = v => pad.top + (1-(v-vMin)/(vMax-vMin))*(H-pad.top-pad.bottom);

  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
  for (let i=0;i<=5;i++){ const v=vMin+(vMax-vMin)*(i/5); const y=yOf(v);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText(v.toFixed(0), pad.left-4, y+3); }
  ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  for (let i=0;i<=6;i++){ const idx=Math.round(i/6*(allDates.length-1)); ctx.fillText(allDates[idx].slice(0,7), xOf(allDates[idx]), H-6); }

  // 실현변동성 (회색) → VIX (시안) 순서로 (VIX가 위에 보이게)
  ctx.beginPath(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1.8;
  rvF.forEach((d,i)=>{ const x=xOf(d.date),y=yOf(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
  ctx.beginPath(); ctx.strokeStyle='#22d3ee'; ctx.lineWidth=1.8;
  vix.forEach((d,i)=>{ const x=xOf(d.date),y=yOf(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();

  // 범례 + 현재 프리미엄
  const lastVix = vix[vix.length-1].value, lastRv = rvF[rvF.length-1].value;
  ctx.textAlign='left'; ctx.font='bold 11px sans-serif';
  ctx.fillStyle='#22d3ee'; ctx.fillRect(pad.left,9,12,3); ctx.fillStyle='#e2e8f0'; ctx.fillText('VIX(기대) '+lastVix.toFixed(1), pad.left+15, 17);
  ctx.fillStyle='#fbbf24'; ctx.fillRect(pad.left+140,9,12,3); ctx.fillStyle='#e2e8f0'; ctx.fillText('SPX 실현변동성 '+lastRv.toFixed(1), pad.left+155, 17);
  const prem = lastVix - lastRv;
  ctx.textAlign='right'; ctx.font='10px sans-serif'; ctx.fillStyle = prem>=0?'#34d399':'#f87171';
  ctx.fillText('프리미엄 ' + (prem>=0?'+':'') + prem.toFixed(1) + 'p', W-pad.right, 17);

  // ── 호버 툴팁 ──
  let tip = document.getElementById('vixRvTooltip');
  if (!tip) { tip=document.createElement('div'); tip.id='vixRvTooltip'; tip.className='fixed bg-gray-900/95 border border-gray-600 text-[11px] text-white px-3 py-2 rounded pointer-events-none z-50 hidden leading-relaxed'; document.body.appendChild(tip); }
  const vixMap = new Map(vix.map(d=>[d.date,d.value])), rvMap = new Map(rvF.map(d=>[d.date,d.value]));
  if (canvas._vrMove) canvas.removeEventListener('mousemove', canvas._vrMove);
  if (canvas._vrLeave) canvas.removeEventListener('mouseleave', canvas._vrLeave);
  canvas._vrMove = ev => {
    const br = canvas.getBoundingClientRect(); const mx = ev.clientX - br.left;
    if (mx < pad.left || mx > W - pad.right) { tip.classList.add('hidden'); return; }
    const ratio = (mx-pad.left)/(W-pad.left-pad.right);
    const date = allDates[Math.max(0,Math.min(allDates.length-1,Math.round(ratio*(allDates.length-1))))];
    const vv = vixMap.get(date), rr = rvMap.get(date);
    let rows = '<b>'+date+'</b>';
    if (vv!=null) rows += '<br><span style="color:#22d3ee">VIX(기대):</span> '+vv.toFixed(1);
    if (rr!=null) rows += '<br><span style="color:#fbbf24">실현변동성:</span> '+rr.toFixed(1);
    if (vv!=null&&rr!=null) rows += '<br><span style="color:#9ca3af">프리미엄:</span> '+(vv-rr>=0?'+':'')+(vv-rr).toFixed(1)+'p';
    tip.innerHTML = rows; tip.classList.remove('hidden');
    tip.style.left = (ev.clientX+15+180>window.innerWidth?ev.clientX-195:ev.clientX+15)+'px';
    tip.style.top = Math.max(5, ev.clientY-60)+'px';
  };
  canvas._vrLeave = () => tip.classList.add('hidden');
  canvas.addEventListener('mousemove', canvas._vrMove);
  canvas.addEventListener('mouseleave', canvas._vrLeave);
}
window.drawVixRvChart = drawVixRvChart;

// === Tab switching ===
function switchTab(tab) {
  currentTab = tab;
  try { localStorage.setItem('dashboardCurrentTab', tab); } catch {}
  // 존재하는 탭 버튼만 안전하게 업데이트
  const tabIds = ['overview','stocks','feargreed','vix','soxvol','funds','liquidity','rates','valuation','fed','backtest'];
  tabIds.forEach(id => {
    const el = document.getElementById('tab-' + id);
    if (el) el.className = 'py-4 px-1 text-[13px] whitespace-nowrap ' + (tab === id ? 'tab-active' : 'tab-inactive');
  });
  // stocks 탭이면 content에 로딩 표시
  if (tab === 'stocks') {
    const market = window._stocksMarket || 'cn_sh';
    const label = _mktLabel[market] || market;

  }
  refresh();
}

function _addEtfChips(text) {
  const parts = String(text || '').split(/[,;\n]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
  let added = 0;
  for (const p of parts) {
    if (!_naverSearchChips.includes(p)) { _naverSearchChips.push(p); added++; }
  }
  return added;
}

  _naverSearchChips.splice(idx, 1);

function handleEtfSearch(val) {
  // 콤마 입력 시 즉시 칩으로 변환
  if (/[,;\n]/.test(val)) {
    _addEtfChips(val);
    const input = document.getElementById('etfSearchInput');
    if (input) input.value = '';
    _naverSearchQuery = '';
    _renderEtfSearchChips();
  } else {
    _naverSearchQuery = val.trim().toLowerCase();
  }
  applyNaverFilter(_naverTabActive, _naverSort);
}

function handleEtfSearchKeydown(ev) {
  const input = ev.target;
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (input.value.trim()) {
      _addEtfChips(input.value);
      input.value = '';
      _naverSearchQuery = '';
      _renderEtfSearchChips();
      applyNaverFilter(_naverTabActive, _naverSort);
    }
  } else if (ev.key === 'Backspace' && !input.value && _naverSearchChips.length > 0) {
    _naverSearchChips.pop();
    _renderEtfSearchChips();
    applyNaverFilter(_naverTabActive, _naverSort);
  }
}

function applyNaverFilter(activeKeys, sort) {
  if (!Array.isArray(activeKeys)) activeKeys = [activeKeys];
  const listEl = document.getElementById('naverEtfList');
  if (!listEl) return;
  const isOnlyNone = activeKeys.length === 1 && activeKeys[0] === 'none';
  if (isOnlyNone && !_naverSearchQuery && _naverSearchChips.length === 0) {
    listEl.innerHTML = `<div class="py-20 text-center"><p class="text-[#043b72] text-sm font-bold">ETF명 또는 코드를 입력하여 검색해주세요</p><p class="text-gray-500 text-xs mt-1">다른 검색어를 사용하여 다시 시도해주세요</p></div>`;
    return;
  }
  if (!_naverDataReady || _allNaverEtfs.length === 0) {
    listEl.innerHTML = '<div class="py-20 text-center text-gray-500 text-xs animate-pulse">국내 ETF 데이터 로딩 중..</div>';
    return;
  }
  let items = [..._allNaverEtfs];
  // 칩 + 현재 입력값을 모두 OR 조건으로 매칭
  const queries = [..._naverSearchChips];
  if (_naverSearchQuery) queries.push(_naverSearchQuery);
  if (queries.length > 0) {
    items = items.filter(i => {
      const nm = (i.name || i.itemname || '').toLowerCase();
      const cd = (i.itemcode || '').toLowerCase();
      const tk = (i.ticker || '').toLowerCase();
      return queries.some(q => nm.includes(q) || cd.includes(q) || tk.includes(q));
    });
  }
  if (!activeKeys.includes('') && !activeKeys.includes('none') && !activeKeys.includes('custom_search')) {
    items = items.filter(item => activeKeys.some(key => {
      if (key === 'new_this_month') return item.isNew === true || item.isNew === 'True';
      if (key === 'new_this_year') return item.listDate ? item.listDate.startsWith(String(new Date().getFullYear()) + '-') : false;
      // 운용사 브랜드 필터: ETF명 시작 매칭
      if (key.startsWith('brand_')) {
        const nm = (item.name || item.itemname || '').toUpperCase().replace(/\s/g, '');
        if (key === 'brand_ETC') return !ETF_BRANDS.some(b => nm.startsWith(b));
        return nm.startsWith(key.slice(6));
      }
      // 다중 카테고리 지원: item.categoryKeys(배열) 있으면 우선, 없으면 단일 categoryKey
      if (Array.isArray(item.categoryKeys)) return item.categoryKeys.includes(key);
      return item.categoryKey === key;
    }));
  }
  // 정렬: 컬럼 헤더 클릭 → setNaverSort → applyNaverFilter(_, key) → 여기서 sort
  const sortKey = sort || _naverSort || 'marketSum';
  const dir = (window._naverSortDir && window._naverSortDir[sortKey]) || 'desc';
  const valOf = (item) => {
    if (sortKey === 'marketSum') return parseFloat(item.marketSum) || 0;
    if (sortKey === 'changeRate') return parseFloat(item.changeRate);
    if (sortKey === 'avgCap') return (_naverAvgCapsData[item.itemcode]?.avg ?? item.avgCap?.bil) ?? null;
    // 수익률 키 (ytd, m1, m3, m6, y1, y3, y5, y10) — _naverReturnsData에서 조회
    const rd = _naverReturnsData[item.itemcode];
    if (rd && rd[sortKey] != null) return parseFloat(rd[sortKey]);
    return null;
  };
  items.sort((a, b) => {
    const va = valOf(a), vb = valOf(b);
    // null/NaN은 항상 뒤로
    const aNull = (va == null || Number.isNaN(va));
    const bNull = (vb == null || Number.isNaN(vb));
    if (aNull && bNull) return 0;
    if (aNull) return 1;
    if (bNull) return -1;
    return dir === 'asc' ? (va - vb) : (vb - va);
  });
  renderNaverEtfList(items, items.length, sortKey, _naverCategoryMarketSums);
}

function switchNaverTab(categoryKey) {
  const isSpecial = (categoryKey === '' || categoryKey === 'new_this_month' || categoryKey === 'new_this_year' || categoryKey === 'none');

  } else {
    _naverTabActive = _naverTabActive.filter(k => k !== '' && k !== 'new_this_month' && k !== 'new_this_year' && k !== 'none');
    if (_naverTabActive.includes(categoryKey)) {
      _naverTabActive = _naverTabActive.filter(k => k !== categoryKey);
    } else {
      _naverTabActive.push(categoryKey);
    }
    if (_naverTabActive.length === 0) _naverTabActive = ['none'];
  }
  renderNaverTabs(_naverTabActive);
  if (_naverDataReady) applyNaverFilter(_naverTabActive, _naverSort);
  else initNaverEtfData();
}

    window._naverSortDir[sort] = (window._naverSortDir[sort] === 'asc') ? 'desc' : 'asc';

function fillCachedNaverData(items) {

    if (Object.prototype.hasOwnProperty.call(_naverAvgCapsData, c)) {

// 수익률 셀 채우기
function fillReturnCells(code, info) {
  for (const key of ['ytd','m1','m3','m6','y1','y3','y5','y10']) {
    const el = document.getElementById(`ret_${key}_${code}`);
    if (!el) continue;
    if (!info || info[key] == null) { el.innerHTML = '<span class="text-gray-700">-</span>'; continue; }
    const v = info[key];
    const cls = v > 0 ? 'text-red-400' : v < 0 ? 'text-blue-400' : 'text-gray-400';
    el.innerHTML = `<span class="${cls} font-semibold">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
  }
  // 1D: 직전 종가 기준 시장가 등락률(d1)로 교체 — 다른 수익률과 기준일 통일
  // (d1 없으면 초기 렌더의 라이브 changeRate 값 그대로 유지)
  if (info && info.d1 != null) {
    const dEl = document.getElementById(`ret_d1_${code}`);
    if (dEl) {
      const v = info.d1;
      const cls = v > 0 ? 'text-red-400' : v < 0 ? 'text-blue-400' : 'text-gray-400';
      dEl.className = `py-1.5 px-1.5 text-right ${cls} font-semibold`;
      dEl.innerHTML = `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
    }
  }
  // 총보수
  const terEl = document.getElementById(`ter_${code}`);
  if (terEl) {
    if (!info || (info.ter == null && info.realCost == null)) {
      terEl.innerHTML = '<span class="text-gray-700">-</span>';
    } else {
      const fmtPct = v => v == null ? '-' : parseFloat(v.toFixed(4)) + '%';
      terEl.innerHTML = `<span class="text-gray-400">${fmtPct(info.ter)}</span>`;
    }
  }
  // 상장일
  const ldEl = document.getElementById(`listdate_${code}`);
  if (ldEl && info?.listDate) ldEl.textContent = '상장: ' + info.listDate;

  // 수익률 기준일 — 해당 행의 asOf 배지 업데이트 (최초 1회 전역 배지도 갱신)
  if (info?.asOf) {
    const aEl = document.getElementById(`asof_${code}`);
    if (aEl) aEl.textContent = info.asOf;
    // 전역 기준일 배지 (테이블 헤더)
    const globalBadge = document.getElementById('returns_asof_badge');
    if (globalBadge && !globalBadge.dataset.set) {
      globalBadge.textContent = '📅 ' + info.asOf + ' 종가 기준';
      globalBadge.dataset.set = '1';
    }
  }
}

// 수익률 로드 (200개 단위, 탭 전환 시 진행 중 fetch 즉시 중단)
let _returnsLoadId = 0;
let _returnsAbort = null;

async function loadReturns(codes) {
  if (!codes.length) return;
  // 이전 진행 중 fetch 즉시 중단
  if (_returnsAbort) { _returnsAbort.abort(); _returnsAbort = null; }
  const myId = ++_returnsLoadId;

  const CHUNK = 200;
  const missing = codes.filter(c => !Object.prototype.hasOwnProperty.call(_naverReturnsData, c));

  // 기준일 배지: 새로 가져올 데이터가 있을 때만 리셋 (탭 재방문·캐시 적중 시 배지 유지)
  const badge = document.getElementById('returns_asof_badge');
  if (badge && missing.length) { badge.textContent = ''; delete badge.dataset.set; }

  if (!missing.length) {
    // 전부 캐시 — 캐시된 데이터에서 기준일을 복원해 배지가 사라지지 않도록 보장
    if (badge && !badge.dataset.set) {
      for (const c of codes) {
        const d = _naverReturnsData[c];
        if (d?.asOf) { badge.textContent = d.asOf + ' 기준'; badge.dataset.set = '1'; break; }
      }
    }
    return;
  }

  const total = missing.length;
  let done = 0;

  const updateProgress = () => {
    const bar = document.getElementById('retLoadProgress');
    if (!bar) return;
    if (done >= total) { bar.remove(); return; }
    bar.textContent = `수익률 로딩 ${done}/${total}`;
  };

  const listEl = document.getElementById('naverEtfList');
  if (listEl) {
    const existing = document.getElementById('retLoadProgress');
    if (!existing) {
      const p = document.createElement('p');
      p.id = 'retLoadProgress';
      p.className = 'text-[10px] text-gray-500 mb-1';
      listEl.prepend(p);
    }
    updateProgress();
  }

  for (let i = 0; i < missing.length; i += CHUNK) {
    if (myId !== _returnsLoadId) return;
    const chunk = missing.slice(i, i + CHUNK);
    const ac = new AbortController();
    _returnsAbort = ac;
    try {
      const r = await fetch(`${API}/funds/naver/returns?codes=${chunk.join(',')}`, {
        signal: AbortSignal.any([ac.signal, AbortSignal.timeout(120000)])
      });
      if (!r.ok) { console.warn('[loadReturns] HTTP', r.status); done += chunk.length; updateProgress(); continue; }
      const data = await r.json();
      if (myId !== _returnsLoadId) return;  // fetch 완료 후에도 재확인
      let fillCnt = 0;
      for (const [code, info] of Object.entries(data)) {
        _naverReturnsData[code] = info;
        fillReturnCells(code, info);
        if (info) fillCnt++;
      }
      console.log('[loadReturns] chunk', i/CHUNK + 1, ':', chunk.length, 'req,', fillCnt, 'filled');
      done += chunk.length;
      updateProgress();
    } catch (err) {
      if (err?.name === 'AbortError') return;  // 의도적 중단 — 조용히 종료
      console.error('[loadReturns]', err);
      done += chunk.length;
      updateProgress();
    }
  }
  _returnsAbort = null;
}
window.loadReturns = loadReturns;
