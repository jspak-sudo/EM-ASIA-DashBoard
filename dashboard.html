// 통화승수 합본 차트 (좌축 $T: M2·본원통화 / 우축 배수: 승수)
function drawMoneyMultChart(period) {
  if (!_liqData) return;
  window._liqPeriods = window._liqPeriods || {};
  window._liqPeriods['liqMoneyMultChart'] = period;

  const canvas = document.getElementById('liqMoneyMultChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 320;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 30, right: 56, bottom: 36, left: 56 };

  const cutoffMap = { '1Y': 365, '3Y': 1095, '5Y': 1825, '10Y': 3650, 'ALL': 99999 };
  const days = cutoffMap[period] || 1825;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().split('T')[0];

  // M2·본원통화 모두 월간 → M2 날짜를 기준축으로, 본원통화(BOGMBASE) fill-forward
  const m2Arr   = (_liqData.series.m2?.data      || []).filter(d => d.date >= cutoffStr);
  const baseArr = (_liqData.series.monbase?.data || []).filter(d => d.date >= cutoffStr);
  if (m2Arr.length < 2 || baseArr.length < 1) {
    ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('데이터 부족', W/2, H/2); return;
  }
  const ffwd = (arr, dates) => {
    const m = new Map(arr.map(d => [d.date, d.value]));
    const out = new Map(); let last = null;
    for (const dt of dates) { if (m.has(dt)) last = m.get(dt); out.set(dt, last); }
    return out;
  };
  const dates = m2Arr.map(d => d.date).sort();
  const mapBase = ffwd(baseArr, dates);

  // 포인트: $T 단위 + 승수 (M2·본원통화 모두 십억$ → /1e3 = $T)
  const points = [];
  for (const dt of dates) {
    const m2 = m2Arr.find(d => d.date === dt).value;   // 십억$
    const base = mapBase.get(dt);                       // 십억$ (BOGMBASE)
    if (base == null || m2 == null) continue;
    const baseT = base / 1e3, m2T = m2 / 1e3;
    if (baseT <= 0) continue;
    points.push({ date: dt, base: baseT, m2: m2T, mult: m2T / baseT });
  }
  if (points.length < 2) return;

  // 로그 모드 (좌축 금액에만 적용, 우축 배수는 항상 선형)
  const logMode = (window._liqScaleModes && window._liqScaleModes['liqMoneyMultChart']) === 'log';

  // 좌축(금액) / 우축(배수) 스케일
  const amtVals = points.flatMap(p => [p.m2, p.base]);
  const lMaxRaw = Math.max(...amtVals), lMinPos = Math.min(...amtVals.filter(v => v > 0));
  const lMin = logMode ? lMinPos * 0.9 : 0;
  const lMax = logMode ? lMaxRaw * 1.1 : lMaxRaw * 1.08;
  const mults = points.map(p => p.mult);
  const rMin = Math.min(...mults) * 0.95, rMax = Math.max(...mults) * 1.05;

  const chH = H - pad.top - pad.bottom;
  const lg = Math.log10(lMax / lMin) || 1;
  const xOf = i => pad.left + (i / (points.length - 1)) * (W - pad.left - pad.right);
  const yL  = v => logMode
    ? pad.top + (1 - Math.log10(Math.max(v, lMin) / lMin) / lg) * chH
    : pad.top + (1 - (v - lMin) / (lMax - lMin)) * chH;
  const yR  = v => pad.top + (1 - (v - rMin) / (rMax - rMin)) * chH;

  // 배경
  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0, 0, W, H);

  // NBER 침체 음영
  const firstMs = new Date(points[0].date).getTime();
  const lastMs  = new Date(points[points.length-1].date).getTime();
  const totalMs = lastMs - firstMs || 1;
  const dateToX = d => pad.left + ((new Date(d).getTime() - firstMs) / totalMs) * (W - pad.left - pad.right);
  try { drawRecessionShading(ctx, pad, H - pad.top - pad.bottom, W - pad.left - pad.right, firstMs, lastMs, dateToX); } catch {}

  // 좌축 격자 + 라벨 ($T)
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const v = logMode
      ? lMin * Math.pow(lMax / lMin, i / yTicks)   // 로그: 등비 간격
      : lMin + (lMax - lMin) * (i / yTicks);
    const y = yL(v);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('$' + (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + 'T', pad.left - 4, y + 3);
  }
  // 우축 라벨 (배수)
  ctx.textAlign = 'left';
  for (let i = 0; i <= yTicks; i++) {
    const v = rMin + (rMax - rMin) * (i / yTicks);
    ctx.fillStyle = '#fbbf24'; ctx.font = '10px sans-serif';
    ctx.fillText(v.toFixed(1) + '배', W - pad.right + 4, yR(v) + 3);
  }

  // X축 라벨
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const xLabels = 6;
  for (let i = 0; i <= xLabels; i++) {
    const idx = Math.round(i / xLabels * (points.length - 1));
    ctx.fillText(points[idx].date.slice(0, 7), xOf(idx), H - 6);
  }

  // 면적: 본원통화 (좌축, 파랑)
  ctx.beginPath(); ctx.moveTo(xOf(0), yL(points[0].base));
  points.forEach((p, i) => ctx.lineTo(xOf(i), yL(p.base)));
  ctx.lineTo(xOf(points.length-1), H - pad.bottom); ctx.lineTo(xOf(0), H - pad.bottom);
  ctx.closePath(); ctx.fillStyle = 'rgba(96,165,250,0.18)'; ctx.fill();
  // 선: 본원통화
  ctx.beginPath(); ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2;
  points.forEach((p, i) => { const x=xOf(i), y=yL(p.base); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();

  // 선: M2 (좌축, 초록)
  ctx.beginPath(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2;
  points.forEach((p, i) => { const x=xOf(i), y=yL(p.m2); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();

  // 선: 통화승수 (우축, 노랑 굵게)
  ctx.beginPath(); ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.8;
  points.forEach((p, i) => { const x=xOf(i), y=yR(p.mult); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();

  // 범례
  const last = points[points.length - 1];
  ctx.textAlign = 'left'; ctx.font = 'bold 11px sans-serif';
  ctx.fillStyle = '#34d399'; ctx.fillRect(pad.left, 10, 14, 3);
  ctx.fillStyle = '#e2e8f0'; ctx.fillText('M2 $' + last.m2.toFixed(1) + 'T', pad.left + 18, 18);
  ctx.fillStyle = '#60a5fa'; ctx.fillRect(pad.left + 130, 10, 14, 3);
  ctx.fillStyle = '#e2e8f0'; ctx.fillText('본원통화(BOGMBASE) $' + last.base.toFixed(2) + 'T', pad.left + 148, 18);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(pad.left + 300, 10, 14, 3);
  ctx.fillStyle = '#fbbf24'; ctx.fillText('승수 ' + last.mult.toFixed(2) + '배', pad.left + 318, 18);

  // 툴팁
  let tip = document.getElementById('liqMoneyMultTooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'liqMoneyMultTooltip';
    tip.className = 'fixed bg-gray-900/95 border border-gray-600 text-[11px] text-white px-3 py-2 rounded pointer-events-none z-50 hidden leading-relaxed';
    document.body.appendChild(tip);
  }
  if (canvas._mmMove) canvas.removeEventListener('mousemove', canvas._mmMove);
  if (canvas._mmLeave) canvas.removeEventListener('mouseleave', canvas._mmLeave);
  canvas._mmMove = ev => {
    const br = canvas.getBoundingClientRect();
    const mx = (ev.clientX - br.left) * (W / br.width);
    const ratio = (mx - pad.left) / (W - pad.left - pad.right);
    const idx = Math.max(0, Math.min(points.length - 1, Math.round(ratio * (points.length - 1))));
    const p = points[idx];
    tip.innerHTML = '<b>' + p.date + '</b><br>'
      + '<span style="color:#34d399">M2:</span> $' + p.m2.toFixed(2) + 'T<br>'
      + '<span style="color:#60a5fa">본원통화:</span> $' + p.base.toFixed(2) + 'T<br>'
      + '<span style="color:#fbbf24">통화승수:</span> ' + p.mult.toFixed(2) + '배';
    tip.classList.remove('hidden');
    tip.style.left = (ev.clientX + 15 + 200 > window.innerWidth ? ev.clientX - 215 : ev.clientX + 15) + 'px';
    tip.style.top = Math.max(5, ev.clientY - 55) + 'px';
  };
  canvas._mmLeave = () => tip.classList.add('hidden');
  canvas.addEventListener('mousemove', canvas._mmMove);
  canvas.addEventListener('mouseleave', canvas._mmLeave);
}
window.drawMoneyMultChart = drawMoneyMultChart;

// 실질금리(좌축 역축) vs 금 가격(우축)
function drawGoldRealChart(period) {
  if (!_liqData) return;
  window._liqPeriods = window._liqPeriods || {};
  window._liqPeriods['liqGoldRealChart'] = period;
  const canvas = document.getElementById('liqGoldRealChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 30, right: 64, bottom: 36, left: 52 };

  const cutoffMap = { '1Y': 365, '3Y': 1095, '5Y': 1825, '10Y': 3650, 'ALL': 99999 };
  const days = cutoffMap[period] || 1825;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().split('T')[0];

  const realArr = (_liqData.series.real10y?.data || []).filter(d => d.date >= cutoffStr);
  const goldArr = (_liqData.series.gold?.data   || []).filter(d => d.date >= cutoffStr);
  if (realArr.length < 2 || goldArr.length < 2) {
    ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('데이터 부족', W/2, H/2); return;
  }
  // 금 날짜축 기준, 실질금리 fill-forward
  const ffwd = (arr, dates) => { const m=new Map(arr.map(d=>[d.date,d.value])); const o=new Map(); let last=null; for(const dt of dates){ if(m.has(dt))last=m.get(dt); o.set(dt,last);} return o; };
  const dates = goldArr.map(d => d.date).sort();
  const mapReal = ffwd(realArr, dates);
  const points = [];
  for (const dt of dates) {
    const g = goldArr.find(d => d.date === dt).value;
    const r = mapReal.get(dt);
    if (g == null || r == null) continue;
    points.push({ date: dt, gold: g, real: r });
  }
  if (points.length < 2) return;

  const golds = points.map(p => p.gold), reals = points.map(p => p.real);
  const gMin = Math.min(...golds) * 0.97, gMax = Math.max(...golds) * 1.03;
  const rMin = Math.min(...reals) - 0.1, rMax = Math.max(...reals) + 0.1;
  const chH = H - pad.top - pad.bottom;
  const xOf = i => pad.left + (i / (points.length - 1)) * (W - pad.left - pad.right);
  const yGold = v => pad.top + (1 - (v - gMin) / (gMax - gMin)) * chH;
  // 실질금리는 역축: 값이 작을수록 위로
  const yReal = v => pad.top + ((v - rMin) / (rMax - rMin)) * chH;

  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0, 0, W, H);
  const firstMs = new Date(points[0].date).getTime(), lastMs = new Date(points[points.length-1].date).getTime();
  const dateToX = d => pad.left + ((new Date(d).getTime() - firstMs) / ((lastMs-firstMs)||1)) * (W - pad.left - pad.right);
  try { drawRecessionShading(ctx, pad, chH, W - pad.left - pad.right, firstMs, lastMs, dateToX); } catch {}

  // 좌축(실질금리, 역축) 격자·라벨
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
  const yT = 5;
  for (let i = 0; i <= yT; i++) {
    const v = rMin + (rMax - rMin) * (i / yT);
    const y = yReal(v);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#34d399'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(v.toFixed(1) + '%', pad.left - 4, y + 3);
  }
  // 우축(금) 라벨
  ctx.textAlign = 'left';
  for (let i = 0; i <= yT; i++) {
    const v = gMin + (gMax - gMin) * (i / yT);
    ctx.fillStyle = '#fbbf24'; ctx.font = '10px sans-serif';
    ctx.fillText('$' + Math.round(v).toLocaleString(), W - pad.right + 4, yGold(v) + 3);
  }
  // X축
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  for (let i = 0; i <= 6; i++) { const idx = Math.round(i/6*(points.length-1)); ctx.fillText(points[idx].date.slice(0,7), xOf(idx), H - 6); }

  // 금 선 (우축, 노랑)
  ctx.beginPath(); ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.4;
  points.forEach((p, i) => { const x=xOf(i), y=yGold(p.gold); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
  // 실질금리 선 (좌축 역축, 초록)
  ctx.beginPath(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2.4;
  points.forEach((p, i) => { const x=xOf(i), y=yReal(p.real); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();

  // 범례
  const last = points[points.length-1];
  ctx.textAlign = 'left'; ctx.font = 'bold 11px sans-serif';
  ctx.fillStyle = '#34d399'; ctx.fillRect(pad.left, 10, 14, 3);
  ctx.fillStyle = '#e2e8f0'; ctx.fillText('10Y 실질금리 ' + last.real.toFixed(2) + '% (역축)', pad.left + 18, 18);
  ctx.fillStyle = '#fbbf24'; ctx.fillRect(pad.left + 220, 10, 14, 3);
  ctx.fillStyle = '#e2e8f0'; ctx.fillText('금 $' + Math.round(last.gold).toLocaleString(), pad.left + 238, 18);

  // 상관계수
  const n = points.length;
  const mr = reals.reduce((a,b)=>a+b,0)/n, mg = golds.reduce((a,b)=>a+b,0)/n;
  let cov=0, vr=0, vg=0;
  for (const p of points) { const dr=p.real-mr, dg=p.gold-mg; cov+=dr*dg; vr+=dr*dr; vg+=dg*dg; }
  const corr = (vr&&vg) ? cov/Math.sqrt(vr*vg) : 0;
  ctx.textAlign = 'right'; ctx.font = '10px sans-serif'; ctx.fillStyle = '#9ca3af';
  ctx.fillText('상관계수 ' + corr.toFixed(2) + (corr < -0.3 ? ' (역상관 ✓)' : ''), W - pad.right, H - 6);

  // 툴팁
  let tip = document.getElementById('liqGoldRealTooltip');
  if (!tip) { tip = document.createElement('div'); tip.id='liqGoldRealTooltip'; tip.className='fixed bg-gray-900/95 border border-gray-600 text-[11px] text-white px-3 py-2 rounded pointer-events-none z-50 hidden leading-relaxed'; document.body.appendChild(tip); }
  if (canvas._grMove) canvas.removeEventListener('mousemove', canvas._grMove);
  if (canvas._grLeave) canvas.removeEventListener('mouseleave', canvas._grLeave);
  canvas._grMove = ev => {
    const br = canvas.getBoundingClientRect();
    const mx = (ev.clientX - br.left) * (W / br.width);
    const idx = Math.max(0, Math.min(points.length-1, Math.round((mx-pad.left)/(W-pad.left-pad.right)*(points.length-1))));
    const p = points[idx];
    tip.innerHTML = '<b>'+p.date+'</b><br><span style="color:#34d399">실질금리:</span> '+p.real.toFixed(2)+'%<br><span style="color:#fbbf24">금:</span> $'+Math.round(p.gold).toLocaleString();
    tip.classList.remove('hidden');
    tip.style.left = (ev.clientX+15+200>window.innerWidth?ev.clientX-215:ev.clientX+15)+'px';
    tip.style.top = Math.max(5, ev.clientY-50)+'px';
  };
  canvas._grLeave = () => tip.classList.add('hidden');
  canvas.addEventListener('mousemove', canvas._grMove);
  canvas.addEventListener('mouseleave', canvas._grLeave);
}
window.drawGoldRealChart = drawGoldRealChart;

// 과거 금값 연평균 (London PM fix, USD/oz) 1968~1999 — 공개 역사 데이터
const _goldAnnual = {
  1968:39,1969:41,1970:36,1971:41,1972:58,1973:97,1974:159,1975:161,1976:125,
  1977:148,1978:193,1979:306,1980:615,1981:460,1982:376,1983:424,1984:361,
  1985:317,1986:368,1987:447,1988:437,1989:381,1990:384,1991:362,1992:344,
  1993:360,1994:384,1995:384,1996:388,1997:331,1998:294,1999:279
};

// 장기 실질금리(명목 10Y − CPI 전년비, 역축) vs 금 (1968~)
function drawGoldLongChart(period) {
  if (!_liqData) return;
  const canvas = document.getElementById('liqGoldLongChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = 340;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 30, right: 64, bottom: 36, left: 48 };

  // ── 금값: 과거 연평균(1968~1999) + Yahoo 일간(2000~) 접합, 월말 기준으로 통일 ──
  const goldMonthly = new Map();   // 'YYYY-MM' → price
  for (const [y, v] of Object.entries(_goldAnnual)) {
    for (let m = 1; m <= 12; m++) goldMonthly.set(y + '-' + String(m).padStart(2,'0'), v);
  }
  (_liqData.series.gold?.data || []).forEach(d => {
    goldMonthly.set(d.date.slice(0,7), d.value);   // 같은 달이면 마지막값(월말)로 덮어씀
  });

  // ── CPI 전년비(YoY) 월별 맵 ──
  const cpiArr = _liqData.series.cpi?.data || [];
  const cpiMap = new Map(cpiArr.map(d => [d.date.slice(0,7), d.value]));
  const cpiYoY = new Map();
  cpiArr.forEach(d => {
    const ym = d.date.slice(0,7);
    const [y,m] = ym.split('-');
    const prev = cpiMap.get((+y-1) + '-' + m);
    if (prev) cpiYoY.set(ym, (d.value/prev - 1) * 100);
  });

  // ── 명목 10Y 월별(해당 월 마지막 관측) ──
  const nomMap = new Map();
  (_liqData.series.dgs10?.data || []).forEach(d => { if (d.value != null) nomMap.set(d.date.slice(0,7), d.value); });

  // ── 1968-01 ~ 현재 월별 포인트 구성 ──
  const points = [];
  const start = new Date('1968-01-01'), end = new Date();
  for (let dt = new Date(start); dt <= end; dt.setMonth(dt.getMonth()+1)) {
    const ym = dt.toISOString().slice(0,7);
    const gold = goldMonthly.get(ym);
    const nom = nomMap.get(ym);
    const inf = cpiYoY.get(ym);
    if (gold == null || nom == null || inf == null) continue;
    points.push({ date: ym, gold, real: nom - inf });
  }
  if (points.length < 2) {
    ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('데이터 부족', W/2, H/2); return;
  }

  const golds = points.map(p=>p.gold), reals = points.map(p=>p.real);
  const gMin = Math.min(...golds)*0.9, gMax = Math.max(...golds)*1.05;
  const rMin = Math.min(...reals)-0.5, rMax = Math.max(...reals)+0.5;
  const chH = H - pad.top - pad.bottom;
  const xOf = i => pad.left + (i/(points.length-1))*(W-pad.left-pad.right);
  // 금: 로그축(범위가 $36~$4000로 매우 큼)
  const gLg = Math.log10(gMax/gMin) || 1;
  const yGold = v => pad.top + (1 - Math.log10(Math.max(v,gMin)/gMin)/gLg)*chH;
  const yReal = v => pad.top + ((v - rMin)/(rMax - rMin))*chH;  // 역축

  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
  const firstMs = new Date(points[0].date+'-01').getTime(), lastMs = new Date(points[points.length-1].date+'-01').getTime();
  const dateToX = d => pad.left + ((new Date(d).getTime()-firstMs)/((lastMs-firstMs)||1))*(W-pad.left-pad.right);
  try { drawRecessionShading(ctx, pad, chH, W-pad.left-pad.right, firstMs, lastMs, dateToX); } catch {}

  // 실질금리 0% 기준선 (역축)
  if (rMin < 0 && rMax > 0) {
    const y0 = yReal(0);
    ctx.strokeStyle = 'rgba(248,113,113,0.4)'; ctx.lineWidth = 1; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(pad.left, y0); ctx.lineTo(W-pad.right, y0); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(248,113,113,0.7)'; ctx.font='9px sans-serif'; ctx.textAlign='left';
    ctx.fillText('실질금리 0%', pad.left+2, y0-2);
  }

  // 좌축(실질금리 역축) 라벨
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5; const yT=5;
  for (let i=0;i<=yT;i++){ const v=rMin+(rMax-rMin)*(i/yT); const y=yReal(v);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    ctx.fillStyle='#34d399'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText(v.toFixed(0)+'%', pad.left-4, y+3); }
  // 우축(금, 로그) 라벨
  ctx.textAlign='left';
  for (let i=0;i<=yT;i++){ const v=gMin*Math.pow(gMax/gMin,i/yT);
    ctx.fillStyle='#fbbf24'; ctx.font='10px sans-serif'; ctx.fillText('$'+Math.round(v).toLocaleString(), W-pad.right+4, yGold(v)+3); }
  // X축
  ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  for (let i=0;i<=8;i++){ const idx=Math.round(i/8*(points.length-1)); ctx.fillText(points[idx].date.slice(0,4), xOf(idx), H-6); }

  // 금 선 (우축 로그, 노랑)
  ctx.beginPath(); ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2;
  points.forEach((p,i)=>{const x=xOf(i),y=yGold(p.gold); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}); ctx.stroke();
  // 실질금리 선 (좌축 역축, 초록)
  ctx.beginPath(); ctx.strokeStyle='#34d399'; ctx.lineWidth=2;
  points.forEach((p,i)=>{const x=xOf(i),y=yReal(p.real); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}); ctx.stroke();

  // 1971 금태환 정지 표시
  const idx71 = points.findIndex(p => p.date >= '1971-08');
  if (idx71 > 0) {
    const x = xOf(idx71);

function runCpBacktest() {
  const raw = window._cpRaw;
  const stratDefs = window._cpStratDefs;
  if (!raw || !stratDefs) return;

  const fromVal = (document.getElementById('cpFrom') || {}).value;
  const toVal   = (document.getElementById('cpTo')   || {}).value;
  const customPer = parseInt((document.getElementById('cpCustomPer') || {}).value);

  let periods = [...(window._cpSelectedPeriods || [20, 60, 252])];
  if (!isNaN(customPer) && customPer > 0 && !periods.includes(customPer)) periods.push(customPer);
  periods.sort((a, b) => a - b);
  if (!periods.length) periods = [20, 60, 252];

  // 날짜 필터
  const subset = raw.filter(r => (!fromVal || r.d >= fromVal) && (!toVal || r.d <= toVal));
  if (subset.length < 20) {
    const st = document.getElementById('cpStatus');
    if (st) st.textContent = '⚠️ 데이터 부족 (최소 20일 필요)';
    return;
  }

  const st = document.getElementById('cpStatus');
  if (st) st.textContent = subset[0].d + ' ~ ' + subset[subset.length - 1].d + ' (' + subset.length + '일)';

  function calcStats(rets) {
    if (!rets.length) return null;
    const avg = rets.reduce((a, b) => a + b, 0) / rets.length;
    const win = rets.filter(r => r > 0).length;
    const sorted = [...rets].sort((a, b) => a - b);
    const m = Math.floor(sorted.length / 2);
    const median = sorted.length % 2 ? sorted[m] : (sorted[m - 1] + sorted[m]) / 2;
    const minRet = sorted[0], maxRet = sorted[sorted.length - 1];
    return {
      avg:     Math.round(avg    * 100) / 100,
      median:  Math.round(median * 100) / 100,
      winRate: Math.round(win / rets.length * 1000) / 10,
      minRet:  Math.round(minRet * 100) / 100,
      maxRet:  Math.round(maxRet * 100) / 100,
      n:       rets.length,
    };
  }

  // 전략별 계산
  const rows = stratDefs.map(strat => {
    const row = { key: strat.key, label: strat.label };
    periods.forEach(n => {
      const rets = [];
      for (let i = 0; i < subset.length - n; i++) {
        if (subset[i].f <= strat.fgMax) {
          rets.push((subset[i + n].s / subset[i].s - 1) * 100);
        }
      }
      row['d' + n] = calcStats(rets);
    });
    return row;
  });

  // Buy & Hold
  const bh = { key: 'buyhold', label: 'Buy & Hold' };
  periods.forEach(n => {
    const rets = [];
    for (let i = 0; i < subset.length - n; i++) {
      rets.push((subset[i + n].s / subset[i].s - 1) * 100);
    }
    bh['d' + n] = calcStats(rets);
  });

  // ── 결과 렌더링 ──
  const pColor = v => v >= 0 ? '#34d399' : '#f87171';
  const fmtRet = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  const rowBgs = ['', 'bg-orange-500/5', 'bg-red-500/8', 'bg-red-500/12', 'bg-red-500/18'];

  let html = '<div class="overflow-auto"><table class="w-full text-[11.5px]"><thead>'
    + '<tr class="border-b-2 border-[#2a2d3a]" style="background:#12141e">'
    + '<th class="text-left py-2 px-3 text-gray-400 min-w-[160px]">전략</th>'
    + periods.map(n => '<th class="text-center py-2 px-2 text-gray-400 whitespace-nowrap">' + n + '일</th>').join('')
    + '</tr></thead><tbody>';

  rows.forEach((row, idx) => {
    const bg = rowBgs[idx] || '';
    html += '<tr class="border-b border-[#1e2030]/60 ' + bg + '">'
      + '<td class="py-1.5 px-3 text-gray-300">' + row.label + '</td>'
      + periods.map(n => {
          const d = row['d' + n];
          const bd = bh['d' + n];
          if (!d) return '<td class="text-center py-1.5 px-2 text-gray-600 text-[10px]">신호없음</td>';
          const beat = bd && d.avg > bd.avg;
          return '<td class="text-center py-1.5 px-1">'
            + '<span style="color:' + (beat ? '#34d399' : pColor(d.avg)) + ';font-weight:' + (beat ? '700' : '400') + '">' + fmtRet(d.avg) + (beat ? ' ▲' : '') + '</span>'
            + '<br><span class="text-[9px] text-gray-500">승률 ' + d.winRate + '%</span>'
            + '<br><span class="text-[9px] text-gray-600">n=' + d.n + '</span>'
            + '</td>';
        }).join('')
      + '</tr>';
  });

  // B&H 행
  html += '<tr class="border-t-2 border-[#2a2d3a] bg-blue-500/5">'
    + '<td class="py-1.5 px-3 text-blue-300 font-medium">Buy & Hold</td>'
    + periods.map(n => {
        const d = bh['d' + n];
        if (!d) return '<td class="text-center py-1.5 px-2 text-gray-600">-</td>';
        return '<td class="text-center py-1.5 px-1">'
          + '<span style="color:#60a5fa;font-weight:600">' + fmtRet(d.avg) + '</span>'
          + '<br><span class="text-[9px] text-gray-500">승률 ' + d.winRate + '%</span>'
          + '<br><span class="text-[9px] text-gray-600">n=' + d.n + '</span>'
          + '</td>';
      }).join('')
    + '</tr>';

  html += '</tbody></table></div>';

  // 상세 통계 (접기)
  html += '<details class="mt-3"><summary class="text-[10px] text-gray-500 cursor-pointer hover:text-gray-300 select-none">▶ 중앙값 / 최대손실 / 최대수익 상세 보기</summary>'
    + '<div class="overflow-auto mt-2"><table class="w-full text-[11px]"><thead>'
    + '<tr class="border-b border-[#2a2d3a]" style="background:#12141e">'
    + '<th class="text-left py-1.5 px-3 text-gray-400">전략</th>'
    + periods.map(n => '<th class="text-center py-1.5 px-2 text-gray-400 whitespace-nowrap" colspan="3">' + n + '일</th>').join('')
    + '</tr>'
    + '<tr class="border-b border-[#2a2d3a]" style="background:#12141e">'
    + '<th class="py-1 px-3"></th>'
    + periods.map(() => '<th class="text-center py-1 px-1 text-gray-500 text-[9px]">중앙값</th><th class="text-center py-1 px-1 text-gray-500 text-[9px]">최대손실</th><th class="text-center py-1 px-1 text-gray-500 text-[9px]">최대수익</th>').join('')
    + '</tr></thead><tbody>';

  [...rows, bh].forEach((row, idx) => {
    const isLast = idx === rows.length;
    html += '<tr class="border-b border-[#1e2030]/40 ' + (isLast ? 'border-t-2 border-[#2a2d3a] bg-blue-500/5' : '') + '">'
      + '<td class="py-1 px-3 ' + (isLast ? 'text-blue-300' : 'text-gray-400') + ' text-[11px]">' + row.label + '</td>'
      + periods.map(n => {
          const d = row['d' + n];
          if (!d) return '<td colspan="3" class="text-center text-gray-600 text-[10px]">-</td>';
          return '<td class="text-center py-1 px-1" style="color:' + pColor(d.median) + '">' + fmtRet(d.median) + '</td>'
            + '<td class="text-center py-1 px-1 text-red-400">' + fmtRet(d.minRet) + '</td>'
            + '<td class="text-center py-1 px-1 text-green-400">' + fmtRet(d.maxRet) + '</td>';
        }).join('')
      + '</tr>';
  });

  html += '</tbody></table></div></details>'
    + '<p class="text-[9px] text-gray-600 mt-3">▲ = Buy&Hold 대비 초과수익 | 신호 발생 시점 기준 단순 forward return</p>';

  const result = document.getElementById('cpResult');
  if (result) result.innerHTML = html;
}

  }

function runFgSim() {
  const raw = window._cpRaw;
  if (!raw || !raw.length) return;

  const threshold  = parseInt(document.getElementById('simThresh')?.value || 25);
  const monthly    = parseFloat(document.getElementById('simMonthly')?.value || 100);
  const fromVal    = document.getElementById('simFrom')?.value || '';
  const toVal      = document.getElementById('simTo')?.value   || '';

  const subset = raw.filter(r => (!fromVal || r.d >= fromVal) && (!toVal || r.d <= toVal));
  if (subset.length < 30) { const st = document.getElementById('simStatus'); if (st) st.textContent = '⚠️ 데이터 부족'; return; }

  // ── 전략 A: F&G ≤ threshold 일 때 적립된 현금 일괄 매수 ──────────────
  // ── 전략 B: 매월 첫 거래일 무조건 매수 ───────────────────────────────

  let cashA = 0, sharesA = 0, totalInA = 0;
  let cashB = 0, sharesB = 0, totalInB = 0;
  let curMonth = '', boughtThisMonthA = false;

  const portA = [], portB = [];
  const buysA = [], buysB = [];

  for (let i = 0; i < subset.length; i++) {
    const { d, f, s } = subset[i];
    const mo = d.slice(0, 7);

    // 새 달: 월 적립금 추가
    if (mo !== curMonth) {
      curMonth = mo;
      cashA += monthly;   // 이달 $100 적립 (신호 없으면 영구 현금 보유)
      cashB += monthly;
      boughtThisMonthA = false;

      // 전략 B: 이 달의 첫 영업일 = 지금 i번째 날
      if (cashB > 0) {
        const amt = cashB;
        sharesB  += amt / s;
        totalInB += amt;
        cashB     = 0;
        buysB.push({ d, s, amt, f });
      }
    }

    // 전략 A: 이번 달 아직 미매수 & F&G ≤ threshold → 이달 적립금($monthly)만 투자
    // (누적 현금 일괄 투자 X — 각 달의 $100은 독립적으로 판단)
    if (!boughtThisMonthA && f <= threshold && cashA >= monthly) {
      sharesA  += monthly / s;
      totalInA += monthly;
      cashA    -= monthly;   // 이달 적립금만 차감, 이전 미투자 현금은 그대로 유지
      boughtThisMonthA = true;
      buysA.push({ d, s, amt: monthly, f });
    }

    portA.push({ d, val: sharesA * s + cashA, cash: cashA });
    portB.push({ d, val: sharesB * s + cashB });
  }

  // 마지막 날 기준 잔여 현금도 평가액에 포함 (이미 포함됨)
  const finalA = portA[portA.length - 1].val;
  const finalB = portB[portB.length - 1].val;
  const months = new Set(subset.map(r => r.d.slice(0, 7))).size;
  const totalContrib = months * monthly;

  // CAGR 계산
  const yrs = subset.length / 252;
  const cagrA = yrs > 0 ? (Math.pow(finalA / (totalContrib || 1), 1 / yrs) - 1) * 100 : 0;
  const cagrB = yrs > 0 ? (Math.pow(finalB / (totalContrib || 1), 1 / yrs) - 1) * 100 : 0;

  // MDD 계산
  function calcMDD(port) {
    let peak = 0, mdd = 0;
    for (const p of port) { if (p.val > peak) peak = p.val; const dd = (p.val - peak) / peak * 100; if (dd < mdd) mdd = dd; }
    return Math.round(mdd * 100) / 100;
  }
  const mddA = calcMDD(portA), mddB = calcMDD(portB);

  // 평균 매수가
  const avgPriceA = buysA.length ? buysA.reduce((s, b) => s + b.s, 0) / buysA.length : 0;
  const avgPriceB = buysB.length ? buysB.reduce((s, b) => s + b.s, 0) / buysB.length : 0;

  // 최종 잔여 현금 비율
  const cashRatioA = Math.round(cashA / (cashA + sharesA * subset[subset.length-1].s) * 100);

  // 시뮬레이션 전 기간 평균 현금 보유액 & 비율
  const avgCashA = portA.reduce((s, p) => s + p.cash, 0) / portA.length;
  const avgCashRatioA = Math.round(
    portA.reduce((s, p) => s + (p.val > 0 ? p.cash / p.val * 100 : 0), 0) / portA.length
  );

  // 미투자 개월 수 = 총 개월 - 매수 횟수
  const missedMonths = months - buysA.length;
  const missedCash   = missedMonths * monthly;  // 신호 없어서 영구 현금으로 남은 금액

  // ── 결과 렌더링 ──────────────────────────────────────────────────────
  const fmt  = v => '$' + Math.round(v).toLocaleString();
  const fmtP = v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%';
  const retA = (finalA / totalContrib - 1) * 100, retB = (finalB / totalContrib - 1) * 100;
  const winA = finalA > finalB;

  const st = document.getElementById('simStatus');
  if (st) st.textContent = subset[0].d + ' ~ ' + subset[subset.length-1].d + ' (' + months + '개월)';

  let html = '';

  // 핵심 지표 카드
  const stockValA = finalA - cashA;
  const stockValB = finalB - cashB;

  html += '<div class="grid grid-cols-2 gap-3 mb-4">';
  const metricCard = (title, vA, vB, higherIsBetter) => {
    const aWins = higherIsBetter ? vA > vB : vA < vB;
    return '<div class="bg-[#12141e] rounded-lg p-3">'
      + '<p class="text-[10px] text-gray-500 mb-2">' + title + '</p>'
      + '<div class="flex items-end justify-between">'
      + '<div><p class="text-[9px] text-red-400 mb-0.5">전략 A (F&G ≤ ' + threshold + ')</p>'
      + '<p class="text-[15px] font-bold ' + (aWins ? 'text-green-400' : 'text-gray-300') + '">' + vA + (aWins ? ' 🏆' : '') + '</p></div>'
      + '<div class="text-right"><p class="text-[9px] text-blue-400 mb-0.5">전략 B (월 분할매수)</p>'
      + '<p class="text-[15px] font-bold ' + (!aWins ? 'text-green-400' : 'text-gray-300') + '">' + vB + (!aWins ? ' 🏆' : '') + '</p></div>'
      + '</div></div>';
  };

  // 최종 평가액 — 분류 상세 카드
  const aWinsFinal = finalA > finalB;
  html += '<div class="bg-[#12141e] rounded-lg p-3 col-span-2">'
    + '<p class="text-[10px] text-gray-500 mb-2">최종 평가액</p>'
    + '<div class="grid grid-cols-2 gap-4">'
    // 전략 A
    + '<div>'
    + '<p class="text-[9px] text-red-400 mb-1">전략 A (F&G ≤ ' + threshold + ')</p>'
    + '<p class="text-[18px] font-bold ' + (aWinsFinal ? 'text-green-400' : 'text-gray-300') + ' mb-2">' + fmt(finalA) + (aWinsFinal ? ' 🏆' : '') + '</p>'
    + '<div class="space-y-0.5 text-[10px]">'
    + '<div class="flex justify-between"><span class="text-gray-500">투입 원금</span><span class="text-gray-400">' + fmt(totalContrib) + '</span></div>'
    + '<div class="flex justify-between"><span class="text-gray-500">주식 평가액</span><span class="text-yellow-300">' + fmt(stockValA) + '</span></div>'
    + '<div class="flex justify-between"><span class="text-gray-500">실제 투자액</span><span class="text-gray-400">' + fmt(totalInA) + ' (' + buysA.length + '개월)</span></div>'

function drawSimChart(portA, portB, buysA, buysB, subset) {
  const canvas = document.getElementById('simChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  canvas.width  = container.getBoundingClientRect().width;
  canvas.height = 300;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 20, right: 20, bottom: 28, left: 68 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;

  const allVals = [...portA.map(p => p.val), ...portB.map(p => p.val)];
  const minV = Math.min(...allVals) * 0.97, maxV = Math.max(...allVals) * 1.03;
  const n = portA.length;

  const xOf = i => pad.left + (i / (n - 1)) * cw;
  const yOf = v => pad.top + ch - ((v - minV) / (maxV - minV)) * ch;

  ctx.clearRect(0, 0, W, H);

  // 그리드
  for (let k = 0; k <= 4; k++) {
    const v = minV + (maxV - minV) * k / 4;
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y);
    ctx.strokeStyle = '#1e2030'; ctx.lineWidth = 0.5; ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('$' + Math.round(v / 1000) + 'k', pad.left - 4, y + 3);
  }

  // 전략 B 먼저 (파란선)
  ctx.beginPath();
  portB.forEach((p, i) => i === 0 ? ctx.moveTo(xOf(i), yOf(p.val)) : ctx.lineTo(xOf(i), yOf(p.val)));
  ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 2; ctx.setLineDash([]); ctx.stroke();

  // 전략 A (빨간선)
  ctx.beginPath();
  portA.forEach((p, i) => i === 0 ? ctx.moveTo(xOf(i), yOf(p.val)) : ctx.lineTo(xOf(i), yOf(p.val)));
  ctx.strokeStyle = '#f87171'; ctx.lineWidth = 2.5; ctx.stroke();

  // 전략 A 매수 타점 (빨간 원)
  const buyASet = new Map(buysA.map(b => [b.d, b]));
  portA.forEach((p, i) => {
    if (!buyASet.has(p.d)) return;
    const b = buyASet.get(p.d);
    ctx.beginPath(); ctx.arc(xOf(i), yOf(p.val), 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ef4444'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  });

  // 전략 B 매수 타점 (파란 삼각형)
  const buyBSet = new Map(buysB.map(b => [b.d, b]));
  portB.forEach((p, i) => {
    if (!buyBSet.has(p.d)) return;
    const x = xOf(i), y = yOf(p.val), r = 4;
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y + r); ctx.lineTo(x - r, y + r); ctx.closePath();
    ctx.fillStyle = '#3b82f6'; ctx.fill();
  });

  // X축 레이블 (연도)
  ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const years = [...new Set(subset.map(r => r.d.slice(0, 4)))];
  years.forEach(yr => {
    const idx = subset.findIndex(r => r.d.startsWith(yr));
    if (idx >= 0) ctx.fillText(yr, xOf(idx), H - 6);
  });

  // 범례
  ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#f87171'; ctx.fillRect(pad.left, 4, 14, 3); ctx.fillStyle = '#e5e7eb'; ctx.fillText('전략 A (F&G 타이밍)', pad.left + 18, 10);
  ctx.fillStyle = '#60a5fa'; ctx.fillRect(pad.left + 160, 4, 14, 3); ctx.fillStyle = '#e5e7eb'; ctx.fillText('전략 B (월 분할매수)', pad.left + 178, 10);
  // 타점 범례
  ctx.beginPath(); ctx.arc(pad.left + 330, 7, 4, 0, Math.PI * 2); ctx.fillStyle = '#ef4444'; ctx.fill();
  ctx.fillStyle = '#9ca3af'; ctx.fillText('A 매수', pad.left + 337, 11);
}

// Pearson 상관계수 (두 시계열을 날짜 기준으로 inner-join 후 계산)
function _pearsonCorr(seriesA, seriesB) {
  if (!seriesA || !seriesB || seriesA.length < 5 || seriesB.length < 5) return null;
  const mapB = new Map(seriesB.map(d => [d.date, d.value]));
  const xs = [], ys = [];
  for (const a of seriesA) {
    const bv = mapB.get(a.date);
    if (bv != null && a.value != null && Number.isFinite(a.value) && Number.isFinite(bv)) {
      xs.push(a.value); ys.push(bv);
    }
  }
  const n = xs.length;
  if (n < 5) return null;
  let sx=0, sy=0;
  for (let i=0; i<n; i++) { sx += xs[i]; sy += ys[i]; }
  const mx = sx/n, my = sy/n;
  let num=0, dx=0, dy=0;
  for (let i=0; i<n; i++) {
    const a = xs[i] - mx, b = ys[i] - my;
    num += a*b; dx += a*a; dy += b*b;
  }
  const den = Math.sqrt(dx*dy);
  return den === 0 ? null : (num/den);
}

function _updateCorrBadge(chartId, period, indicatorSeries, spxSeries) {
  const el = document.getElementById(chartId + '-corr');
  if (!el) return;
  if (!spxSeries || spxSeries.length === 0) { el.textContent = ''; return; }
  const parts = [];
  for (const s of indicatorSeries) {
    const r = _pearsonCorr(s.data, spxSeries);
    if (r == null) continue;
    const sign = r >= 0 ? '+' : '';
    const cls = Math.abs(r) >= 0.5 ? (r > 0 ? 'text-emerald-400' : 'text-rose-400')
              : Math.abs(r) >= 0.2 ? (r > 0 ? 'text-emerald-300/70' : 'text-rose-300/70')
              : 'text-gray-400';
    const lbl = (s.label || s.key || '').replace(/\s+/g,'');
    parts.push(`<span class="${cls}">${lbl}: ρ=${sign}${r.toFixed(2)}</span>`);
  }
  if (!parts.length) { el.textContent = ''; return; }
  el.innerHTML = `<span class="text-gray-500">vs SPX (${period})</span> ` + parts.join(' · ');
}

function drawLiqChart(chartId, period) {
  if (!_liqData) return;
  // Stacked composition ?? ?
  if (chartId === 'liqCompositionChart') {
    drawCompositionChart(period);
    return;
  }
  // ?? & ?
  if (chartId === 'liqCurrencyChart') {
    drawCurrencyOtherChart(period);
    return;
  }
  // MMF Stacked
  if (chartId === 'liqMmfChart') {
    drawMmfStackedChart(period);
    return;
  }
  // 통화승수 (M2 + 본원통화 + 승수, 이중축)
  if (chartId === 'liqMoneyMultChart') {
    drawMoneyMultChart(period);
    return;
  }
  // 실질금리(역축) vs 금 (이중축)
  if (chartId === 'liqGoldRealChart') {
    drawGoldRealChart(period);
    return;
  }
  // 장기 실질금리(명목−CPI) vs 금 (1968~)
  if (chartId === 'liqGoldLongChart') {
    drawGoldLongChart(period);
    return;
  }
  const cfg = _liqChartConfigs[chartId];
  if (!cfg) return;
  window._liqPeriods = window._liqPeriods || {};
  window._liqPeriods[chartId] = period;
  const logMode = (window._liqScaleModes && window._liqScaleModes[chartId]) === 'log';

  // Collect all data series
  const allSeries = cfg.keys.map(k => {
    if (k === 'netLiq') return { key: k, data: _liqData.netLiquidity.data || [] };
    return { key: k, data: _liqData.series[k]?.data || [] };
  }).filter(s => s.data.length > 0);

  if (allSeries.length === 0) return;

  // Period filter
  let cutoff = '1900-01-01';
  if (period !== 'ALL') {
    const d = new Date();
    if (period === '1Y') d.setFullYear(d.getFullYear() - 1);
    else if (period === '3Y') d.setFullYear(d.getFullYear() - 3);
    else if (period === '5Y') d.setFullYear(d.getFullYear() - 5);
    else if (period === '10Y') d.setFullYear(d.getFullYear() - 10);
    cutoff = d.toISOString().split('T')[0];
  }

  const filtered = allSeries.map(s => {
    const scaler = cfg.scalers?.[s.key];
    const data = s.data.filter(d => d.date >= cutoff);
    // scaler? ??  ???
    return {
      ...s,
      data: scaler ? data.map(d => ({ date: d.date, value: d.value / scaler })) : data,
    };
  });

  // SPX overlay ???? ?  ? ? (? ? ?)
  let spxData = [];
  if (cfg.spxOverlay && _liqData.series.sp500?.data) {
    // ?? min/max ?
    let primaryMin = cutoff, primaryMax = '9999-12-31';
    if (filtered.length > 0 && filtered[0].data.length > 0) {
      primaryMin = filtered[0].data[0].date;
      primaryMax = filtered[0].data[filtered[0].data.length - 1].date;
    }
    // cutoff?? primary  ????? ??
    const startDate = primaryMin > cutoff ? primaryMin : cutoff;
    spxData = _liqData.series.sp500.data.filter(d => d.date >= startDate && d.date <= primaryMax);
  }

  // 상관계수 배지 업데이트 (filtered + spxData 기준 → 기간 변경시 자동 재계산)
  if (cfg.spxOverlay) {
    const labeled = filtered.map((s, i) => ({ ...s, label: cfg.labels?.[i] || s.key }));
    _updateCorrBadge(chartId, period, labeled, spxData);
  } else {
    const el = document.getElementById(chartId + '-corr');
    if (el) el.innerHTML = '';
  }

  // Button highlight ?? ???   ? ???
  document.querySelectorAll('[class*="liq-period-btn-"]').forEach(b => {
    // ?????liq-period-btn-ID ?? liq-period-sync-P 2? ??
    const cls = b.className;
    const btnIdMatch = cls.match(/liq-period-btn-(\S+)/);
    const syncMatch = cls.match(/liq-period-sync-(\S+)/);
    if (!btnIdMatch || !syncMatch) return;
    const active = syncMatch[1] === period;
    b.className = 'liq-period-btn-' + btnIdMatch[1] + ' liq-period-sync-' + syncMatch[1] + ' px-2 py-0.5 text-xs rounded ' + (active ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600');
  });

  // Canvas setup (F&G pattern ??no dpr)
  const canvas = document.getElementById(chartId);
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  const H = parseInt(canvas.getAttribute('height')) || 280;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const isMulti = cfg.keys && cfg.keys.length > 1;
  const pad = { top: 15, right: cfg.spxOverlay ? 55 : (isMulti ? 65 : 10), bottom: 25, left: 55 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  // Build unified date range ??????? X??
  // SPX????? ?? ??
  let allDates = new Set();
  filtered.forEach(s => s.data.forEach(d => allDates.add(d.date)));
  const dates = [...allDates].sort();
  if (dates.length < 2) return;

  const firstDate = new Date(dates[0]).getTime();
  const lastDate = new Date(dates[dates.length - 1]).getTime();
  const totalMs = lastDate - firstDate || 1;
  const dateToX = d => pad.left + ((new Date(d).getTime() - firstDate) / totalMs) * cw;

  // Clear
  ctx.clearRect(0, 0, W, H);

  // NBER  ? (????)
  drawRecessionShading(ctx, pad, ch, cw, firstDate, lastDate, dateToX);

  // Draw each series (left Y axis)
  // For multi-series, use independent scaling per series
  if (filtered.length === 1) {
    // Single series ??fill area
    const data = filtered[0].data;
    const vals = data.map(d => d.value);
    let mn = Math.min(...vals), mx = Math.max(...vals);
    if (logMode) {
      //  ???? ???
      const positive = vals.filter(v => v > 0);
      if (positive.length < 2) { /* fallback to linear */ }
      else { mn = Math.min(...positive); mx = Math.max(...positive); }
    }
    const range = mx - mn || 1;
    const logMn = logMode && mn > 0 ? Math.log10(mn) : 0;
    const logMx = logMode && mx > 0 ? Math.log10(mx) : 0;
    const logRange = logMx - logMn || 1;
    const valToY = v => {
      if (logMode && v > 0) {
        return pad.top + ch * (1 - (Math.log10(v) - logMn) / logRange);
      }
      return pad.top + ch * (1 - (v - mn) / range);
    };

    // Area fill
    ctx.beginPath();
    data.forEach((d, i) => {
      const x = dateToX(d.date), y = valToY(d.value);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.lineTo(dateToX(data[data.length-1].date), pad.top + ch);
    ctx.lineTo(dateToX(data[0].date), pad.top + ch);
    ctx.closePath();
    ctx.fillStyle = cfg.colors[0].replace(')', ',0.08)').replace('rgb', 'rgba').replace('#', '');
    // Hex to rgba fill
    const hexToRgba = (hex, a) => {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return 'rgba('+r+','+g+','+b+','+a+')';
    };
    ctx.fillStyle = hexToRgba(cfg.colors[0], 0.08);
    ctx.fill();

    // ???(thresholds)
    if (cfg.thresholds && Array.isArray(cfg.thresholds)) {
      const thColors = ['#ef4444', '#f59e0b', '#22c55e'];
      // ?????? = ????      cfg.
      thresholds.forEach((th, ti) => {
        if (th >= mn && th <= mx) {
          const y = valToY(th);
          ctx.strokeStyle = thColors[ti] || '#fbbf24';
          ctx.lineWidth = 1;
          ctx.setLineDash([6, 3]);
          ctx.beginPath();
          ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
          ctx.setLineDash([]);
          // ?
          ctx.fillStyle = thColors[ti] || '#fbbf24';
          ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
          const lbl = cfg.thresholdLabels?.[ti] || '';
          if (lbl) ctx.fillText(lbl, pad.left + 5, y - 3);
        }
      });
    }

    // Line
    ctx.beginPath();
    data.forEach((d, i) => {
      const x = dateToX(d.date), y = valToY(d.value);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = cfg.colors[0];
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Y axis labels
    ctx.fillStyle = cfg.colors[0]; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    const ySteps = 5;
    for (let i = 0; i <= ySteps; i++) {
      let v;
      if (logMode && mn > 0) {
        v = Math.pow(10, logMn + logRange * i / ySteps);
      } else {
        v = mn + range * i / ySteps;
      }
      const y = valToY(v);
      let label;
      if (cfg.fmt) label = cfg.fmt(v);
      else if (Math.abs(v) < 10) label = v.toFixed(2);
      else if (Math.abs(v) < 1000) label = v.toFixed(1);
      else label = (v/1e3).toFixed(1) + 'K';
      ctx.fillText(label, pad.left - 5, y + 3);
      ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    }
  } else {
    // Multi-series processing
    const isUnified = !!cfg.unifiedUnit;
    const isDual = !!cfg.dualAxis;

    if (isUnified) {
      //  ?? ? ? ??? Y?
      const allVals = [].concat(...filtered.map(s => s.data.map(d => d.value)));
      let mn = Math.min(...allVals), mx = Math.max(...allVals);
      if (logMode) {
        const pos = allVals.filter(v => v > 0);
        if (pos.length >= 2) { mn = Math.min(...pos); mx = Math.max(...pos); }
      }
      const range = mx - mn || 1;
      const logMn = logMode && mn > 0 ? Math.log10(mn) : 0;
      const logMx = logMode && mx > 0 ? Math.log10(mx) : 0;
      const logRange = logMx - logMn || 1;
      const valToY = v => {
        if (logMode && v > 0) return pad.top + ch * (1 - (Math.log10(v) - logMn) / logRange);
        return pad.top + ch * (1 - (v - mn) / range);
      };

      // Y?? + ??
      ctx.fillStyle = '#d1d5db'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
      for (let i = 0; i <= 5; i++) {
        let v;
        if (logMode && mn > 0) v = Math.pow(10, logMn + logRange * i / 5);
        else v = mn + range * i / 5;
        const y = valToY(v);
        ctx.fillText((cfg.fmt ? cfg.fmt(v) : v.toFixed(2)), pad.left - 5, y + 3);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
      }
      // 0??
      if (mn < 0 && mx > 0) {
        const y0 = valToY(0);
        ctx.strokeStyle = '#ffffff44'; ctx.lineWidth = 1;
        ctx.setLineDash([4,4]); ctx.beginPath();
        ctx.moveTo(pad.left, y0); ctx.lineTo(W - pad.right, y0); ctx.stroke();
        ctx.setLineDash([]);
      }
      // ? ?
      filtered.forEach((s, si) => {
        if (s.data.length < 2) return;
        ctx.beginPath();
        s.data.forEach((d, i) => {
          const x = dateToX(d.date), y = valToY(d.value);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = cfg.colors[si] || '#999'; ctx.lineWidth = 1.3; ctx.stroke();
      });
    } else if (isDual && filtered.length === 2) {
      // ????Y? ?????? ? ??????
      const left = filtered[0], right = filtered[1];
      const leftVals = left.data.map(d => d.value);
      const rightVals = right.data.map(d => d.value);
      const lMn = Math.min(...leftVals), lMx = Math.max(...leftVals);
      const rMn = Math.min(...rightVals), rMx = Math.max(...rightVals);
      const lRange = lMx - lMn || 1, rRange = rMx - rMn || 1;
      const leftY = v => pad.top + ch * (1 - (v - lMn) / lRange);
      const rightY = v => pad.top + ch * (1 - (v - rMn) / rRange);

      // ?Y??
      ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
      ctx.fillStyle = cfg.colors[0];
      for (let i = 0; i <= 5; i++) {
        const v = lMn + lRange * i / 5;
        const y = leftY(v);
        const fmt = cfg.fmts ? cfg.fmts[0] : v => v.toFixed(1);
        ctx.fillText(fmt(v), pad.left - 5, y + 3);
        ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
      }
      // ??Y??
      ctx.fillStyle = cfg.colors[1]; ctx.textAlign = 'left';
      for (let i = 0; i <= 5; i++) {
        const v = rMn + rRange * i / 5;
        const y = rightY(v);
        const fmt = cfg.fmts ? cfg.fmts[1] : v => v.toFixed(1);
        ctx.fillText(fmt(v), W - pad.right + 3, y + 3);
      }
      // ?
      [{data: left.data, y: leftY, color: cfg.colors[0]}, {data: right.data, y: rightY, color: cfg.colors[1]}].forEach(s => {
        if (s.data.length < 2) return;
        ctx.beginPath();
        s.data.forEach((d, i) => {
          const x = dateToX(d.date), y = s.y(d.value);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.3; ctx.stroke();
      });
    } else {
      // 3?? ?? ? ? ????????(0~1), ?????
      // ?Y? ????
      const first = filtered[0];
      const fVals = first.data.map(d => d.value);
      const fMn = Math.min(...fVals), fMx = Math.max(...fVals);
      const fRange = fMx - fMn || 1;
      ctx.fillStyle = cfg.colors[0]; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
      for (let i = 0; i <= 5; i++) {
        const v = fMn + fRange * i / 5;
        const y = pad.top + ch * (1 - i / 5);
        const fmt = (cfg.fmts ? cfg.fmts[0] : (v) => v.toFixed(2));

        ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
      }

      // ?? ? ?????
      filtered.forEach((s, si) => {
        if (s.data.length < 2) return;
        const vs = s.data.map(d => d.value);
        const mn = Math.min(...vs), mx = Math.max(...vs);
        const range = mx - mn || 1;
        ctx.beginPath();
        s.data.forEach((d, i) => {
          const x = dateToX(d.date);
          const y = pad.top + ch * (1 - (d.value - mn) / range);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = cfg.colors[si] || '#999'; ctx.lineWidth = 1.3; ctx.stroke();

        // ?????????
        const last = s.data[s.data.length - 1];
        if (last) {
          const y = pad.top + ch * (1 - (last.value - mn) / range);
          ctx.fillStyle = cfg.colors[si];
          ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
          const fmt = cfg.fmts ? cfg.fmts[si] : (v) => v.toFixed(2);
          ctx.fillText(fmt(last.value), W - pad.right + 3, y + 3);
        }

  // SPX overlay (right Y axis) ?? ?? log ?SPX??log ???????
  if (spxData.length > 2) {
    const spxVals = spxData.map(d => d.value).filter(v => v > 0);
    const spxMn = Math.min(...spxVals), spxMx = Math.max(...spxVals);
    const spxRange = spxMx - spxMn || 1;
    const spxLogMn = logMode ? Math.log10(spxMn) : 0;
    const spxLogMx = logMode ? Math.log10(spxMx) : 0;
    const spxLogRange = spxLogMx - spxLogMn || 1;
    const spxToY = v => {
      if (logMode && v > 0) return pad.top + ch * (1 - (Math.log10(v) - spxLogMn) / spxLogRange);
      return pad.top + ch * (1 - (v - spxMn) / spxRange);
    };

    ctx.beginPath();
    spxData.forEach((d, i) => {
      const x = dateToX(d.date), y = spxToY(d.value);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);

    ctx.lineWidth = 1;
    ctx.stroke();

    // Right Y axis
    ctx.fillStyle = '#fbbf24'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
    for (let i = 0; i <= 4; i++) {
      let v;
      if (logMode) v = Math.pow(10, spxLogMn + spxLogRange * i / 4);
      else v = spxMn + spxRange * i / 4;
      ctx.fillText(Math.round(v).toLocaleString(), W - pad.right + 3, spxToY(v) + 3);
    }
    // SPX label
    ctx.save();
    ctx.translate(W - 3, pad.top + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(251,191,36,0.5)'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';

    ctx.restore();
  }

  // X axis dates
  ctx.fillStyle = '#6b7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  const spanDays = totalMs / 86400000;
  const xLabels = [];
  if (spanDays > 1500) {
    let ly = '';
    dates.forEach(d => { const yr = d.slice(0,4); if (yr !== ly) { xLabels.push({x: dateToX(d), label: yr}); ly = yr; }});
  } else {
    let lm = '';
    dates.forEach(d => { const m = d.slice(0,7); if (m !== lm && parseInt(d.slice(5,7)) % 3 === 1) { xLabels.push({x: dateToX(d), label: m.slice(2)}); lm = m; }});
  }
  xLabels.forEach(l => ctx.fillText(l.label, l.x, H - 5));

  // Legend
  const legendY = pad.top + 3;
  let legendX = pad.left + 5;
  const allLabels = [...cfg.labels];
  const allColors = [...cfg.colors];
  if (cfg.spxOverlay && spxData.length > 0) {
    allLabels.push('S&P 500');
    allColors.push('#fbbf24');
  }
  ctx.font = '9px sans-serif';
  allLabels.forEach((label, i) => {
    ctx.fillStyle = allColors[i]; ctx.fillRect(legendX, legendY, 12, 2);
    ctx.fillStyle = '#e5e7eb'; ctx.textAlign = 'left';
    ctx.fillText(label, legendX + 15, legendY + 4);
    legendX += ctx.measureText(label).width + 25;
  });

  // Save image for hover
  canvas._chartImage = ctx.getImageData(0, 0, W, H);

  // Hover tooltip
  let tooltipEl = document.getElementById(chartId + 'Tooltip');
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.id = chartId + 'Tooltip';
    tooltipEl.className = 'fixed bg-gray-900/95 border border-gray-600 text-[10px] text-white px-2 py-1.5 rounded pointer-events-none z-50 hidden leading-relaxed';
    document.body.appendChild(tooltipEl);
  }

  if (canvas._liqMove) canvas.removeEventListener('mousemove', canvas._liqMove);
  if (canvas._liqLeave) canvas.removeEventListener('mouseleave', canvas._liqLeave);

  canvas._liqMove = (ev) => {
    const br = canvas.getBoundingClientRect();
    const mx = ev.clientX - br.left;
    if (mx < pad.left || mx > W - pad.right) { tooltipEl.classList.add('hidden'); return; }
    // Find closest date
    const ratio = (mx - pad.left) / cw;
    const targetMs = firstDate + ratio * totalMs;
    let closestDate = dates[0], minDist = Infinity;
    for (const d of dates) {
      const dist = Math.abs(new Date(d).getTime() - targetMs);
      if (dist < minDist) { minDist = dist; closestDate = d; }
    }

    ctx.putImageData(canvas._chartImage, 0, 0);
    const cx = dateToX(closestDate);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, pad.top); ctx.lineTo(cx, pad.top + ch); ctx.stroke();

    let tip = '<b>' + closestDate + '</b>';
    filtered.forEach((s, si) => {
      const pt = s.data.find(d => d.date === closestDate) || s.data.reduce((prev, curr) => Math.abs(new Date(curr.date).getTime() - new Date(closestDate).getTime()) < Math.abs(new Date(prev.date).getTime() - new Date(closestDate).getTime()) ? curr : prev);
      if (pt) {
        tip += '<br><span style="color:' + (cfg.colors[si]||'#999') + '">' + cfg.labels[si] + ':</span> ' + pt.value.toLocaleString();
      }
    });
    if (cfg.spxOverlay && spxData.length > 0) {
      const sp = spxData.reduce((prev, curr) => Math.abs(new Date(curr.date).getTime() - new Date(closestDate).getTime()) < Math.abs(new Date(prev.date).getTime() - new Date(closestDate).getTime()) ? curr : prev);
      if (sp) tip += '<br><span style="color:#fbbf24">SPX:</span> ' + Math.round(sp.value).toLocaleString();
    }
    tooltipEl.innerHTML = tip;
    tooltipEl.classList.remove('hidden');
    tooltipEl.style.left = (ev.clientX + 15 + 180 > window.innerWidth ? ev.clientX - 190 : ev.clientX + 15) + 'px';
    tooltipEl.style.top = Math.max(5, ev.clientY - 50) + 'px';
  };
  canvas._liqLeave = () => {
    tooltipEl.classList.add('hidden');
    if (canvas._chartImage) ctx.putImageData(canvas._chartImage, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._liqMove);
  canvas.addEventListener('mouseleave', canvas._liqLeave);
}

      const y = valToY(v);
      ctx.fillText(cfg.fmt ? cfg.fmt(v) : v.toFixed(2), pad.left - 5, y + 3);
      ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    }

    // 0% ?? (? ??
    if (pad_mn < 0 && pad_mx > 0) {
      const y0 = valToY(0);
      ctx.strokeStyle = '#ef4444aa'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6,3]); ctx.beginPath();
      ctx.moveTo(pad.left, y0); ctx.lineTo(W - pad.right, y0); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ef4444'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('0% (? )', pad.left + 5, y0 - 3);
    }
    // 100% ???(??GDP )
    if (chartId === 'repDebtGdpChart' && pad_mn < 100 && pad_mx > 100) {
      const y100 = valToY(100);
      ctx.strokeStyle = '#ef4444aa'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6,3]); ctx.beginPath();
      ctx.moveTo(pad.left, y100); ctx.lineTo(W - pad.right, y100); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ef4444'; ctx.font = 'bold 9px sans-serif';
      ctx.fillText('100% (?)', pad.left + 5, y100 - 3);
    }
    // 25% ???(Fed BS/GDP)
    if (chartId === 'repFedBsGdpChart' && pad_mn < 25 && pad_mx > 25) {
      const y25 = valToY(25);
      ctx.strokeStyle = '#ef4444aa'; ctx.lineWidth = 1.5;
      ctx.setLineDash([6,3]); ctx.beginPath();
      ctx.moveTo(pad.left, y25); ctx.lineTo(W - pad.right, y25); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ef4444'; ctx.font = 'bold 9px sans-serif';
      ctx.fillText('25% (?)', pad.left + 5, y25 - 3);
    }

    // ? (0 ? = ? )
    if (pad_mn < 0 && pad_mx > 0 && cfg.unifiedUnit === '%') {
      const y0 = valToY(0);
      ctx.fillStyle = 'rgba(239,68,68,0.05)';
      ctx.fillRect(pad.left, y0, cw, (pad.top + ch) - y0);
    }

    // ?
    filtered.forEach((s, si) => {
      if (s.data.length < 2) return;
      ctx.beginPath();
      s.data.forEach((d, i) => {
        const x = dateToX(d.date), y = valToY(d.value);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = cfg.colors[si] || '#999';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }

  // X?
  ctx.fillStyle = '#6b7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  const spanDays = totalMs / 86400000;
  if (spanDays > 1500) {
    let ly = '';
    dates.forEach(d => { const yr = d.slice(0,4); if (yr !== ly && parseInt(yr) % 5 === 0) { ctx.fillText(yr, dateToX(d), H - 5); ly = yr; }});
  } else {
    let lm = '';
    dates.forEach(d => { const m = d.slice(0,7); if (m !== lm && parseInt(d.slice(5,7)) % 6 === 1) { ctx.fillText(m.slice(2), dateToX(d), H - 5); lm = m; }});
  }

  // Legend
  ctx.font = '9px sans-serif';
  let legendX = pad.left + 5;
  cfg.labels.forEach((label, i) => {
    ctx.fillStyle = cfg.colors[i]; ctx.fillRect(legendX, pad.top + 3, 12, 2);
    ctx.fillStyle = '#9ca3af'; ctx.textAlign = 'left';
    ctx.fillText(label, legendX + 15, pad.top + 7);
    legendX += ctx.measureText(label).width + 25;
  });

  // ? ?
  canvas._chartImage = ctx.getImageData(0, 0, W, H);
  let tooltipEl = document.getElementById(chartId + 'Tooltip');
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.id = chartId + 'Tooltip';
    tooltipEl.className = 'fixed bg-gray-900/95 border border-gray-600 text-[10px] text-white px-2 py-1.5 rounded pointer-events-none z-50 hidden leading-relaxed';
    document.body.appendChild(tooltipEl);
  }
  if (canvas._repMove) canvas.removeEventListener('mousemove', canvas._repMove);
  if (canvas._repLeave) canvas.removeEventListener('mouseleave', canvas._repLeave);
  canvas._repMove = (ev) => {
    const br = canvas.getBoundingClientRect();
    const mx = ev.clientX - br.left;
    if (mx < pad.left || mx > W - pad.right) { tooltipEl.classList.add('hidden'); return; }
    const ratio = (mx - pad.left) / cw;
    const targetMs = firstDate + ratio * totalMs;
    let closestDate = dates[0], minDist = Infinity;
    for (const d of dates) {
      const dist = Math.abs(new Date(d).getTime() - targetMs);
      if (dist < minDist) { minDist = dist; closestDate = d; }
    }
    ctx.putImageData(canvas._chartImage, 0, 0);
    const cx = dateToX(closestDate);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, pad.top); ctx.lineTo(cx, pad.top + ch); ctx.stroke();

    let tip = '<b>' + closestDate + '</b>';
    filtered.forEach((s, si) => {
      const pt = s.data.find(d => d.date === closestDate) || s.data.reduce((prev, curr) => Math.abs(new Date(curr.date).getTime() - new Date(closestDate).getTime()) < Math.abs(new Date(prev.date).getTime() - new Date(closestDate).getTime()) ? curr : prev);
      if (pt) tip += '<br><span style="color:' + cfg.colors[si] + '">' + cfg.labels[si] + ':</span> ' + (cfg.fmt ? cfg.fmt(pt.value) : pt.value.toFixed(2));
    });
    tooltipEl.innerHTML = tip;
    tooltipEl.classList.remove('hidden');
    tooltipEl.style.left = (ev.clientX + 15 + 200 > window.innerWidth ? ev.clientX - 210 : ev.clientX + 15) + 'px';
    tooltipEl.style.top = Math.max(5, ev.clientY - 50) + 'px';
  };
  canvas._repLeave = () => {
    tooltipEl.classList.add('hidden');
    if (canvas._chartImage) ctx.putImageData(canvas._chartImage, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._repMove);
  canvas.addEventListener('mouseleave', canvas._repLeave);
}

function drawValuationCharts(data, only) {
  const history = data.history || [];
  if (!history.length) return;

  const periods = window._valPeriods || { pe: '3Y', beat: '3Y', growth: '3Y' };

  function filterByPeriod(hist, period) {
    if (period === 'ALL') return hist;
    const now = new Date();
    const years = { '1Y': 1, '3Y': 3, '5Y': 5 }[period] || 3;
    const cutoff = new Date(now);
    cutoff.setFullYear(cutoff.getFullYear() - years);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    return hist.filter(e => e.isoDate >= cutoffStr);
  }

  if (!only || only === 'pe') {
    const h = filterByPeriod(history, periods.pe);
    drawValLineChart('valPeChart', 'valPeTooltip', h,
      [
        { key: 'forwardPE', label: 'Forward P/E', color: '#60a5fa', lineWidth: 2 },
        { key: 'avg5Y',     label: '5Y ?',      color: '#f59e0b', lineWidth: 1, dash: [5,4] },
        { key: 'avg10Y',    label: '10Y ?',      color: '#f87171', lineWidth: 1, dash: [5,4] },
      ],
      { yLabel: 'P/E (x)', suffix: 'x', decimals: 1 }
    );
  }

  if (!only || only === 'growth') {
    const h = filterByPeriod(history, periods.growth);
    drawValBarChart('valGrowthChart', 'valGrowthTooltip', h,
      { yLabel: 'EPS Growth %', suffix: '%', decimals: 1 }
    );
  }
}

function drawValLineChart(canvasId, tooltipId, data, series, opts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const parent = canvas.parentElement;
  const W = parent.clientWidth || parent.offsetWidth || 600;
  const H = parent.clientHeight || parent.offsetHeight || 380;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const PAD = { top: 18, right: 14, bottom: 34, left: 48 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;

  ctx.clearRect(0, 0, W, H);

  if (!data.length) {
    ctx.fillStyle = '#6b7280';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('데이터 없음', W / 2, H / 2);
    return;
  }

  const suffix = opts.suffix || '';
  const dec = opts.decimals != null ? opts.decimals : 2;

  // Compute data range
  let yMin = Infinity, yMax = -Infinity;
  for (const s of series) {
    if (s.constVal != null) { yMin = Math.min(yMin, s.constVal); yMax = Math.max(yMax, s.constVal); continue; }
    for (const d of data) {
      const v = d[s.key];
      if (v != null) { yMin = Math.min(yMin, v); yMax = Math.max(yMax, v); }
    }
  }
  if (opts.yMin != null) yMin = Math.min(yMin, opts.yMin);
  if (opts.yMax != null) yMax = Math.max(yMax, opts.yMax);
  const pad = (yMax - yMin) * 0.1 || 1;
  yMin -= pad; yMax += pad;

  const xScale = (i) => PAD.left + (i / Math.max(data.length - 1, 1)) * cW;
  const yScale = (v) => PAD.top + (1 - (v - yMin) / (yMax - yMin)) * cH;

  // Grid
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = PAD.top + (g / 4) * cH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
    const v = yMax - (g / 4) * (yMax - yMin);
    ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(v.toFixed(dec) + suffix, PAD.left - 4, y + 3);
  }

  // X axis labels
  ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(data.length / 6));
  for (let i = 0; i < data.length; i += step) {
    ctx.fillText(data[i].isoDate.slice(0, 7), xScale(i), H - PAD.bottom + 14);
  }

  // Draw series
  for (const s of series) {
    ctx.save();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.lineWidth || 1.5;
    if (s.dash) ctx.setLineDash(s.dash); else ctx.setLineDash([]);
    ctx.beginPath();
    if (s.constVal != null) {
      ctx.moveTo(PAD.left, yScale(s.constVal));
      ctx.lineTo(PAD.left + cW, yScale(s.constVal));
    } else {
      let first = true;
      for (let i = 0; i < data.length; i++) {
        const v = data[i][s.key];
        if (v == null) { first = true; continue; }
        if (first) { ctx.moveTo(xScale(i), yScale(v)); first = false; }
        else ctx.lineTo(xScale(i), yScale(v));
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // Save image for tooltip restore
  canvas._chartImg = ctx.getImageData(0, 0, W * dpr, H * dpr);

  // Tooltip
  const tooltipEl = document.getElementById(tooltipId);
  if (canvas._valMove) canvas.removeEventListener('mousemove', canvas._valMove);
  if (canvas._valLeave) canvas.removeEventListener('mouseleave', canvas._valLeave);

  canvas._valMove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    if (mx < PAD.left || mx > PAD.left + cW) { tooltipEl.style.display = 'none'; if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0); return; }
    const idx = Math.round(((mx - PAD.left) / cW) * (data.length - 1));
    const d = data[Math.max(0, Math.min(data.length - 1, idx))];
    if (!d) return;

    if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0);
    const cx = xScale(idx);
    ctx.save();
    ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, PAD.top); ctx.lineTo(cx, PAD.top + cH); ctx.stroke();
    ctx.restore();

    let html = `<span style="color:#9ca3af">${d.isoDate} (${d.quarter || ''})</span>`;
    for (const s of series) {
      if (s.constVal != null) continue;
      const v = d[s.key];
      if (v == null) continue;
      html += `<br><span style="color:${s.color}">${s.label}: <b>${v.toFixed(dec)}${suffix}</b></span>`;
    }
    tooltipEl.innerHTML = html;
    tooltipEl.style.display = 'block';
    const tx = cx + 10; const ty = PAD.top + 10;
    tooltipEl.style.left = (tx + tooltipEl.offsetWidth > W ? cx - tooltipEl.offsetWidth - 10 : tx) + 'px';
    tooltipEl.style.top = ty + 'px';
  };
  canvas._valLeave = () => {
    tooltipEl.style.display = 'none';
    if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._valMove);
  canvas.addEventListener('mouseleave', canvas._valLeave);
}

function drawValBarChart(canvasId, tooltipId, data, opts) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const parent = canvas.parentElement;
  const W = parent.clientWidth || parent.offsetWidth || 600;
  const H = parent.clientHeight || parent.offsetHeight || 340;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const PAD = { top: 18, right: 14, bottom: 34, left: 52 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top - PAD.bottom;
  ctx.clearRect(0, 0, W, H);

  const suffix = opts.suffix || '';
  const dec = opts.decimals != null ? opts.decimals : 1;

  if (!data.length) {
    ctx.fillStyle = '#6b7280'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('데이터 없음', W / 2, H / 2);
    return;
  }

  const vals = data.map(d => d.earningsGrowth);
  let yMin = Math.min(0, ...vals);
  let yMax = Math.max(0, ...vals);
  const pad = (yMax - yMin) * 0.15 || 2;
  yMin -= pad; yMax += pad;

  const yScale = (v) => PAD.top + (1 - (v - yMin) / (yMax - yMin)) * cH;
  const y0 = yScale(0);
  const barW = Math.max(2, Math.floor(cW / data.length) - 1);

  // Grid
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = PAD.top + (g / 4) * cH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
    const v = yMax - (g / 4) * (yMax - yMin);
    ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(v.toFixed(dec) + suffix, PAD.left - 4, y + 3);
  }

  // Zero line
  ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(PAD.left, y0); ctx.lineTo(PAD.left + cW, y0); ctx.stroke();

  // Bars
  for (let i = 0; i < data.length; i++) {
    const v = data[i].earningsGrowth;
    const x = PAD.left + (i / data.length) * cW + (cW / data.length - barW) / 2;
    const yv = yScale(v);
    const barH = Math.abs(yv - y0);
    ctx.fillStyle = v >= 0 ? '#34d399' : '#f87171';
    ctx.fillRect(x, Math.min(yv, y0), barW, barH || 1);
  }

  // X labels
  ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(data.length / 6));
  for (let i = 0; i < data.length; i += step) {
    const x = PAD.left + (i + 0.5) / data.length * cW;
    ctx.fillText(data[i].isoDate.slice(0, 7), x, H - PAD.bottom + 14);
  }

  // Save
  canvas._chartImg = ctx.getImageData(0, 0, W * dpr, H * dpr);

  // Tooltip
  const tooltipEl = document.getElementById(tooltipId);
  if (canvas._valMove) canvas.removeEventListener('mousemove', canvas._valMove);
  if (canvas._valLeave) canvas.removeEventListener('mouseleave', canvas._valLeave);

  canvas._valMove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    if (mx < PAD.left || mx > PAD.left + cW) { tooltipEl.style.display = 'none'; if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0); return; }
    const idx = Math.floor(((mx - PAD.left) / cW) * data.length);
    const d = data[Math.max(0, Math.min(data.length - 1, idx))];
    if (!d) return;
    if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0);
    const cx = PAD.left + (idx + 0.5) / data.length * cW;
    ctx.save();
    ctx.strokeStyle = '#4b5563'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(cx, PAD.top); ctx.lineTo(cx, PAD.top + cH); ctx.stroke();
    ctx.restore();
    const v = d.earningsGrowth;
    tooltipEl.innerHTML = `<span style="color:#9ca3af">${d.isoDate} (${d.quarter})</span><br><span style="color:${v >= 0 ? '#34d399' : '#f87171'}">EPS 성장률: <b>${v >= 0 ? '+' : ''}${v.toFixed(dec)}${suffix}</b></span>`;
    tooltipEl.style.display = 'block';
    const tx = cx + 10; const ty = PAD.top + 10;
    tooltipEl.style.left = (tx + tooltipEl.offsetWidth > W ? cx - tooltipEl.offsetWidth - 10 : tx) + 'px';
    tooltipEl.style.top = ty + 'px';
  };
  canvas._valLeave = () => {
    tooltipEl.style.display = 'none';
    if (canvas._chartImg) ctx.putImageData(canvas._chartImg, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._valMove);
  canvas.addEventListener('mouseleave', canvas._valLeave);
}
window.drawValBarChart = drawValBarChart;

function startBackfillPolling() {
  clearInterval(_backfillPollTimer);

        const lastFound = p.lastFound ? p.lastFound : '-';
        statusEl.classList.remove('hidden');
        statusEl.innerHTML = `
          <div class="flex items-center gap-3 mb-1">
            <span class="text-blue-400">? ? ? ? ?${pct}%</span>

// ── 색상 헬퍼 ─────────────────────────────────────────────────────────────────
function _fedColor(key, val) {
  if (val === null || val === undefined) return 'text-gray-400';
  const v = Number(val);
  const LOW_GOOD = {   // 낮을수록 좋음
    // 미국
    cpi:      [[2.5,'text-green-400'],[3.5,'text-yellow-400'],[Infinity,'text-red-400']],
    core_cpi: [[2.5,'text-green-400'],[3.5,'text-yellow-400'],[Infinity,'text-red-400']],
    pce:      [[2.3,'text-green-400'],[3.0,'text-yellow-400'],[Infinity,'text-red-400']],
    core_pce: [[2.3,'text-green-400'],[3.0,'text-yellow-400'],[Infinity,'text-red-400']],
    unrate:   [[4.0,'text-green-400'],[5.0,'text-yellow-400'],[Infinity,'text-red-400']],
    icsa:     [[220,'text-green-400'],[280,'text-yellow-400'],[Infinity,'text-red-400']],
    mortgage: [[5.5,'text-green-400'],[7.0,'text-yellow-400'],[Infinity,'text-red-400']],
    // 한국
    kr_cpi:    [[2.5,'text-green-400'],[4.0,'text-yellow-400'],[Infinity,'text-red-400']],
    kr_unrate: [[3.5,'text-green-400'],[5.0,'text-yellow-400'],[Infinity,'text-red-400']],
    // 중국
    cn_cpi:    [[2.5,'text-green-400'],[4.0,'text-yellow-400'],[Infinity,'text-red-400']],
  };
  const HIGH_GOOD = {  // 높을수록 좋음
    // 미국
    payems:   [[200,'text-green-400'],[100,'text-yellow-400'],[0,'text-orange-400'],[[-Infinity],'text-red-400']],
    gdp:      [[2.0,'text-green-400'],[0.5,'text-yellow-400'],[[-Infinity],'text-red-400']],
    cfnai:    [[0.5,'text-green-400'],[0,'text-yellow-400'],[-0.7,'text-orange-400'],[[-Infinity],'text-red-400']],
    retail:   [[3.0,'text-green-400'],[1.0,'text-yellow-400'],[0,'text-orange-400'],[[-Infinity],'text-red-400']],
    sentiment:[[80,'text-green-400'],[70,'text-yellow-400'],[60,'text-orange-400'],[[-Infinity],'text-red-400']],
    housing:  [[1400,'text-green-400'],[1200,'text-yellow-400'],[[-Infinity],'text-orange-400']],
    // 한국
    kr_ip:     [[3.0,'text-green-400'],[0,'text-yellow-400'],[[-Infinity],'text-red-400']],
    kr_export: [[5.0,'text-green-400'],[0,'text-yellow-400'],[[-Infinity],'text-red-400']],
    kr_gdp:    [[2.0,'text-green-400'],[0.5,'text-yellow-400'],[[-Infinity],'text-red-400']],
    kr_retail: [[3.0,'text-green-400'],[0,'text-yellow-400'],[[-Infinity],'text-red-400']],
    // 중국
    cn_export: [[5.0,'text-green-400'],[0,'text-yellow-400'],[[-Infinity],'text-red-400']],
    cn_import: [[3.0,'text-green-400'],[0,'text-yellow-400'],[[-Infinity],'text-red-400']],
  };
  if (LOW_GOOD[key]) {
    for (const [thr, cls] of LOW_GOOD[key]) { if (v <= thr) return cls; }
    return 'text-red-400';
  }
  if (HIGH_GOOD[key]) {
    const rows = HIGH_GOOD[key];
    for (const [thr, cls] of rows) { if (thr === -Infinity || thr === Infinity) return cls; if (v >= thr) return cls; }
    return 'text-red-400';
  }
  return 'text-white';
}

// ── 스파크라인 SVG ────────────────────────────────────────────────────────────
function _makeSpark(history, w = 100, h = 28) {
  if (!history || history.length < 3) return '';
  const vals = history.map(d => d.value).filter(v => v !== null && !isNaN(v));
  if (vals.length < 3) return '';
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const PAD = 2;
  const pts = vals.map((v, i) => {
    const x = PAD + (i / (vals.length - 1)) * (w - 2 * PAD);
    const y = PAD + (1 - (v - min) / range) * (h - 2 * PAD);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = vals[vals.length - 1], first = vals[0];
  const stroke = last >= first ? '#34d399' : '#f87171';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="block opacity-70">` +
    `<polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>` +
    `</svg>`;
}

// ── 변화량 배지 ───────────────────────────────────────────────────────────────
function _changeBadge(key, current, prior) {
  if (!prior || prior.value === null || !current || current.value === null) return '';
  const diff = current.value - prior.value;
  const sign = diff > 0 ? '+' : '';
  const absDiff = Math.abs(diff);
  const fmt = absDiff < 0.1 ? diff.toFixed(2) : absDiff < 10 ? diff.toFixed(1) : diff.toFixed(0);
  // 방향별 좋음/나쁨 판단
  const LOW_GOOD_KEYS = new Set(['cpi','core_cpi','pce','core_pce','unrate','icsa','mortgage','kr_cpi','kr_unrate','cn_cpi']);
  const isGood = LOW_GOOD_KEYS.has(key) ? diff < 0 : diff > 0;
  const color = diff === 0 ? 'text-gray-400' : (isGood ? 'text-green-400' : 'text-red-400');
  const arrow = diff > 0.005 ? '▲' : diff < -0.005 ? '▼' : '━';
  return `<span class="text-[10px] ${color}">${arrow} ${sign}${fmt}</span>`;
}

// ── 카드 HTML ─────────────────────────────────────────────────────────────────
function _fedCard(key, ind) {
  if (!ind) return `<div class="bg-[#14161f] rounded-xl p-3 flex flex-col gap-1 opacity-40"><div class="text-xs text-gray-500">${key}</div><div class="text-gray-600 text-sm">N/A</div></div>`;
  const val = ind.current?.value;
  const valStr = val === null || val === undefined ? '—' :
    (ind.unit === 'k MoM' ? (val > 0 ? '+' : '') + val.toFixed(0) :
     ind.unit.includes('%') ? val.toFixed(2) :
     ind.unit === 'k' ? val.toFixed(0) :
     ind.unit === 'Index' ? val.toFixed(1) : val.toFixed(1));
  const color = _fedColor(key, val);
  const spark = _makeSpark(ind.history);
  const badge = _changeBadge(key, ind.current, ind.prior);
  const dateStr = ind.current?.date ? ind.current.date.slice(0,7) : '';

  return `<div class="bg-[#0e1117] rounded-xl p-3 flex flex-col gap-0.5 hover:bg-[#141720] transition-colors">
    <div class="flex items-start justify-between">
      <div>
        <div class="text-[11px] text-gray-400 leading-tight">${ind.nameko}</div>
        <div class="text-[10px] text-gray-600">${ind.freq}</div>

    </div>
    <div class="flex items-end gap-2 mt-1">
      <span class="text-[22px] font-bold leading-none ${color}">${valStr}</span>
      <span class="text-[11px] text-gray-500 mb-0.5">${ind.unit}</span>
    </div>
    <div class="flex items-center gap-2">
      ${badge}
      <span class="text-[10px] text-gray-600">vs 전기</span>
    </div>
    <div class="mt-1">${spark}</div>
    <div class="text-[10px] text-gray-600 mt-0.5 leading-tight">${ind.desc}</div>
  </div>`;
}

async function runBacktest() {
  const sym = document.getElementById('btSymbol').value;
  const per = document.getElementById('btPeriod').value;
  const thr = parseFloat(document.getElementById('btThreshold').value);
  _btState = { symbol: sym, period: per, threshold: thr };

  const status = document.getElementById('btStatus');
  status.innerHTML = '⏳ 분석 중... (3~5초)';
  document.getElementById('btResults').innerHTML = `<div class="card p-6 text-center text-gray-500"><div class="spinner mx-auto mb-3"></div>${sym} 데이터 로드 중...</div>`;

  try {
    const r = await fetch(`${API}/backtest?symbol=${encodeURIComponent(sym)}&period=${per}&threshold=${thr}`, { signal: AbortSignal.timeout(60000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    renderBacktestResults(data);
    status.innerHTML = `✅ 완료 (${data.meta.startDate} ~ ${data.meta.endDate}, ${data.meta.days}일, ${data.meta.years.toFixed(1)}년)`;
  } catch (e) {
    status.innerHTML = '<span class="text-red-400">❌ 실패: ' + (e.message || e) + '</span>';
    document.getElementById('btResults').innerHTML = `<div class="card p-6 text-red-400 text-sm">${e.message || e}</div>`;
  }
}
window.runBacktest = runBacktest;

function _btFmt(n, dec = 2) { return n.toFixed(dec); }
function _btCls(v, good, bad) { if (v == null) return ''; if (good(v)) return 'text-green-400 font-bold'; if (bad(v)) return 'text-red-400 font-bold'; return 'text-gray-300'; }

function renderBacktestResults(data) {
  const { meta, avoid, dip, recovery, equityChart, yearCount } = data;
