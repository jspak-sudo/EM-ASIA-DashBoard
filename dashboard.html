let _avgCapsLoadId = 0;
let _avgCapsAbort = null;

async function loadAvgCaps(codes) {
  // 이전 진행 중 fetch 즉시 중단
  if (_avgCapsAbort) { _avgCapsAbort.abort(); _avgCapsAbort = null; }
  const myId = ++_avgCapsLoadId;

  const missing = codes.filter(c => !Object.prototype.hasOwnProperty.call(_naverAvgCapsData, c));
  if (!missing.length) return;

  const CHUNK = 30;  // 서버 max(30)에 맞춤 — API 호출 횟수 1/3로 감소
  for (let i = 0; i < missing.length; i += CHUNK) {
    if (myId !== _avgCapsLoadId) return;  // 탭 전환 감지
    const chunk = missing.slice(i, i + CHUNK);
    const ac = new AbortController();
    _avgCapsAbort = ac;
    try {
      const r = await fetch(`${API}/funds/naver/avgcaps?codes=${chunk.join(',')}`, {
        signal: AbortSignal.any([ac.signal, AbortSignal.timeout(60000)])
      });
      if (!r.ok) continue;
      const data = await r.json();
      if (myId !== _avgCapsLoadId) return;  // fetch 완료 후에도 재확인
      for (const [code, info] of Object.entries(data)) {
        _naverAvgCapsData[code] = info;
        const el = document.getElementById('avgcap_' + code);
        if (el) fillAvgCapCell(el, info, el.dataset.catkey || '');
      }
    } catch { /* abort or network error — chunk 무시 */ }
  }
  _avgCapsAbort = null;
}

let _fundSuggestTimer = null;
let _fundSuggestAbort = null;
let _fundSuggestItems = [];
let _fundSuggestActive = -1;

function onFundInputChange(e) {
  const q = (e.target.value || '').trim();
  if (_fundSuggestTimer) clearTimeout(_fundSuggestTimer);
  if (q.length < 2) { hideFundSuggestions(); return; }
  _fundSuggestTimer = setTimeout(() => fetchFundSuggestions(q), 250);
}

async function fetchFundSuggestions(q) {
  try {
    if (_fundSuggestAbort) _fundSuggestAbort.abort();
    _fundSuggestAbort = new AbortController();
    const typeFilter = document.getElementById('fundTypeFilter').value;
    const r = await fetch(API + '/funds/search?q=' + encodeURIComponent(q) + '&type=' + typeFilter + '&limit=8', { signal: _fundSuggestAbort.signal });
    if (!r.ok) return;
    const data = await r.json();
    renderFundSuggestions(data.results || []);
  } catch (err) {
    if (err.name !== 'AbortError') console.error('Suggest error:', err);
  }
}

function renderFundSuggestions(items) {
  _fundSuggestItems = items;
  _fundSuggestActive = -1;
  const box = document.getElementById('fundSuggestBox');
  if (!box) return;
  if (!items.length) { hideFundSuggestions(); return; }

  const regionColors = { US: 'text-red-400', KR: 'text-sky-400', EU: 'text-purple-400', JP: 'text-pink-400', HK: 'text-orange-400', CN: 'text-yellow-400', UK: 'text-indigo-400' };
  const naverTabNames = { '1': '국내', '2': '해외', '3': '채권', '4': '원자재', '5': '파생', '6': '테마', '7': '기타' };

  box.innerHTML = items.map((r, i) => {
    if (r.source === 'naver') {
      // Korean ETF row
      const chg = r.changeRate != null ? parseFloat(r.changeRate) : null;
      const chgStr = chg != null ? (chg >= 0 ? '+' + chg.toFixed(2) + '%' : chg.toFixed(2) + '%') : '';
      const chgColor = chg != null ? (chg > 0 ? 'text-red-400' : chg < 0 ? 'text-blue-400' : 'text-gray-400') : 'text-gray-400';
      const catLabel = naverTabNames[r.etfTabCode] || '?';
      const mktSum = r.marketSum ? (r.marketSum >= 1e8 ? (r.marketSum / 1e8).toFixed(0) + '억' : r.marketSum.toLocaleString()) : '-';
      return '<div class="fund-suggest-item px-3 py-2 cursor-pointer hover:bg-gray-800/70 border-b border-gray-800 last:border-b-0 flex items-center gap-2 text-xs" data-idx="' + i + '" onclick="selectFundSuggestion(' + i + ')">'
        + '<span class="text-emerald-400 font-semibold text-[10px] w-8">ETF</span>'
        + '<span class="text-sky-400 font-semibold text-[10px] w-6">KR</span>'
        + '<span class="font-mono text-gray-300 w-16 truncate">' + (r.ticker || '-') + '</span>'
        + '<span class="text-white flex-1 truncate">' + r.name + '</span>'
        + '<span class="text-gray-500 text-[10px] w-14 text-right">' + catLabel + '</span>'
        + '<span class="' + chgColor + ' text-[10px] w-16 text-right">' + (r.nowVal ? r.nowVal.toLocaleString() + ' ' : '') + chgStr + '</span>'
        + '</div>';
    }
    const typeClass = r.type === 'ETF' ? 'text-green-400' : 'text-blue-400';
    const regionColor = regionColors[r.region] || 'text-gray-400';
    return '<div class="fund-suggest-item px-3 py-2 cursor-pointer hover:bg-gray-800/70 border-b border-gray-800 last:border-b-0 flex items-center gap-2 text-xs" data-idx="' + i + '" onclick="selectFundSuggestion(' + i + ')">'
      + '<span class="' + typeClass + ' font-semibold text-[10px] w-8">' + r.type + '</span>'
      + '<span class="' + regionColor + ' font-semibold text-[10px] w-6">' + (r.region || '-') + '</span>'
      + '<span class="font-mono text-gray-300 w-24 truncate">' + (r.ticker || '-') + '</span>'
      + '<span class="text-white flex-1 truncate">' + r.name + '</span>'
      + '<span class="text-gray-500 text-[10px]">' + (r.exchange || '') + '</span>'
      + '</div>';
  }).join('');
  box.classList.remove('hidden');
}

function hideFundSuggestions() {
  const box = document.getElementById('fundSuggestBox');
  if (box) box.classList.add('hidden');
  _fundSuggestActive = -1;
}

function selectFundSuggestion(i) {
  const item = _fundSuggestItems[i];
  if (!item) return;
  const input = document.getElementById('fundSearchInput');
  input.value = item.source === 'naver' ? item.name : (item.ticker || item.name);
  hideFundSuggestions();
  // ? ?? ??????
  if (item.source === 'naver' && item.ticker) {
    const naverCode = item.ticker.replace(/\.(KS|KQ)$/i, '');
    window.open('https://finance.naver.com/item/main.naver?code=' + naverCode, '_blank');
  } else if (item.detailUrl) {
    window.open(item.detailUrl, '_blank');
  }
  // ??? ?  
  searchFunds();
}

function onFundInputKeydown(e) {
  const box = document.getElementById('fundSuggestBox');
  const visible = box && !box.classList.contains('hidden') && _fundSuggestItems.length > 0;

  if (e.key === 'Enter') {
    if (visible && _fundSuggestActive >= 0) {
      e.preventDefault();
      selectFundSuggestion(_fundSuggestActive);
    } else {
      searchFunds();
    }
    return;
  }
  if (e.key === 'Escape') { hideFundSuggestions(); return; }
  if (!visible) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _fundSuggestActive = Math.min(_fundSuggestActive + 1, _fundSuggestItems.length - 1);
    updateFundSuggestActive();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _fundSuggestActive = Math.max(_fundSuggestActive - 1, -1);
    updateFundSuggestActive();
  }
}

function updateFundSuggestActive() {
  const items = document.querySelectorAll('.fund-suggest-item');
  items.forEach((el, i) => {
    if (i === _fundSuggestActive) el.classList.add('bg-gray-800/70');
    else el.classList.remove('bg-gray-800/70');
  });
  if (_fundSuggestActive >= 0 && items[_fundSuggestActive]) {
    items[_fundSuggestActive].scrollIntoView({ block: 'nearest' });
  }
}

// ── 연준 대차대조표 T자형 도식 + 계정과목 설명 ──────────────────────────────
// targetDate(YYYY-MM-DD) 지정 시 그 시점 기준으로 재구성 (미지정=최신)
function renderFedBalanceSheet(series, targetDate) {
  // 기준일: 지정 없으면 대차대조표(WALCL) 최신일
  const baseDate = targetDate || series.fedbs?.latest?.date || null;
  // 해당 날짜 '이하' 가장 최근 데이터포인트 찾기 (모든 항목을 같은 기준일로 정렬)
  const ptOn = (k) => {
    const arr = series[k]?.data;
    if (!arr || !arr.length) return null;
    if (!baseDate) return arr[arr.length - 1];
    let found = null;
    for (let i = arr.length - 1; i >= 0; i--) { if (arr[i].date <= baseDate) { found = arr[i]; break; } }
    return found || arr[0];
  };
  const v = (k) => { const p = ptOn(k); return p ? p.value : null; };   // 원단위(백만$ 또는 십억$)
  const dOf = (k) => { const p = ptOn(k); return p ? p.date : null; };  // 항목별 실제 기준일
  // 단위 통일: 모두 백만$(M$) 기준으로 환산 → 표시는 조($T = ÷1e6)
  const M = {
    total:    v('fedbs'),                                  // WALCL, 백만$
    reserves: v('reserves'),                               // WRESBAL, 백만$
    currency: v('currency'),                               // WCURCIR, 백만$
    tga:      v('tga'),                                    // WTREGEN, 백만$
    rrp:      v('rrp') != null ? v('rrp') * 1000 : null,   // RRP 십억$ → 백만$ (기준일 정렬)
  };
  if (M.total == null) return '<div class="card p-4 mb-4 text-gray-500 text-sm" id="fedBSpanel">해당 기간 대차대조표 데이터가 없습니다.</div>';

  const known = (M.reserves||0) + (M.currency||0) + (M.tga||0) + (M.rrp||0);
  const other = Math.max(0, M.total - known);              // 기타부채+자본
  const T = (x) => x == null ? '-' : '$' + (x/1e6).toFixed(2) + 'T';
  const pct = (x) => x == null ? 0 : (x / M.total * 100);
  const asOf = dOf('fedbs') || '';
  // 원화 병기 (기준일 시점 환율, FRED DEXKOUS). x는 백만$ 단위
  const fxPt = ptOn('usdkrw');
  const fxRate = fxPt ? fxPt.value : null;
  const fxDate = fxPt ? fxPt.date : '';
  const W = (x) => {
    if (x == null || fxRate == null) return '';
    const krw = x * 1e6 * fxRate;          // 백만$ → 원
    const jo = krw / 1e12;                  // 조원
    if (jo >= 10000) return '₩' + (jo/10000).toFixed(2) + '경';
    if (jo >= 1)     return '₩' + Math.round(jo).toLocaleString() + '조';
    return '₩' + Math.round(krw/1e8).toLocaleString() + '억';
  };
  const Wsub = (x) => W(x) ? ` <span class="text-[9px] text-gray-500 font-normal">${W(x)}</span>` : '';

  // 자산 항목 (연준이 보유) — 국채 / MBS / 기타로 분해
  const aTre = v('treasuries');   // WSHOTSL, 백만$
  const aMbs = v('mbs');          // WSHOMCB, 백만$
  const aOther = Math.max(0, M.total - (aTre||0) - (aMbs||0));  // 프리미엄·대출·스왑·금증서 등
  // 국채 만기·유형별 하위 분해
  const trNB = v('tre_notesbonds'), trBill = v('tre_bills'), trTips = v('tre_tips');
  const trEtc = aTre != null ? Math.max(0, aTre - (trNB||0) - (trBill||0) - (trTips||0)) : null; // 물가보상분 등
  const treSub = [
    { label:'Notes & Bonds', kr:'중장기 명목국채', val:trNB,   fred:'WSHONBNL', date:dOf('tre_notesbonds') },
    { label:'Bills',         kr:'단기국채(≤1년)',  val:trBill, fred:'WSHOBL',    date:dOf('tre_bills') },
    { label:'TIPS',          kr:'물가연동국채',     val:trTips, fred:'WSHONBIIL', date:dOf('tre_tips') },
    { label:'기타',          kr:'물가보상분 등',    val:trEtc,  fred:'',          date:dOf('treasuries') },
  ].filter(x => x.val != null && x.val > 0);
  const pctOf = (x, base) => base ? (x/base*100) : 0;

  const assets = [
    { label:'미국 국채', en:'U.S. Treasuries', fred:'WSHOTSL', date:dOf('treasuries'),
      full:'Securities Held Outright: U.S. Treasury Securities', val:aTre, color:'#0891b2',
      desc:'연준이 보유한 <b>미국 국채</b>. 자산의 대부분. QE로 사들이고 QT로 만기분을 줄임 — 시중 유동성에 직접 영향.',
      sub: treSub },
    { label:'주택저당증권', en:'MBS', fred:'WSHOMCB', date:dOf('mbs'),
      full:'Securities Held Outright: Mortgage-Backed Securities', val:aMbs, color:'#0e7490',
      desc:'<b>모기지담보증권(MBS)</b>. 2008·2020 위기 때 주택시장 지원 위해 매입. QT로 천천히 축소 중.' },
    { label:'기타 자산', en:'Other', fred:'WALCL − 국채 − MBS', date:dOf('fedbs'),
      full:'미상각 프리미엄·대출·레포·통화스왑·금증서 등', val:aOther, color:'#155e75',
      desc:'미상각 프리미엄, 대출(할인창구·유동성지원), 레포, 중앙은행 통화스왑, 금증서·SDR 등 나머지.' },
  ].filter(x => x.val != null && x.val > 0);
  // 부채 항목 (연준이 갚을 돈, 큰 순서)
  const liab = [
    { label:'지급준비금', en:'Bank Reserves', fred:'WRESBAL', date:dOf('reserves'),
      full:'Reserve Balances with Federal Reserve Banks', val:M.reserves, color:'#ec4899',
      desc:'시중은행이 연준에 맡긴 돈. <b>시장 유동성의 핵심</b> — 많을수록 은행이 굴릴 돈이 풍부(완화적). QT로 감소, QE로 증가.' },
    { label:'유통 화폐', en:'Currency', fred:'WCURCIR', date:dOf('currency'),
      full:'Currency in Circulation', val:M.currency, color:'#22c55e',
      desc:'실물 지폐·동전. 경제규모 따라 완만히 늘어나는 <b>구조적 항목</b>(유동성 분석에선 거의 고정).' },
    { label:'재무부 계정', en:'TGA', fred:'WTREGEN', date:dOf('tga'),
      full:'Deposits: U.S. Treasury, General Account', val:M.tga, color:'#a78bfa',
      desc:'미 재무부의 연준 예금(정부 통장). <b>늘면 시중 돈을 빨아들이고</b>(긴축 효과), 줄면 시중에 푼다. 국채발행·세금에 따라 출렁.' },
    { label:'역레포', en:'Reverse Repo', fred:'RRPONTSYD', date:dOf('rrp'),
      full:'Overnight Reverse Repurchase Agreements', val:M.rrp, color:'#f97316',
      desc:'MMF 등이 하루짜리로 연준에 맡긴 돈. <b>여유 유동성의 저수지</b> — 줄면 그 돈이 시중·준비금으로 이동(완화적).' },
    { label:'기타·자본', en:'Other', fred:'WALCL − 부채4종', date:dOf('fedbs'),
      full:'연준 자본금, 기타 예금 등', val:other, color:'#64748b',
      desc:'연준 자본금, 기타 예금 등 나머지 부채.' },
  ].filter(x => x.val != null && x.val > 0);

  const barSeg = (items) => items.map(it =>
    `<div title="${it.label} ${T(it.val)}" style="width:${pct(it.val).toFixed(2)}%;background:${it.color}" class="h-full"></div>`
  ).join('');

  // 국채 하위 분해 (A안) — 항목별 비중·금액·원화·기준일
  const treSubHtml = (sub, base) => {
    if (!sub || !sub.length) return '';
    return `
      <div class="mt-2 pt-2 border-t border-gray-700/50">
        <div class="text-[10px] text-gray-500 mb-1">↳ 국채 만기·유형별</div>
        <div class="space-y-0.5">
          ${sub.map(s => `<div class="text-[10px] text-cyan-300/90 flex flex-wrap items-baseline gap-x-1.5">
            <b>${s.label}</b> <b>${pctOf(s.val,base).toFixed(0)}%</b>
            <span class="text-gray-400">${T(s.val)}</span>
            <span class="text-gray-500">${W(s.val)}</span>
            ${s.fred?`<span class="text-gray-600">· ${s.fred}</span>`:''}
            ${s.date?`<span class="text-gray-600">· ${s.date}</span>`:''}
          </div>`).join('')}
        </div>
      </div>`;
  };

  // 한 변(자산 or 부채) 카드 세트
  const sideCards = (items) => items.map(it => `
    <div class="bg-[#0f1522] rounded-lg p-2.5 border-l-2" style="border-color:${it.color}">
      <div class="flex items-baseline justify-between">
        <span class="text-[12px] font-bold text-gray-200">${it.label} <span class="text-[9px] text-gray-500">${it.en}${it.fred?' · '+it.fred:''}</span></span>
        <span class="text-[12px] font-bold" style="color:${it.color}">${T(it.val)}${Wsub(it.val)} <span class="text-[9px] text-gray-500">${pct(it.val).toFixed(0)}%</span></span>
      </div>
      <div class="flex items-center justify-between mt-0.5">
        ${it.full?`<span class="text-[9px] text-gray-600 italic">FRED: ${it.full}</span>`:'<span></span>'}
        ${it.date?`<span class="text-[9px] text-gray-500 whitespace-nowrap">📅 ${it.date}</span>`:''}
      </div>
      <p class="text-[10px] text-gray-400 mt-1 leading-snug">${it.desc}</p>
      ${it.sub ? treSubHtml(it.sub, it.val) : ''}
    </div>`).join('');

  // 날짜 선택: WALCL(주간) 날짜 목록 → 드롭다운 (최신이 위)
  const wDates = (series.fedbs?.data || []).map(p => p.date);
  const minD = wDates[0] || '', maxD = wDates[wDates.length - 1] || '';
  // 스냅된 실제 기준일(asOf)로 최신 여부 판정 (예: 6/19 선택 → 6/17 스냅 → 최신)
  const isLatest = asOf === maxD;

  return `
  <div class="card p-4 mb-4" id="fedBSpanel">
    <div class="flex items-center justify-between mb-1 flex-wrap gap-2">
      <h2 class="text-sm font-bold text-white">🏦 연준(Fed) 대차대조표 <span class="text-cyan-400">${T(M.total)}</span>${Wsub(M.total)}</h2>
      <div class="flex items-center gap-2">
        <input type="text" value="${asOf}" placeholder="YYYY-MM-DD" maxlength="10" inputmode="numeric"
          title="날짜를 직접 입력(YYYY-MM-DD) 후 Enter — 해당 주 수요일로 자동 정렬"
          onkeydown="if(event.key==='Enter'){event.preventDefault();fedBSsetDate(this.value);}"
          onblur="fedBSsetDate(this.value)"
          class="bg-[#0f1522] border border-[#2a334a] text-gray-200 text-[11px] rounded px-2 py-1 w-28 text-center focus:border-cyan-500 outline-none">
        <input type="date" value="${asOf}" min="${minD}" max="${maxD}" title="달력으로 선택"
          onchange="fedBSsetDate(this.value)"
          class="bg-[#0f1522] border border-[#2a334a] text-gray-400 text-[11px] rounded px-1 py-1 w-7 overflow-hidden">
        ${!isLatest ? `<button onclick="fedBSsetDate('')" class="text-[10px] bg-[#e37500] hover:bg-[#ff8a1a] text-white px-2 py-1 rounded">최신</button>` : ''}
      </div>
    </div>
    <div class="flex items-center justify-between mb-2 flex-wrap gap-1">
      <span class="text-[10px] text-gray-500">기준일 ${asOf} · 출처 FRED${fxRate ? ` · 환율 ₩${fxRate.toLocaleString()}/$ (${fxDate})` : ''}</span>
      ${!isLatest ? `<span class="text-[10px] text-amber-300">📌 과거 시점 조회 중 (최신 ${maxD})</span>` : ''}
    </div>
    <p class="text-[11px] text-gray-400 mb-3"><b class="text-cyan-300">자산</b>(연준이 보유한 것) = <b class="text-pink-300">부채</b>(연준이 갚을 것). 양쪽 합계는 항상 같습니다 (회계 항등식).</p>

    <!-- 좌(자산) / 우(부채) 2단 구성 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- ◀ 자산 -->
      <div class="rounded-lg p-3" style="background:rgba(8,145,178,0.06);border:1px solid rgba(8,145,178,0.25)">
        <div class="flex justify-between items-baseline mb-2">
          <span class="text-[13px] text-cyan-300 font-bold">◀ 자산 (보유)</span>
          <span class="text-[12px] text-gray-300 font-bold">${T(M.total)}${Wsub(M.total)}</span>
        </div>
        <div class="flex h-7 rounded overflow-hidden border border-gray-700 mb-1">${barSeg(assets)}</div>
        <div class="flex flex-wrap gap-x-3 gap-y-0.5 mb-2">
          ${assets.map(it => `<span class="text-[10px]" style="color:${it.color}">● ${it.label} ${pct(it.val).toFixed(0)}%</span>`).join('')}
        </div>
        <div class="space-y-2">${sideCards(assets)}</div>
      </div>

      <!-- ▶ 부채 -->
      <div class="rounded-lg p-3" style="background:rgba(236,72,153,0.06);border:1px solid rgba(236,72,153,0.25)">
        <div class="flex justify-between items-baseline mb-2">
          <span class="text-[13px] text-pink-300 font-bold">부채 (갚을 돈) ▶</span>
          <span class="text-[12px] text-gray-300 font-bold">${T(M.total)}${Wsub(M.total)}</span>
        </div>
        <div class="flex h-7 rounded overflow-hidden border border-gray-700 mb-1">${barSeg(liab)}</div>
        <div class="flex flex-wrap gap-x-3 gap-y-0.5 mb-2">
          ${liab.map(it => `<span class="text-[10px]" style="color:${it.color}">● ${it.label} ${pct(it.val).toFixed(0)}%</span>`).join('')}
        </div>
        <div class="space-y-2">${sideCards(liab)}</div>
      </div>

    </div>

    <p class="text-[10px] text-gray-500 mt-3 leading-snug">
      💡 <b>순유동성(Net Liquidity)</b> ≈ 연준 총자산 − 재무부계정(TGA) − 역레포(RRP). 준비금이 늘고 TGA·RRP가 줄면 시중 유동성이 풍부해져 위험자산에 우호적입니다.
    </p>
  </div>`;
}

// 대차대조표 기준일 변경 (서버 호출 없이 클라이언트 데이터로 재구성)
function fedBSsetDate(date) {
  if (!_liqData || !_liqData.series) return;
  const panel = document.getElementById('fedBSpanel');
  if (!panel) return;
  let target = (date || '').trim();
  if (target) {
    // 입력 정규화: 8자리 숫자(20020618)도 허용 → YYYY-MM-DD
    const digits = target.replace(/[^0-9]/g, '');
    if (/^\d{8}$/.test(digits)) target = digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6,8);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(target)) return;  // 형식 안 맞으면 무시
    // 가용 범위로 클램프
    const arr = _liqData.series.fedbs?.data || [];
    const minD = arr[0]?.date, maxD = arr[arr.length-1]?.date;
    if (minD && target < minD) target = minD;
    if (maxD && target > maxD) target = maxD;
  }
  panel.outerHTML = renderFedBalanceSheet(_liqData.series, target || undefined);
}
window.fedBSsetDate = fedBSsetDate;

function renderLiquidity(data) {
  _liqData = data;
  window._recessions = data.recessions || [];
  const { series, netLiquidity } = data;
  const el = document.getElementById('content');


  // Current values summary
  const summaryCards = [
    // 지급준비금·연준총자산·TGA·역레포는 상단 대차대조표 도식과 중복 → 제외
    // 도식에 없는 고유 지표만 표시
    { key: 'm2', label: 'M2 통화', series: series.m2, fmt: v => '$' + (v/1e3).toFixed(1) + 'T', color: 'text-green-400' },
    { key: 'fedfunds', label: 'Fed Funds Rate', series: series.fedfunds, fmt: v => v.toFixed(2) + '%', color: 'text-yellow-400' },
    { key: 'mmf_total', label: 'MMF 소매잔고', series: series.mmf_total, fmt: v => '$' + (v/1000).toFixed(2) + 'T', color: 'text-emerald-400' },
  ];

  let html = "";

  // ═══ 연준 대차대조표 도식 (자산 = 부채) ═══════════════════════════════════
  html += renderFedBalanceSheet(series);

  const _fxRate = series.usdkrw?.latest?.value || null;  // 전일 원/달러
  html += '<div class="grid grid-cols-3 gap-3 mb-4">';
  summaryCards.forEach(c => {
    const latest = c.data ? c.data.latest : c.series?.latest;
    const val = latest ? c.fmt(latest.value) : '-';
    const date = latest ? latest.date : '-';
    const desc = c.data ? c.data.meta?.description : c.series?.meta?.description || '';
    // 원화 병기 ($ 항목만 — M2·MMF는 Billions$ 단위, 금리는 제외)
    let krwStr = '';
    if (_fxRate && latest && (c.key === 'm2' || c.key === 'mmf_total')) {
      const jo = (latest.value * 1e9 * _fxRate) / 1e12;   // Billions$ → 원 → 조원
      krwStr = jo >= 10000 ? '₩' + (jo/10000).toFixed(2) + '경' : '₩' + Math.round(jo).toLocaleString() + '조';
    }
    html += `<div class="card p-3 text-center">
      <p class="text-[10px] text-gray-500">${c.label}</p>
      <p class="text-xl font-bold ${c.color} mt-1">${val}</p>
      ${krwStr ? `<p class="text-[10px] text-gray-400">${krwStr}</p>` : ''}
      <p class="text-[9px] text-gray-600 mt-1">${date}</p>
      <p class="text-[9px] text-gray-500">${desc}</p>
    </div>`;
  });
  html += '</div>';

  // Chart sections
  const chartConfigs = [
    { id: 'liqReservesChart', title: 'Bank Reserves (WRESBAL) - 은행 지급준비금', keys: ['reserves'], spxOverlay: true, height: 320, desc: '시중은행이 Fed에 예치한 잔액', canLog: true },
    { id: 'liqRatesChart', title: 'Fed 정책금리 (FEDFUNDS, IORB, ON RRP Rate)', keys: ['fedfunds', 'iorb', 'rrprate'], spxOverlay: true, height: 280, desc: 'Fed Funds (정책), IORB (지급준비금 이자), ON RRP Rate (MMF용) + S&P 500 오버레이 | 단위: %', canLog: false },
    { id: 'liqFedbsChart', title: 'Fed Balance Sheet (WALCL)', keys: ['fedbs'], spxOverlay: true, height: 280, desc: 'Fed 총자산', canLog: true },
    { id: 'liqCompositionChart', title: 'Fed 부채 구성 (Stacked)', keys: [], spxOverlay: false, height: 360, desc: '부채 합계: Reserves + RRP + TGA + Currency + 기타 (= WALCL)', canLog: false, customType: 'stacked' },
    { id: 'liqCurrencyChart', title: '유통 현금 & 기타 부채 (WCURCIR)', keys: [], spxOverlay: false, height: 260, desc: '유통현금 (WCURCIR) 및 기타 = WALCL - Reserves - RRP - TGA - Currency | 단위: $T', canLog: false, customType: 'currencyOther' },
    { id: 'liqRrpChart', title: 'Reverse Repo (RRPONTSYD)', keys: ['rrp'], spxOverlay: true, height: 280, desc: 'MMF 등이 Fed에 예치한 역레포 잔액 (단위: $T)', canLog: true, defaultScale: 'lin' },
    { id: 'liqTgaChart', title: 'Treasury General Account (WTREGEN)', keys: ['tga'], spxOverlay: true, height: 280, desc: '재무부 Fed 예치 잔액', canLog: true },
    { id: 'liqM2Chart', title: 'M2 Money Supply (M2SL)', keys: ['m2'], spxOverlay: false, height: 280, desc: 'M2 광의통화', canLog: true },
    { id: 'liqMoneyMultChart', title: '통화승수 — 연준 공급 대비 시장 통화량 (M2 ÷ 본원통화)', keys: [], spxOverlay: false, height: 320, desc: '좌축 $T: M2 + 본원통화(BOGMBASE) · 우축 배수: 통화승수(M2÷본원통화). 승수 ↑=신용창조 활발, ↓=돈이 갇힘 (2008 ~9배→현재 ~4배). ※본원통화 ≈ 지급준비금+유통화폐, 차이는 은행 금고 내 현금(vault cash) 처리 방식 — 약 0.5%', canLog: true, defaultScale: 'lin', customType: 'moneyMult' },
    { id: 'liqMmfChart', title: 'MMF 소매 잔고 (WRMFNS)', keys: ['mmf_retail'], spxOverlay: true, height: 300, desc: '소매(Retail) MMF 잔고 — 고금리일수록 상승, 위험선호 시 감소 | 기관 MMF 주간 데이터는 2021년 이후 FRED 미제공', canLog: false, customType: 'mmfStacked' },
  ];

function drawSoxVolChart(period) {
  if (!_soxVolData) return;
  window._soxVolPeriod = period;
  ['1Y','3Y','5Y','ALL'].forEach(p => { const b=document.getElementById('soxvolp-'+p); if(b) b.className = 'px-2 py-0.5 text-xs rounded ' + (p===period?'bg-blue-600 text-white':'bg-gray-700 text-gray-300 hover:bg-gray-600'); });

  const canvas = document.getElementById('soxVolChart');
  if (!canvas) return;
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;               // 고해상도 선명하게
  const W = rect.width, H = 300;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);                 // 논리좌표(W,H)로 그리되 물리픽셀 해상도
  const pad = { top: 28, right: 52, bottom: 30, left: 40 };   // 우축(SOX) 공간 확보

  const cutoffMap = { '1Y':365, '3Y':1095, '5Y':1825, 'ALL':99999 };
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (cutoffMap[period]||1095));
  const cutoffStr = cutoff.toISOString().slice(0,10);

  const lines = [
    { key:'vxn',   data: (_soxVolData.vxn?.series||[]).filter(d=>d.date>=cutoffStr),   color:'#22d3ee', label:'^VXN 기대변동성' },
    { key:'soxRV', data: (_soxVolData.soxRV?.series||[]).filter(d=>d.date>=cutoffStr), color:'#fbbf24', label:'SOX 실현변동성' },
    { key:'vix',   data: (_soxVolData.vix?.series||[]).filter(d=>d.date>=cutoffStr),   color:'#94a3b8', label:'^VIX 참고' },
  ].filter(l => l.data.length > 1);
  if (!lines.length) return;
  // SOX 지수 (우축)
  const soxData = (_soxVolData.sox?.series||[]).filter(d=>d.date>=cutoffStr);

  const allV = lines.flatMap(l => l.data.map(d=>d.value));
  const vMin = Math.max(0, Math.min(...allV)*0.9), vMax = Math.max(...allV)*1.05;
  const soxMin = soxData.length ? Math.min(...soxData.map(d=>d.value))*0.95 : 0;
  const soxMax = soxData.length ? Math.max(...soxData.map(d=>d.value))*1.05 : 1;
  const allDates = [...new Set(lines.flatMap(l=>l.data.map(d=>d.date)))].sort();
  const firstMs = new Date(allDates[0]).getTime(), lastMs = new Date(allDates[allDates.length-1]).getTime();
  const totalMs = lastMs - firstMs || 1;
  const xOf = d => pad.left + ((new Date(d).getTime()-firstMs)/totalMs)*(W-pad.left-pad.right);
  const yOf = v => pad.top + (1-(v-vMin)/(vMax-vMin))*(H-pad.top-pad.bottom);      // 좌축(변동성)
  const yR  = v => pad.top + (1-(v-soxMin)/(soxMax-soxMin))*(H-pad.top-pad.bottom); // 우축(SOX)

  ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
  try { drawRecessionShading(ctx, pad, H-pad.top-pad.bottom, W-pad.left-pad.right, firstMs, lastMs, xOf); } catch {}
  // 좌축 격자·라벨 (변동성 %)
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
  for (let i=0;i<=5;i++){ const v=vMin+(vMax-vMin)*(i/5); const y=yOf(v);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText(v.toFixed(0), pad.left-4, y+3); }
  // 우축 라벨 (SOX 지수)
  if (soxData.length) { ctx.textAlign='left';
    for (let i=0;i<=5;i++){ const v=soxMin+(soxMax-soxMin)*(i/5);
      ctx.fillStyle='#e879f9'; ctx.font='10px sans-serif'; ctx.fillText(Math.round(v).toLocaleString(), W-pad.right+4, yR(v)+3); } }
  // X
  ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  for (let i=0;i<=6;i++){ const idx=Math.round(i/6*(allDates.length-1)); ctx.fillText(allDates[idx].slice(0,7), xOf(allDates[idx]), H-6); }
  // SOX 지수 선 (우축, 자홍) — 변동성 선보다 먼저(뒤에) 그림
  if (soxData.length) { ctx.beginPath(); ctx.strokeStyle='#e879f9'; ctx.lineWidth=1.6;
    soxData.forEach((d,i)=>{ const x=xOf(d.date), y=yR(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke(); }
  // 변동성 선
  lines.forEach(l => {
    ctx.beginPath(); ctx.strokeStyle=l.color; ctx.lineWidth = l.key==='vix'?1.2:2;
    l.data.forEach((d,i)=>{ const x=xOf(d.date), y=yOf(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke();
  });
  // 범례
  ctx.textAlign='left'; ctx.font='bold 11px sans-serif'; let lx = pad.left;
  lines.forEach(l => { const last=l.data[l.data.length-1];
    ctx.fillStyle=l.color; ctx.fillRect(lx,10,12,3);
    ctx.fillStyle='#e2e8f0'; const t=l.label+' '+last.value.toFixed(1); ctx.fillText(t, lx+15, 18); lx += ctx.measureText(t).width + 30; });
  if (soxData.length) { const lastS=soxData[soxData.length-1];
    ctx.fillStyle='#e879f9'; ctx.fillRect(lx,10,12,3);
    ctx.fillStyle='#e2e8f0'; ctx.fillText('^SOX(우) '+Math.round(lastS.value).toLocaleString(), lx+15, 18); }

  // ── 호버 툴팁 (crosshair) ──────────────────────────────
  let tip = document.getElementById('soxVolTooltip');
  if (!tip) { tip=document.createElement('div'); tip.id='soxVolTooltip'; tip.className='fixed bg-gray-900/95 border border-gray-600 text-[11px] text-white px-3 py-2 rounded pointer-events-none z-50 hidden leading-relaxed'; document.body.appendChild(tip); }
  // 각 선을 날짜맵으로 (근접값 조회)
  const maps = lines.map(l => ({ ...l, map: new Map(l.data.map(d=>[d.date, d.value])) }));
  const soxMap = new Map(soxData.map(d=>[d.date, d.value]));
  if (canvas._svMove) canvas.removeEventListener('mousemove', canvas._svMove);
  if (canvas._svLeave) canvas.removeEventListener('mouseleave', canvas._svLeave);
  canvas._svMove = ev => {
    const br = canvas.getBoundingClientRect();
    const mx = (ev.clientX - br.left);   // CSS px (논리좌표와 동일)
    if (mx < pad.left || mx > W - pad.right) { tip.classList.add('hidden'); return; }
    // mx → 날짜
    const ratio = (mx - pad.left) / (W - pad.left - pad.right);
    const idx = Math.max(0, Math.min(allDates.length-1, Math.round(ratio*(allDates.length-1))));
    const date = allDates[idx];
    const cx = xOf(date);
    // 재그리기 없이 크로스헤어만: 이전 오버레이 지우려 전체 재그림
    drawSoxVolBase();
    ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(cx, pad.top); ctx.lineTo(cx, H-pad.bottom); ctx.stroke(); ctx.setLineDash([]);
    let rows = '<b>'+date+'</b>';
    maps.forEach(l => { const v=l.map.get(date); if(v!=null){ ctx.fillStyle=l.color; ctx.beginPath(); ctx.arc(cx, yOf(v), 3, 0, 7); ctx.fill(); rows += '<br><span style="color:'+l.color+'">'+l.label.replace(' 기대변동성','').replace(' 실현변동성',' RV').replace(' 참고','')+':</span> '+v.toFixed(1); } });
    const sv = soxMap.get(date); if (sv!=null){ ctx.fillStyle='#e879f9'; ctx.beginPath(); ctx.arc(cx, yR(sv), 3, 0, 7); ctx.fill(); rows += '<br><span style="color:#e879f9">^SOX:</span> '+Math.round(sv).toLocaleString(); }
    tip.innerHTML = rows;
    tip.classList.remove('hidden');
    tip.style.left = (ev.clientX+15+180>window.innerWidth?ev.clientX-195:ev.clientX+15)+'px';
    tip.style.top = Math.max(5, ev.clientY-60)+'px';
  };
  canvas._svLeave = () => { tip.classList.add('hidden'); drawSoxVolBase(); };
  canvas.addEventListener('mousemove', canvas._svMove);
  canvas.addEventListener('mouseleave', canvas._svLeave);

  // 크로스헤어용: 기본 차트만 다시 그리는 내부 함수 (선·격자·범례·우축 SOX)
  function drawSoxVolBase() {
    ctx.fillStyle = '#1a1d27'; ctx.fillRect(0,0,W,H);
    try { drawRecessionShading(ctx, pad, H-pad.top-pad.bottom, W-pad.left-pad.right, firstMs, lastMs, xOf); } catch {}
    ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;
    for (let i=0;i<=5;i++){ const v=vMin+(vMax-vMin)*(i/5); const y=yOf(v);
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
      ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText(v.toFixed(0), pad.left-4, y+3); }
    if (soxData.length) { ctx.textAlign='left';
      for (let i=0;i<=5;i++){ const v=soxMin+(soxMax-soxMin)*(i/5); ctx.fillStyle='#e879f9'; ctx.font='10px sans-serif'; ctx.fillText(Math.round(v).toLocaleString(), W-pad.right+4, yR(v)+3); } }
    ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    for (let i=0;i<=6;i++){ const idx2=Math.round(i/6*(allDates.length-1)); ctx.fillText(allDates[idx2].slice(0,7), xOf(allDates[idx2]), H-6); }
    if (soxData.length) { ctx.beginPath(); ctx.strokeStyle='#e879f9'; ctx.lineWidth=1.6;
      soxData.forEach((d,i)=>{ const x=xOf(d.date), y=yR(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke(); }
    lines.forEach(l => { ctx.beginPath(); ctx.strokeStyle=l.color; ctx.lineWidth = l.key==='vix'?1.2:2;
      l.data.forEach((d,i)=>{ const x=xOf(d.date), y=yOf(d.value); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }); ctx.stroke(); });
    ctx.textAlign='left'; ctx.font='bold 11px sans-serif'; let lx2 = pad.left;
    lines.forEach(l => { const last=l.data[l.data.length-1]; ctx.fillStyle=l.color; ctx.fillRect(lx2,10,12,3);
      ctx.fillStyle='#e2e8f0'; const t=l.label+' '+last.value.toFixed(1); ctx.fillText(t, lx2+15, 18); lx2 += ctx.measureText(t).width + 30; });
    if (soxData.length) { const lastS=soxData[soxData.length-1]; ctx.fillStyle='#e879f9'; ctx.fillRect(lx2,10,12,3);
      ctx.fillStyle='#e2e8f0'; ctx.fillText('^SOX(우) '+Math.round(lastS.value).toLocaleString(), lx2+15, 18); }
  }
}

// ????   Canvas  ??????????????????????????????????????????????????????????????????????????????????????????????????????????
function drawFedPathChart(data) {
  const canvas = document.getElementById('fedPathChart');
  if (!canvas) return;
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth;
  canvas.height = parent.clientHeight;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');

  const PAD = { top: 20, right: 20, bottom: 50, left: 48 };
  const W2 = W - PAD.left - PAD.right;
  const H2 = H - PAD.top - PAD.bottom;

  const { currentRate, impliedPath, dotPlot, rateHistory } = data;
  const dp = dotPlot;

  // ???????(lower / upper bound)
  const histLower = (rateHistory?.lower || []);
  const histUpper = (rateHistory?.upper || []);

  // ? x?
  const today = new Date().toISOString().slice(0, 10);
  const pastDate = histLower.length > 0 ? histLower[0].date :
                   new Date(Date.now() - 365*3*24*3600*1000).toISOString().slice(0,10);
  const futureDate = impliedPath.length > 0 ? impliedPath[impliedPath.length-1].date :
                     new Date(Date.now() + 365*2*24*3600*1000).toISOString().slice(0,10);

  const allDates = [pastDate, ...impliedPath.map(p => p.date), futureDate];
  if (dp?.medianRate) {
    Object.keys(dp.medianRate).filter(k => k !== 'LongerRun').forEach(yr => {
      allDates.push(`${yr}-12-31`);
    });
  }
  const minDate = allDates.reduce((a,b) => a<b?a:b);
  const maxDate = allDates.reduce((a,b) => a>b?a:b);

  // Y? (  ?)
  const allRates = [
    ...histLower.map(d => d.value),
    ...histUpper.map(d => d.value),
    ...impliedPath.map(p => p.impliedRate),
    ...Object.values(dp?.medianRate || {}).filter(v => typeof v === 'number'),
    currentRate.lower, currentRate.upper,
  ];
  const minRate = Math.max(0, Math.floor((Math.min(...allRates) - 0.5) * 4) / 4);
  const maxRate = Math.ceil((Math.max(...allRates) + 0.5) * 4) / 4;

  function xPos(dateStr) {
    const t = new Date(dateStr).getTime();
    const mn = new Date(minDate).getTime();
    const mx = new Date(maxDate).getTime();
    return PAD.left + (t - mn) / (mx - mn) * W2;
  }
  function yPos(rate) {
    return PAD.top + (1 - (rate - minRate) / (maxRate - minRate)) * H2;
  }

  ctx.clearRect(0, 0, W, H);

  // 
  ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
  const rateStep = (maxRate - minRate) <= 4 ? 0.25 : 0.5;
  for (let r = minRate; r <= maxRate + 0.001; r += rateStep) {
    const y = yPos(r);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + W2, y); ctx.stroke();
    ctx.fillStyle = '#6B7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(r.toFixed(2) + '%', PAD.left - 4, y + 3);
  }

  // ? ??
  const todayX = xPos(today);
  ctx.strokeStyle = '#4B5563'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(todayX, PAD.top); ctx.lineTo(todayX, PAD.top + H2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#6B7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Today', todayX, PAD.top + H2 + 12);

  // ????  (upper - lower ?)
  if (histLower.length > 0 && histUpper.length > 0) {
    ctx.fillStyle = 'rgba(251,191,36,0.08)';
    ctx.beginPath();
    histUpper.forEach((d, i) => {
      const x = xPos(d.date), y = yPos(d.value);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    [...histLower].reverse().forEach(d => {
      ctx.lineTo(xPos(d.date), yPos(d.value));
    });
    ctx.closePath(); ctx.fill();

    // ???(lower bound)
    ctx.strokeStyle = 'rgba(251,191,36,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    histLower.forEach((d, i) => {
      const x = xPos(d.date), y = yPos(d.value);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  } else {
    // ?? ???  ???
    ctx.strokeStyle = 'rgba(251,191,36,0.4)'; ctx.lineWidth = 1.5; ctx.setLineDash([6,3]);
    const minX = xPos(minDate), nowX = xPos(today);
    const midY = yPos(currentRate.midpoint);
    ctx.beginPath(); ctx.moveTo(minX, midY); ctx.lineTo(nowX, midY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ? ?  (?, ???
  ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
  ctx.beginPath();
  impliedPath.forEach((p, i) => {
    const x = xPos(p.date), y = yPos(p.impliedRate);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // ? ??
  impliedPath.forEach(p => {
    ctx.beginPath();
    ctx.arc(xPos(p.date), yPos(p.impliedRate), 3, 0, Math.PI * 2);
    ctx.fillStyle = '#22d3ee'; ctx.fill();
  });

  // Dot Plot ?(?, ???)
  if (dp?.medianRate) {
    const dpYears = Object.entries(dp.medianRate).filter(([k]) => k !== 'LongerRun');
    const dpPoints = [[today, currentRate.midpoint], ...dpYears.map(([yr, rate]) => [`${yr}-12-31`, rate])];
    ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath();
    dpPoints.forEach(([date, rate], i) => {
      const x = xPos(date), y = yPos(rate);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.setLineDash([]);
    dpYears.forEach(([yr, rate]) => {
      const x = xPos(`${yr}-12-31`), y = yPos(rate);
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#a855f7'; ctx.fill();
      ctx.fillStyle = '#e9d5ff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(rate.toFixed(2), x, y - 8);
    });
  }

  // ?  ??(???
  const nowX = xPos(today), nowY = yPos(currentRate.midpoint);
  ctx.beginPath(); ctx.arc(nowX, nowY, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fbbf24'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#fde68a'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(currentRate.midpoint.toFixed(3) + '%', nowX, nowY - 10);

  // X?? ??
  ctx.fillStyle = '#6B7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  const labelPoints = [
    ...impliedPath.filter((_, i) => i % 2 === 0).slice(0, 8),
  ];
  labelPoints.forEach(p => {
    const x = xPos(p.date);
    ctx.fillText(p.label.replace(' 20', ' \''), x, PAD.top + H2 + 24);
  });
}

// ???? FOMC Dot Plot  Bar  ??????????????????????????????????????????????????????????????????????????????????????????????
function drawDotPlotChart(dp) {
  const canvas = document.getElementById('dotPlotChart');
  if (!canvas) return;
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth;
  canvas.height = parent.clientHeight;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');

  const PAD = { top: 20, right: 20, bottom: 50, left: 45 };
  const W2 = W - PAD.left - PAD.right;
  const H2 = H - PAD.top - PAD.bottom;

  const dist = dp.distribution;
  const years = Object.keys(dist[0]?.counts || {}).slice(0, 3);
  const colors = ['rgba(96,165,250,0.75)','rgba(52,211,153,0.75)','rgba(251,191,36,0.75)'];

  //  rate ?(Y?
  const rates = dist.map(d => d.rate).sort((a,b) => a-b);
  const minRate = rates[0] - 0.125;
  const maxRate = rates[rates.length - 1] + 0.125;

  // Max count (X?- ? ?)
  let maxCount = 0;
  dist.forEach(d => {
    let sum = years.reduce((s, y) => s + (d.counts[y] || 0), 0);
    maxCount = Math.max(maxCount, sum);
  });

  function yPos(rate) {
    return PAD.top + (1 - (rate - minRate) / (maxRate - minRate)) * H2;
  }
  function xPos(count) {
    return PAD.left + (count / (maxCount + 1)) * W2;
  }

  ctx.clearRect(0, 0, W, H);

  const barH = Math.min(H2 / rates.length * 0.7, 18);

  // Y? (rate labels)
  rates.forEach(rate => {
    const y = yPos(rate);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + W2, y); ctx.stroke();
    ctx.fillStyle = '#6B7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(rate.toFixed(3) + '%', PAD.left - 4, y + 3);
  });

  // X? (count labels)
  for (let c = 0; c <= maxCount; c++) {
    if (c % 2 !== 0 && maxCount > 8) continue;
    const x = xPos(c);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, PAD.top + H2); ctx.stroke();
    ctx.fillStyle = '#6B7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(c + '월', x, PAD.top + H2 + 14);
  }

  // ? (? ???)
  dist.forEach(d => {
    const y = yPos(d.rate) - barH / 2;
    let xStart = PAD.left;
    years.forEach((yr, i) => {
      const cnt = d.counts[yr] || 0;
      if (cnt <= 0) return;
      const barW = xPos(cnt) - PAD.left;
      ctx.fillStyle = colors[i];
      ctx.fillRect(xStart, y, barW, barH);
      if (cnt > 0 && barW > 12) {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(cnt, xStart + barW / 2, y + barH * 0.7);
      }
      xStart += barW;
    });
  });

  // Dot Plot ????
  Object.entries(dp.medianRate || {}).filter(([k]) => k !== 'LongerRun').forEach(([yr, rate], i) => {
    const y = yPos(rate);
    ctx.strokeStyle = colors[i] || '#fff'; ctx.lineWidth = 2; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + W2, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = colors[i] || '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('중앙값 ' + rate.toFixed(2) + '%', PAD.left + 2, y - 3);
  });

  ctx.fillStyle = '#9CA3AF'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('전망 연도 (FOMC 점도표)', PAD.left + W2 / 2, PAD.top + H2 + 30);
}

// NBER   ? (  )
function drawRecessionShading(ctx, pad, ch, cw, firstMs, lastMs, dateToX) {
  const recessions = window._recessions || [];
  if (!recessions.length) return;
  ctx.fillStyle = 'rgba(148, 163, 184, 0.15)';
  // ? ?
  for (const rec of recessions) {
    const s = new Date(rec.start).getTime();
    const e = new Date(rec.end).getTime();
    //  ?? ??
    if (e < firstMs || s > lastMs) continue;
    const xs = dateToX(new Date(Math.max(s, firstMs)).toISOString().split('T')[0]);
    const xe = dateToX(new Date(Math.min(e, lastMs)).toISOString().split('T')[0]);
    ctx.fillRect(xs, pad.top, xe - xs, ch);
  }
}

// MMF Stacked Chart (Retail + Institutional, SPX 오버레이)
function drawMmfStackedChart(period) {
  if (!_liqData) return;
  window._liqPeriods = window._liqPeriods || {};
  window._liqPeriods['liqMmfChart'] = period;

  const canvas = document.getElementById('liqMmfChart');
  if (!canvas) return;
  const W = canvas.width = canvas.parentElement.getBoundingClientRect().width;
  const H = canvas.height = 300;
  const ctx = canvas.getContext('2d');
  const pad = { top: 24, right: 64, bottom: 36, left: 72 };
  const cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;

  const retailRaw = _liqData.series.mmf_retail?.data || [];
  const instRaw   = _liqData.series.mmf_inst?.data   || [];  // 2021년 이후 FRED 미제공
  const spxRaw    = _liqData.series.sp500?.data       || [];
  const retailOnly = instRaw.length === 0;

  // 기간 필터
  let cutoff = '1900-01-01';
  if (period !== 'ALL') {
    const d = new Date();
    if (period === '1Y') d.setFullYear(d.getFullYear() - 1);
    else if (period === '3Y') d.setFullYear(d.getFullYear() - 3);
    else if (period === '5Y') d.setFullYear(d.getFullYear() - 5);
    else if (period === '10Y') d.setFullYear(d.getFullYear() - 10);
    cutoff = d.toISOString().split('T')[0];
  }

  const retailMap = new Map(retailRaw.map(d => [d.date, d.value]));
  const instMap   = new Map(instRaw.map(d => [d.date, d.value]));

  // 날짜 합집합 (retail 기준, inst forward-fill)
  const allDates = [...new Set([...retailRaw.map(d => d.date), ...instRaw.map(d => d.date)])]
    .filter(d => d >= cutoff).sort();

  const points = [];
  let lastInst = 0;
  for (const date of allDates) {
    const iv = instMap.get(date);
    if (iv != null) lastInst = iv;
    const rv = retailMap.get(date);
    if (rv != null) {
      // retailOnly 모드: inst=0, total=retail
      points.push({ date, retail: rv, inst: lastInst, total: rv + lastInst });
    }
  }
  if (!points.length) return;

  const maxTotal = Math.max(...points.map(p => p.total));
  const minTotal = 0;
  const n = points.length;

  const xOf = i => pad.left + (i / (n - 1)) * cw;
  const yOf = v => pad.top + ch - ((v - minTotal) / (maxTotal - minTotal)) * ch;

  ctx.clearRect(0, 0, W, H);

  // 경기침체 음영
  if (points.length >= 2) {
    const firstMs = new Date(points[0].date).getTime();
    const lastMs  = new Date(points[points.length - 1].date).getTime();
    const dateToX = date => pad.left + ((new Date(date).getTime() - firstMs) / (lastMs - firstMs)) * cw;
    drawRecessionShading(ctx, pad, ch, cw, firstMs, lastMs, dateToX);
  }

  // 스택 영역: 기관(아래) + 개인(위)
  // 기관 영역
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(0));
  points.forEach((p, i) => ctx.lineTo(xOf(i), yOf(p.inst)));
  ctx.lineTo(xOf(n - 1), yOf(0));
  ctx.closePath();
  ctx.fillStyle = 'rgba(52,211,153,0.35)';
  ctx.fill();

  // 개인 영역 (기관 위에 쌓임)
  ctx.beginPath();
  ctx.moveTo(xOf(0), yOf(points[0].inst));
  points.forEach((p, i) => ctx.lineTo(xOf(i), yOf(p.total)));
  points.slice().reverse().forEach((p, i) => ctx.lineTo(xOf(n - 1 - i), yOf(p.inst)));
  ctx.closePath();
  ctx.fillStyle = 'rgba(110,231,183,0.35)';
  ctx.fill();

  // 합계 라인
  ctx.beginPath();
  points.forEach((p, i) => i === 0 ? ctx.moveTo(xOf(i), yOf(p.total)) : ctx.lineTo(xOf(i), yOf(p.total)));
  ctx.strokeStyle = '#6ee7b7'; ctx.lineWidth = 2; ctx.stroke();

  // SPX 오버레이
  const spxFiltered = spxRaw.filter(d => d.date >= cutoff);
  if (spxFiltered.length > 1) {
    const minSpx = Math.min(...spxFiltered.map(d => d.value));
    const maxSpx = Math.max(...spxFiltered.map(d => d.value));
    const ySpx = v => pad.top + ch - ((v - minSpx) / (maxSpx - minSpx)) * ch;
    ctx.beginPath();
    spxFiltered.forEach((d, i) => {
      const xi = pad.left + ((new Date(d.date) - new Date(points[0].date)) / (new Date(points[n-1].date) - new Date(points[0].date))) * cw;
      i === 0 ? ctx.moveTo(xi, ySpx(d.value)) : ctx.lineTo(xi, ySpx(d.value));
    });
    ctx.strokeStyle = 'rgba(250,204,21,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  // Y축 눈금 (좌: MMF $T)
  ctx.fillStyle = '#6ee7b7'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  for (let t = 0; t <= 4; t++) {
    const v = minTotal + (maxTotal - minTotal) * (t / 4);
    const y = yOf(v);
    ctx.fillText('$' + (v / 1000).toFixed(1) + 'T', pad.left - 4, y + 3);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cw, y); ctx.stroke();
  }

  // X축 날짜
  ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(n / 6));
  for (let i = 0; i < n; i += step) {
    ctx.fillText(points[i].date.slice(0, 7), xOf(i), H - 6);
  }

  // 최신값 표시
  const last = points[points.length - 1];
  ctx.fillStyle = '#6ee7b7'; ctx.textAlign = 'left'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText((retailOnly ? '소매 ' : 'Total ') + '$' + (last.total / 1000).toFixed(2) + 'T', pad.left + 4, pad.top + 14);
  if (!retailOnly) {
    ctx.fillStyle = '#34d399'; ctx.font = '10px sans-serif';
    ctx.fillText('기관 $' + (last.inst / 1000).toFixed(2) + 'T  개인 $' + (last.retail / 1000).toFixed(2) + 'T', pad.left + 4, pad.top + 26);
  } else {
    ctx.fillStyle = '#9ca3af'; ctx.font = '9px sans-serif';
    ctx.fillText('기관 주간 데이터 미제공 (2021년~)', pad.left + 4, pad.top + 26);
  }

  // 범례
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(110,231,183,0.7)'; ctx.fillRect(W - pad.right + 2, pad.top, 10, 8);
  ctx.fillStyle = '#9ca3af'; ctx.font = '9px sans-serif';
  ctx.fillText(retailOnly ? '소매' : '개인', W - pad.right + 18, pad.top + 7);
  if (!retailOnly) {

// Fed ??? ?? ??????
function drawCompositionChart(period) {
  if (!_liqData) return;
  window._liqPeriods = window._liqPeriods || {};
  window._liqPeriods['liqCompositionChart'] = period;

  const canvas = document.getElementById('liqCompositionChart');
  if (!canvas) return;
  const container = canvas.parentElement;
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = 360;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top: 20, right: 120, bottom: 30, left: 65 };
  const cw = W - pad.left - pad.right;
  const ch = H - pad.top - pad.bottom;

  //  ?
  let cutoff = '1900-01-01';
  if (period !== 'ALL') {
    const d = new Date();
    const years = period === '1Y' ? 1 : period === '3Y' ? 3 : period === '5Y' ? 5 : 10;
    d.setFullYear(d.getFullYear() - years);
    cutoff = d.toISOString().split('T')[0];
  }

  // ??? ??  $M(Millions) ???
  // WALCL($M), Reserves($M), TGA($M), RRP($B ??*1000 = $M)
  const walclArr = (_liqData.series.fedbs?.data || []).filter(d => d.date >= cutoff);
  const reservesArr = (_liqData.series.reserves?.data || []).filter(d => d.date >= cutoff);
  const tgaArr = (_liqData.series.tga?.data || []).filter(d => d.date >= cutoff);
  const rrpArr = (_liqData.series.rrp?.data || []).filter(d => d.date >= cutoff);

  if (walclArr.length < 2) return;

  // WALCL ? ? (?????? ). ??? ? ? ? ???? ?forward-fill
  function buildMap(arr) {
    const sorted = [...arr].sort((a, b) => a.date.localeCompare(b.date));
    return { sorted, dates: sorted.map(d => d.date) };
  }
  function getAt(m, date) {
    const { sorted, dates } = m;
    let lo = 0, hi = dates.length - 1, found = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (dates[mid] <= date) { found = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return found >= 0 ? sorted[found].value : null;
  }
  const mapReserves = buildMap(reservesArr);
  const mapTga = buildMap(tgaArr);
  const mapRrp = buildMap(rrpArr);

  // ?WALCL ???????4??  (?: $T)
  const rows = [];
  for (const pt of walclArr) {
    const walcl = pt.value; // $M
    const reserves = getAt(mapReserves, pt.date);
    const tga = getAt(mapTga, pt.date);
    const rrpB = getAt(mapRrp, pt.date);
    if (walcl == null || reserves == null || tga == null) continue;
    const rrp = (rrpB || 0) * 1000; // $B ??$M
    const other = Math.max(0, walcl - reserves - tga - rrp); // ?? + ?
    rows.push({
      date: pt.date,
      total: walcl / 1e6,           // $T
      reserves: reserves / 1e6,
      tga: tga / 1e6,
      rrp: rrp / 1e6,
      other: other / 1e6,
    });
  }
  if (rows.length < 2) return;

  const firstMs = new Date(rows[0].date).getTime();
  const lastMs = new Date(rows[rows.length - 1].date).getTime();
  const totalMs = lastMs - firstMs || 1;
  const dateToX = d => pad.left + ((new Date(d).getTime() - firstMs) / totalMs) * cw;

  // Y ???? ? total ?
  const maxTotal = Math.max(...rows.map(r => r.total));
  const yMax = maxTotal * 1.05;
  const valToY = v => pad.top + ch * (1 - v / yMax);

  //  ????(sync  ?)
  document.querySelectorAll('[class*="liq-period-btn-"]').forEach(b => {
    const cls = b.className;
    const btnIdMatch = cls.match(/liq-period-btn-(\S+)/);
    const syncMatch = cls.match(/liq-period-sync-(\S+)/);
    if (!btnIdMatch || !syncMatch) return;
    const active = syncMatch[1] === period;
    b.className = 'liq-period-btn-' + btnIdMatch[1] + ' liq-period-sync-' + syncMatch[1] + ' px-2 py-0.5 text-xs rounded ' + (active ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600');
  });

  ctx.clearRect(0, 0, W, H);

  // NBER  ?
  drawRecessionShading(ctx, pad, ch, cw, firstMs, lastMs, dateToX);

  // Y?? + ??
  ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  const ySteps = 5;
  for (let i = 0; i <= ySteps; i++) {
    const v = yMax * i / ySteps;
    const y = valToY(v);
    ctx.fillText('$' + v.toFixed(1) + 'T', pad.left - 5, y + 3);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
  }

  // ? ? (????: Reserves ??TGA ??RRP ??Other
  const layers = [
    { key: 'reserves', color: '#f472b6', label: '지준금 (Reserves)' },
    { key: 'tga', color: '#c084fc', label: '재무부 (TGA)' },
    { key: 'rrp', color: '#fb923c', label: '역레포 (RRP)' },
    { key: 'other', color: '#94a3b8', label: '기타 + +' },
  ];

  // ?? ? ? 
  const cumHeights = rows.map(r => {
    let cum = 0;
    const out = {};
    for (const L of layers) {
      const bottom = cum;
      cum += r[L.key];
      out[L.key] = { bottom, top: cum };
    }
    return out;
  });

  // ? ????(????
  layers.forEach((L, li) => {
    ctx.beginPath();
    // ? 
    rows.forEach((r, i) => {
      const x = dateToX(r.date);
      const y = valToY(cumHeights[i][L.key].top);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    // ?  (?)
    for (let i = rows.length - 1; i >= 0; i--) {
      const x = dateToX(rows[i].date);
      const y = valToY(cumHeights[i][L.key].bottom);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = L.color;
    ctx.globalAlpha = 0.7;
    ctx.fill();
    ctx.globalAlpha = 1;
    // ??
    ctx.beginPath();
    rows.forEach((r, i) => {
      const x = dateToX(r.date);
      const y = valToY(cumHeights[i][L.key].top);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = L.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.9;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // ??(WALCL) ? ??
  ctx.beginPath();
  rows.forEach((r, i) => {
    const x = dateToX(r.date);
    const y = valToY(r.total);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ffffffdd'; ctx.lineWidth = 1.5;
  ctx.stroke();

  // X??
  ctx.fillStyle = '#6b7280'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  const spanDays = totalMs / 86400000;
  let ly = '';
  rows.forEach(r => {
    const yr = r.date.slice(0, 4);
    const show = spanDays > 1500 ? (yr !== ly) : (spanDays > 800 ? (yr !== ly && parseInt(yr) % 1 === 0) : (r.date.slice(0, 7) !== ly));
    if (show) {
      ctx.fillText(spanDays > 800 ? yr : r.date.slice(2, 7), dateToX(r.date), H - 5);
      ly = spanDays > 800 ? yr : r.date.slice(0, 7);
    }
  });

  // Legend (??
  const legX = W - pad.right + 10;
  ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
  const latest = rows[rows.length - 1];
  ctx.fillStyle = '#ffffff';
  ctx.fillText(' (' + latest.date.slice(0, 7) + ')', legX, pad.top + 10);
  let legY = pad.top + 25;
  [...layers].reverse().forEach(L => {
    ctx.fillStyle = L.color;
    ctx.fillRect(legX, legY - 8, 10, 10);
    ctx.fillStyle = '#f3f4f6';
    ctx.fillText(L.label.split(' ')[0], legX + 14, legY);
    ctx.fillStyle = '#d1d5db'; ctx.font = '9px sans-serif';
    ctx.fillText('$' + latest[L.key].toFixed(2) + 'T', legX + 14, legY + 11);
    ctx.font = '10px sans-serif';
    legY += 32;
  });
  // 
  ctx.fillStyle = '#ffffff'; ctx.fillRect(legX, legY - 8, 10, 2);
  ctx.fillText('WALCL', legX + 14, legY);
  ctx.fillStyle = '#d1d5db'; ctx.font = '9px sans-serif';
  ctx.fillText('$' + latest.total.toFixed(2) + 'T', legX + 14, legY + 11);

  // ? ?
  canvas._chartImage = ctx.getImageData(0, 0, W, H);
  let tooltipEl = document.getElementById('liqCompositionTooltip');
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.id = 'liqCompositionTooltip';
    tooltipEl.className = 'fixed bg-gray-900/95 border border-gray-600 text-[11px] text-white px-3 py-2 rounded pointer-events-none z-50 hidden leading-relaxed';
    document.body.appendChild(tooltipEl);
  }
  if (canvas._compMove) canvas.removeEventListener('mousemove', canvas._compMove);
  if (canvas._compLeave) canvas.removeEventListener('mouseleave', canvas._compLeave);
  canvas._compMove = (ev) => {
    const br = canvas.getBoundingClientRect();
    const mx = ev.clientX - br.left;
    if (mx < pad.left || mx > W - pad.right) { tooltipEl.classList.add('hidden'); return; }
    let closest = rows[0], minDist = Infinity, closestIdx = 0;
    rows.forEach((r, i) => {
      const dist = Math.abs(dateToX(r.date) - mx);
      if (dist < minDist) { minDist = dist; closest = r; closestIdx = i; }
    });
    ctx.putImageData(canvas._chartImage, 0, 0);
    const cx = dateToX(closest.date);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, pad.top); ctx.lineTo(cx, pad.top + ch); ctx.stroke();

    const pct = v => closest.total > 0 ? (v / closest.total * 100).toFixed(1) + '%' : '-';
    tooltipEl.innerHTML = '<b>' + closest.date + '</b>'
      + '<br><span style="color:#ffffff">WALCL 총자산</span> <b>$' + closest.total.toFixed(2) + 'T</b>'
      + '<hr style="margin:4px 0;border-color:#444">'
      + '<span style="color:#f472b6">Reserves:</span> $' + closest.reserves.toFixed(2) + 'T (' + pct(closest.reserves) + ')'
      + '<br><span style="color:#c084fc">TGA:</span> $' + closest.tga.toFixed(2) + 'T (' + pct(closest.tga) + ')'
      + '<br><span style="color:#fb923c">RRP:</span> $' + closest.rrp.toFixed(3) + 'T (' + pct(closest.rrp) + ')'
      + '<br><span style="color:#94a3b8">Currency+Other:</span> $' + closest.other.toFixed(2) + 'T (' + pct(closest.other) + ')';
    tooltipEl.classList.remove('hidden');
    tooltipEl.style.left = (ev.clientX + 15 + 260 > window.innerWidth ? ev.clientX - 270 : ev.clientX + 15) + 'px';
    tooltipEl.style.top = Math.max(5, ev.clientY - 50) + 'px';
  };
  canvas._compLeave = () => {
    tooltipEl.classList.add('hidden');
    if (canvas._chartImage) ctx.putImageData(canvas._chartImage, 0, 0);
  };
  canvas.addEventListener('mousemove', canvas._compMove);
  canvas.addEventListener('mouseleave', canvas._compLeave);
}
window.drawCompositionChart = drawCompositionChart;

function drawCurrencyOtherChart(period) {

  const cutoffStr = cutoff.toISOString().split('T')[0];

  // ? ??
  const fedbsArr = (_liqData.series.fedbs?.data     || []).filter(d => d.date >= cutoffStr);
  const resArr   = (_liqData.series.reserves?.data  || []).filter(d => d.date >= cutoffStr);

  const rrpArr   = (_liqData.series.rrp?.data        || []).filter(d => d.date >= cutoffStr);
  const currArr  = (_liqData.series.currency?.data   || []).filter(d => d.date >= cutoffStr);

  // fill-forward map ?
  function buildFfwdMap(arr, allDates) {
    const m = new Map(arr.map(d => [d.date, d.value]));
    const sorted = arr.map(d => d.date).sort();
    const result = new Map();
    let lastVal = null;
    for (const d of allDates) {
      const v = m.get(d);
      if (v !== undefined) lastVal = v;
      result.set(d, lastVal);
    }
    return result;
  }

  //  ?: fedbsArr ?
  const allDates = fedbsArr.map(d => d.date).sort();
  if (allDates.length < 2) { ctx.fillStyle = '#6b7280'; ctx.font = '12px sans-serif'; ctx.textAlign='center'; ctx.fillText('데이터 부족', W/2, H/2); return; }

  const mapCur  = buildFfwdMap(currArr, allDates);

  // ??? (?: $T)

    const fb  = d.value;

    const cur = mapCur.get(d.date) ?? 0;
    const oth = Math.max(0, fb - res - tga - rrp - cur);
    return { date: d.date, currency: cur / 1e6, other: oth / 1e6 };
  }).filter(p => p.currency > 0 || p.other > 0);

  if (points.length < 2) return;

  const allVals = points.flatMap(p => [p.currency, p.other]);

  // ??
  ctx.strokeStyle = '#2a2d3a'; ctx.lineWidth = 0.5;

  for (let i = 0; i <= yTicks; i++) {

    ctx.fillStyle = '#9ca3af'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';

  }

  // ? ????(?, ? ?)
  ctx.beginPath(); ctx.strokeStyle = '#d1d5db'; ctx.lineWidth = 1.8; ctx.setLineDash([5, 3]);
  points.forEach((p, i) => { const x = xOf(i), y = yOf(p.other); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke(); ctx.setLineDash([]);

  // ? ?? ?
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(points[0].other));
  points.forEach((p, i) => ctx.lineTo(xOf(i), yOf(p.other)));
  ctx.lineTo(xOf(points.length - 1), H - pad.bottom);
  ctx.lineTo(xOf(0), H - pad.bottom);
  ctx.closePath(); ctx.fillStyle = 'rgba(209,213,219,0.12)'; ctx.fill();

  // ?? ??(?????)

  points.forEach((p, i) => { const x = xOf(i), y = yOf(p.currency); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.stroke();

  // ??  ?
  ctx.beginPath(); ctx.moveTo(xOf(0), yOf(points[0].currency));
  points.forEach((p, i) => ctx.lineTo(xOf(i), yOf(p.currency)));
  ctx.lineTo(xOf(points.length - 1), H - pad.bottom);
  ctx.lineTo(xOf(0), H - pad.bottom);
  ctx.closePath(); ctx.fillStyle = 'rgba(96,165,250,0.12)'; ctx.fill();

  // ?
  const latestCur = points[points.length - 1].currency;

  ctx.fillStyle = '#d1d5db';
  ctx.fillText('기타 부채  $' + latestOth.toFixed(3) + 'T', pad.left + 258, 17);

  ctx.fillStyle = '#60a5fa';
